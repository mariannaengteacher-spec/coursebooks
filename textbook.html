                </div>
            </div>
        </div>
    </div>

    <!-- ===== СТАТУС-БАР ===== -->
    <div class="status-bar">
        <div class="status-left">
            <span id="statusLeft">📖 Готово</span>
            <span id="statusTool">👁️ Просмотр</span>
        </div>
        <span id="statusRight">Стр. <span id="statusPageNum">—</span> / <span id="statusTotalPages">—</span></span>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const STORAGE_KEY = 'textbook_app_v3';
            const DB_NAME = 'textbook_audio_db_v3';
            const DB_STORE_AUDIO = 'audioFiles';
            const DB_STORE_PDF = 'pdfFiles';

            // ---------- helpers ----------
            const $ = (s, root = document) => root.querySelector(s);
            const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
            const toast = $('#toast');
            let toastTimer = null;

            function showToast(msg, type = '') {
                toast.textContent = msg;
                toast.className = 'toast';
                if (type) toast.classList.add(type);
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
            }

            function uid(prefix = 'id') { return prefix + '_' + Math.random().toString(36).slice(2, 10); }

            function formatTime(sec) {
                if (!Number.isFinite(sec)) return '0:00';
                const m = Math.floor(sec / 60),
                    s = Math.floor(sec % 60);
                return `${m}:${String(s).padStart(2, '0')}`;
            }

            // ---------- state ----------
            let pdfDoc = null,
                currentPage = 1,
                totalPages = 0,
                scale = 1.2;
            let currentTool = 'none',
                currentColor = '#ffeb3b';
            const LINE_WIDTH_KEY = 'tool_line_width';
            const FONT_SIZE_KEY = 'tool_font_size';
            const MIN_LINE_WIDTH = 1, MAX_LINE_WIDTH = 8;
            const MIN_FONT_SIZE = 10, MAX_FONT_SIZE = 26;
            let currentLineWidth = parseInt(localStorage.getItem(LINE_WIDTH_KEY)) || 2;
            let currentFontSize = parseInt(localStorage.getItem(FONT_SIZE_KEY)) || 13;
            let isDrawing = false,
                startX = 0,
                startY = 0,
                lastX = 0,
                lastY = 0,
                drawPoints = [];
            let db = null;
            let activeAudio = null;
            let currentAudioId = null;
            let currentAudioUrl = null;
            let editorOverlay = null;
            let audioSearchQuery = '';
            let highQuality = true;
            let isMuted = false;
            let currentShelfId = null;
            let redrawAllFn = null;
            // Надёжные параметры масштабирования слоя заметок:
            // не зависят от getBoundingClientRect(), поэтому не "плывут"
            // при быстром зуме / до завершения раскладки DOM.
            let currentDpr = 1;
            let currentQualityMult = 1;
            let pageLoadToken = 0;
            let currentRenderTask = null;

            // ---------- App State ----------
            let appState = loadAppState();

            function defaultShelf(name) {
                return {
                    id: uid('shelf'),
                    name: name || 'Новый учебник',
                    annotations: {},
                    textNotes: {},
                    viewedPages: [],
                    audioTracks: [],
                    pdfId: null,
                    pdfName: null,
                    currentPage: 1,
                    scale: 1.2
                };
            }

            function loadAppState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data.shelves && data.shelves.length) {
                            return data;
                        }
                    }
                } catch (e) {}
                // По умолчанию
                const defaultShelfObj = defaultShelf('Учебник 1');
                return {
                    shelves: [defaultShelfObj],
                    activeShelfId: defaultShelfObj.id
                };
            }

            function saveAppState() {
                // Сохраняем текущую страницу и масштаб в активную полку
                const shelf = getCurrentShelf();
                if (shelf) {
                    shelf.currentPage = currentPage;
                    shelf.scale = scale;
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            }

            function getCurrentShelf() {
                return appState.shelves.find(s => s.id === currentShelfId) || appState.shelves[0];
            }

            function getShelfById(id) {
                return appState.shelves.find(s => s.id === id);
            }

            function ensureActiveShelf() {
                if (!currentShelfId || !getShelfById(currentShelfId)) {
                    currentShelfId = appState.shelves[0]?.id || null;
                }
                if (!currentShelfId && appState.shelves.length) {
                    currentShelfId = appState.shelves[0].id;
                }
                if (!appState.shelves.length) {
                    const s = defaultShelf('Учебник 1');
                    appState.shelves.push(s);
                    currentShelfId = s.id;
                    saveAppState();
                }
            }

            // ---------- IndexedDB ----------
            function openDb() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, 2);
                    req.onupgradeneeded = () => {
                        const db = req.result;
                        if (!db.objectStoreNames.contains(DB_STORE_AUDIO)) {
                            db.createObjectStore(DB_STORE_AUDIO);
                        }
                        if (!db.objectStoreNames.contains(DB_STORE_PDF)) {
                            db.createObjectStore(DB_STORE_PDF);
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async function dbPut(store, id, data) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readwrite');
                    tx.objectStore(store).put(data, id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            async function dbGet(store, id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).get(id);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            }

            async function dbDelete(store, id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readwrite');
                    tx.objectStore(store).delete(id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            // ---------- dom ----------
            const statusLeft = $('#statusLeft');
            const statusTool = $('#statusTool');
            const pdfContainer = $('#pdfContainer');
            const dropZone = $('#dropZone');
            const pageInput = $('#pageInput');
            const pageTotal = $('#pageTotal');
            const statusPageNum = $('#statusPageNum');
            const statusTotalPages = $('#statusTotalPages');
            const pagesViewedTop = $('#pagesViewedTop');
            const annCountTop = $('#annCountTop');
            const audioStatus = $('#audioStatus');
            const audioList = $('#audioList');
            const audioPageLabel = $('#audioPageLabel');
            const uploadProgressContainer = $('#uploadProgressContainer');
            const uploadProgressFill = $('#uploadProgressFill');
            const audioSearchInput = $('#audioSearchInput');
            const menuBadge = $('#menuBadge');
            const zoomLevel = $('#zoomLevel');
            const qualityToggle = $('#qualityToggle');
            const shelfSelect = $('#shelfSelect');
            const newShelfBtn = $('#newShelfBtn');
            const deleteShelfBtn = $('#deleteShelfBtn');

            const playBtn = $('#playBtn');
            const audioTime = $('#audioTime');
            const audioProgress = $('#audioProgress');
            const audioProgressFill = $('#audioProgressFill');
            const currentTrackName = $('#currentTrackName');
            const currentTrackPage = $('#currentTrackPage');
            const volumeSlider = $('#volumeSlider');
            const volumeIcon = $('#volumeIcon');
            const muteBtn = $('#muteBtn');
            const rewindBtn = $('#rewindBtn');
            const forwardBtn = $('#forwardBtn');

            // ---------- RESIZER ----------
            const audioToggleBtn = $('#audioToggleBtn');
            const audioSidebar = $('#audioSidebar');
            const AUDIO_PANEL_KEY = 'audio_panel_open';
            let audioPanelOpen = localStorage.getItem(AUDIO_PANEL_KEY) === '1';

            function setAudioPanelOpen(open) {
                audioPanelOpen = open;
                audioSidebar.classList.toggle('open', open);
                audioToggleBtn.classList.toggle('active-tool', open);
                localStorage.setItem(AUDIO_PANEL_KEY, open ? '1' : '0');
            }

            audioToggleBtn.addEventListener('click', () => setAudioPanelOpen(!audioPanelOpen));
            setAudioPanelOpen(audioPanelOpen);

            // Регулировка ширины аудиопанели перетаскиванием
            const audioResizeHandle = $('#audioResizeHandle');
            const AUDIO_WIDTH_KEY = 'audio_panel_width';
            const MIN_AUDIO_WIDTH = 220;
            const MAX_AUDIO_WIDTH = 560;

            function setAudioWidth(px) {
                const clamped = Math.max(MIN_AUDIO_WIDTH, Math.min(MAX_AUDIO_WIDTH, Math.round(px)));
                audioSidebar.style.setProperty('--audio-width', clamped + 'px');
                return clamped;
            }
            setAudioWidth(parseInt(localStorage.getItem(AUDIO_WIDTH_KEY)) || 340);

            let isResizingAudio = false;
            let resizeStartX = 0;
            let resizeStartWidth = 340;

            function beginAudioResize(clientX) {
                isResizingAudio = true;
                resizeStartX = clientX;
                const cssWidth = getComputedStyle(audioSidebar).getPropertyValue('--audio-width');
                resizeStartWidth = parseInt(cssWidth) || 340;
                audioSidebar.classList.add('resizing');
                document.body.style.userSelect = 'none';
            }

            function updateAudioResize(clientX) {
                if (!isResizingAudio) return;
                const delta = clientX - resizeStartX; // движение вправо уменьшает ширину, влево — увеличивает
                setAudioWidth(resizeStartWidth - delta);
            }

            function endAudioResize() {
                if (!isResizingAudio) return;
                isResizingAudio = false;
                audioSidebar.classList.remove('resizing');
                document.body.style.userSelect = '';
                const cssWidth = getComputedStyle(audioSidebar).getPropertyValue('--audio-width');
                localStorage.setItem(AUDIO_WIDTH_KEY, String(parseInt(cssWidth) || 340));
            }

            audioResizeHandle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                beginAudioResize(e.clientX);
            });
            window.addEventListener('mousemove', (e) => updateAudioResize(e.clientX));
            window.addEventListener('mouseup', endAudioResize);

            audioResizeHandle.addEventListener('touchstart', (e) => {
                beginAudioResize(e.touches[0].clientX);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (isResizingAudio) updateAudioResize(e.touches[0].clientX);
            }, { passive: true });
            window.addEventListener('touchend', endAudioResize);

            // ---------- РЕГУЛИРОВКА ТОЛЩИНЫ ПЕРА И РАЗМЕРА ТЕКСТА ----------
            const lineWidthValue = $('#lineWidthValue');
            const fontSizeValue = $('#fontSizeValue');
            lineWidthValue.textContent = currentLineWidth;
            fontSizeValue.textContent = currentFontSize;

            $('#lineWidthDown').addEventListener('click', () => {
                currentLineWidth = Math.max(MIN_LINE_WIDTH, currentLineWidth - 1);
                lineWidthValue.textContent = currentLineWidth;
                localStorage.setItem(LINE_WIDTH_KEY, String(currentLineWidth));
            });
            $('#lineWidthUp').addEventListener('click', () => {
                currentLineWidth = Math.min(MAX_LINE_WIDTH, currentLineWidth + 1);
                lineWidthValue.textContent = currentLineWidth;
                localStorage.setItem(LINE_WIDTH_KEY, String(currentLineWidth));
            });
            $('#fontSizeDown').addEventListener('click', () => {
                currentFontSize = Math.max(MIN_FONT_SIZE, currentFontSize - 2);
                fontSizeValue.textContent = currentFontSize;
                localStorage.setItem(FONT_SIZE_KEY, String(currentFontSize));
            });
            $('#fontSizeUp').addEventListener('click', () => {
                currentFontSize = Math.min(MAX_FONT_SIZE, currentFontSize + 2);
                fontSizeValue.textContent = currentFontSize;
                localStorage.setItem(FONT_SIZE_KEY, String(currentFontSize));
            });

            // ---------- SHELF MANAGEMENT ----------
            function renderShelfSelect() {
                shelfSelect.innerHTML = '';
                appState.shelves.forEach(shelf => {
                    const opt = document.createElement('option');
                    opt.value = shelf.id;
                    opt.textContent = shelf.name;
                    if (shelf.id === currentShelfId) opt.selected = true;
                    shelfSelect.appendChild(opt);
                });
                // Обновляем badge
                updateMenuBadge();
            }

            function switchShelf(shelfId) {
                // Сохраняем текущее состояние
                const oldShelf = getCurrentShelf();
                if (oldShelf) {
                    oldShelf.currentPage = currentPage;
                    oldShelf.scale = scale;
                }

                currentShelfId = shelfId;
                const shelf = getCurrentShelf();
                if (shelf) {
                    currentPage = shelf.currentPage || 1;
                    scale = shelf.scale || 1.2;
                    zoomLevel.textContent = Math.round(scale * 100) + '%';
                }

                saveAppState();
                renderShelfSelect();
                loadPdfForShelf(shelf);
                refreshUIForShelf();
                updateMenuBadge();
            }

            function createNewShelf() {
                const name = prompt('Введите название учебника:', 'Учебник ' + (appState.shelves.length + 1));
                if (!name) return;
                const newShelf = defaultShelf(name);
                appState.shelves.push(newShelf);
                saveAppState();
                renderShelfSelect();
                switchShelf(newShelf.id);
                showToast('✅ Создан учебник: ' + name, 'success');
            }

            function deleteCurrentShelf() {
                if (appState.shelves.length <= 1) {
                    showToast('❌ Нельзя удалить последний учебник', 'error');
                    return;
                }
                const shelf = getCurrentShelf();
                if (!shelf) return;
                if (!confirm(`Удалить учебник "${shelf.name}" со всеми данными?`)) return;

                // Удаляем PDF из IndexedDB
                if (shelf.pdfId) {
                    dbDelete(DB_STORE_PDF, shelf.pdfId);
                }
                // Удаляем аудио
                if (shelf.audioTracks) {
                    shelf.audioTracks.forEach(t => dbDelete(DB_STORE_AUDIO, t.id));
                }

                const idx = appState.shelves.findIndex(s => s.id === shelf.id);
                if (idx > -1) appState.shelves.splice(idx, 1);
                saveAppState();

                const newActive = appState.shelves[0];
                currentShelfId = newActive.id;
                renderShelfSelect();
                switchShelf(newActive.id);
                showToast('🗑️ Учебник удалён', 'success');
            }

            // ---------- toggle quality ----------
            function toggleQuality() {
                highQuality = !highQuality;
                qualityToggle.classList.toggle('high-quality', highQuality);
                qualityToggle.textContent = highQuality ? '🔍 Качество' : '⚡ Скорость';
                if (pdfDoc) {
                    loadPage(currentPage);
                }
                showToast(highQuality ? 'Высокое качество' : 'Быстрый режим', 'success');
            }

            qualityToggle.addEventListener('click', toggleQuality);

            // ---------- PDF.js ----------
            async function boot() {
                if (typeof pdfjsLib === 'undefined') {
                    showToast('Не загрузился PDF.js', 'error');
                    return;
                }
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                db = await openDb();
                ensureActiveShelf();
                bindEvents();
                renderShelfSelect();

                const shelf = getCurrentShelf();
                currentPage = shelf?.currentPage || 1;
                scale = shelf?.scale || 1.2;
                zoomLevel.textContent = Math.round(scale * 100) + '%';

                await loadPdfForShelf(shelf);
                refreshUIForShelf();
                statusLeft.textContent = '📖 Готово';
                showToast('Готово', 'success');
                updateMenuBadge();
                initVolume();

                // Восстанавливаем сохранённую страницу
                if (shelf?.currentPage && pdfDoc) {
                    loadPage(shelf.currentPage);
                }
            }

            function initVolume() {
                if (volumeSlider) {
                    volumeSlider.value = 80;
                    if (activeAudio) activeAudio.volume = 0.8;
                }
            }

            function bindEvents() {
                // Загрузка PDF
                $('#loadPdfBtn').addEventListener('click', () => $('#pdfInput').click());
                $('#pdfInput').addEventListener('change', e => {
                    const file = e.target.files[0];
                    if (file) loadPdfFile(file);
                    e.target.value = '';
                });

                // Drop zone
                const dz = document.getElementById('dropZone');
                if (dz) {
                    ['dragover', 'dragleave', 'drop'].forEach(ev => {
                        dz.addEventListener(ev, handleDropZone);
                    });
                }

                // Навигация
                $('#prevPageBtn').addEventListener('click', () => pdfDoc && currentPage > 1 && loadPage(currentPage - 1));
                $('#nextPageBtn').addEventListener('click', () => pdfDoc && currentPage < totalPages && loadPage(currentPage +
                1));
                pageInput.addEventListener('change', () => {
                    if (!pdfDoc) return showToast('Сначала загрузите PDF', 'error');
                    let p = parseInt(pageInput.value, 10) || 1;
                    p = Math.max(1, Math.min(totalPages, p));
                    if (p !== currentPage) loadPage(p);
                });

                // Zoom
                $('#zoomInBtn').addEventListener('click', () => changeZoom(0.1));
                $('#zoomOutBtn').addEventListener('click', () => changeZoom(-0.1));

                // Keyboard
                document.addEventListener('keydown', e => {
                    if ((e.key === 'ArrowRight' || e.key === 'ArrowDown') && pdfDoc && currentPage < totalPages) { e
                            .preventDefault();
                        loadPage(currentPage + 1); }
                    if ((e.key === 'ArrowLeft' || e.key === 'ArrowUp') && pdfDoc && currentPage > 1) { e.preventDefault();
                        loadPage(currentPage - 1); }
                    if ((e.key === '=' || e.key === '+') && e.ctrlKey) { e.preventDefault();
                        changeZoom(0.1); }
                    if ((e.key === '-') && e.ctrlKey) { e.preventDefault();
                        changeZoom(-0.1); }
                });

                // Инструменты
                const toolMap = { toolStrike: 'strike', toolDraw: 'draw', toolText: 'text' };
                const toolLabels = { strike: 'Зачеркивание', draw: 'Рисование', text: 'Текст' };
                Object.entries(toolMap).forEach(([id, tool]) => {
                    $('#' + id).addEventListener('click', () => {
                        const alreadyActive = currentTool === tool;
                        $$('.tools-row .btn').forEach(b => b.classList.remove('active-tool'));
                        if (alreadyActive) {
                            currentTool = 'none';
                            statusTool.textContent = '👁️ Просмотр';
                        } else {
                            currentTool = tool;
                            $('#' + id).classList.add('active-tool');
                            statusTool.textContent = `🔧 ${toolLabels[tool]}`;
                            if (tool === 'text') showToast('Кликните в нужное место', '');
                        }
                        const layer = $('.draw-layer');
                        if (layer) updateDrawLayerMode(layer);
                    });
                });

                // Цвета
                $$('.color-btn').forEach(btn => btn.addEventListener('click', () => {
                    $$('.color-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentColor = btn.dataset.color;
                }));

                // Undo / Clear
                $('#undoBtn').addEventListener('click', undoCurrentPage);
                $('#clearBtn').addEventListener('click', clearCurrentPage);

                // Аудио
                $('#audioInput').addEventListener('change', (e) => uploadAudioFiles(e.target.files));
                $('#audioFolderInput').addEventListener('change', (e) => uploadAudioFiles(e.target.files));
                $('#deleteAllAudioBtn').addEventListener('click', deleteAllAudio);

                // Плеер
                playBtn.addEventListener('click', toggleAudioPlayback);
                audioProgress.addEventListener('click', seekAudio);
                rewindBtn.addEventListener('click', () => {
                    if (activeAudio) {
                        activeAudio.currentTime = Math.max(0, activeAudio.currentTime - 10);
                        updateAudioTimeDisplay();
                    }
                });
                forwardBtn.addEventListener('click', () => {
                    if (activeAudio && activeAudio.duration) {
                        activeAudio.currentTime = Math.min(activeAudio.duration, activeAudio.currentTime + 10);
                        updateAudioTimeDisplay();
                    }
                });

                volumeSlider.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    if (activeAudio) {
                        activeAudio.volume = val / 100;
                    }
                    if (val === 0) {
                        volumeIcon.textContent = '🔇';
                        isMuted = true;
                    } else {
                        volumeIcon.textContent = val < 40 ? '🔉' : '🔊';
                        isMuted = false;
                    }
                });

                muteBtn.addEventListener('click', () => {
                    if (activeAudio) {
                        if (isMuted) {
                            const val = parseInt(volumeSlider.value) || 80;
                            activeAudio.volume = val / 100;
                            volumeIcon.textContent = val < 40 ? '🔉' : '🔊';
                            isMuted = false;
                        } else {
                            activeAudio.volume = 0;
                            volumeIcon.textContent = '🔇';
                            isMuted = true;
                        }
                    } else {
                        showToast('Нет активного аудио', 'error');
                    }
                });

                // Поиск аудио
                audioSearchInput.addEventListener('input', (e) => {
                    audioSearchQuery = e.target.value.toLowerCase().trim();
                    renderAudioList();
                });
                $('#clearSearchBtn').addEventListener('click', () => {
                    audioSearchInput.value = '';
                    audioSearchQuery = '';
                    renderAudioList();
                    audioSearchInput.focus();
                });

                // Управление учебниками
                shelfSelect.addEventListener('change', (e) => {
                    const id = e.target.value;
                    if (id && id !== currentShelfId) {
                        switchShelf(id);
                    }
                });

                newShelfBtn.addEventListener('click', createNewShelf);
                deleteShelfBtn.addEventListener('click', deleteCurrentShelf);

                // Бренд — переключение между учебниками
                $('#brandBtn').addEventListener('click', () => {
                    if (appState.shelves.length > 1) {
                        const idx = appState.shelves.findIndex(s => s.id === currentShelfId);
                        const nextIdx = (idx + 1) % appState.shelves.length;
                        switchShelf(appState.shelves[nextIdx].id);
                        showToast('📚 ' + appState.shelves[nextIdx].name, 'success');
                    }
                });
            }

            // ---------- Zoom ----------
            function changeZoom(delta) {
                if (!pdfDoc) return showToast('Сначала загрузите PDF', 'error');
                let newScale = scale + delta;
                newScale = Math.max(0.3, Math.min(3.0, newScale));
                scale = newScale;
                zoomLevel.textContent = Math.round(scale * 100) + '%';
                // Сохраняем в полку
                const shelf = getCurrentShelf();
                if (shelf) shelf.scale = scale;
                saveAppState();
                loadPage(currentPage);
            }

            function refreshUIForShelf() {
                const shelf = getCurrentShelf();
                updateStats();
                renderAudioList();
                updateAudioPageStatus();
                updateMenuBadge();
                if (shelf) {
                    statusLeft.textContent = `📖 ${shelf.pdfName || 'Нет PDF'} — ${shelf.name}`;
                }
            }

            function updateMenuBadge() {
                const shelf = getCurrentShelf();
                if (!shelf) { menuBadge.textContent = '0'; return; }
                const total = Object.values(shelf.annotations || {}).reduce((n, arr) => n + (arr?.length || 0), 0) +
                    Object.values(shelf.textNotes || {}).reduce((n, arr) => n + (arr?.length || 0), 0) +
                    (shelf.audioTracks || []).length;
                menuBadge.textContent = total || '0';
            }

            // ---------- PDF загрузка ----------
            async function loadPdfForShelf(shelf) {
                if (!shelf || !shelf.pdfId) {
                    pdfDoc = null;
                    totalPages = 0;
                    currentPage = 1;
                    pdfContainer.innerHTML = `
                    <div class="drop-zone" id="dropZone">
                        <span class="icon">📄</span>
                        <div class="title">Загрузите PDF-учебник</div>
                        <div class="sub">Нажмите «PDF» вверху или перетащите файл</div>
                    </div>
                `;
                    const newDropZone = document.getElementById('dropZone');
                    if (newDropZone) {
                        ['dragover', 'dragleave', 'drop'].forEach(ev => {
                            newDropZone.addEventListener(ev, handleDropZone);
                        });
                    }
                    updatePageInfo();
                    statusLeft.textContent = `📖 ${shelf?.name || 'Нет учебника'}`;
                    return;
                }
                try {
                    const pdfData = await dbGet(DB_STORE_PDF, shelf.pdfId);
                    if (!pdfData) {
                        shelf.pdfId = null;
                        shelf.pdfName = null;
                        saveAppState();
                        await loadPdfForShelf(shelf);
                        return;
                    }
                    pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;
                    totalPages = pdfDoc.numPages;
                    const dz = document.getElementById('dropZone');
                    if (dz) dz.style.display = 'none';
                    updatePageInfo();
                    statusLeft.textContent = `📖 ${shelf.pdfName || 'PDF'} — ${shelf.name}`;
                    zoomLevel.textContent = Math.round(scale * 100) + '%';
                } catch (err) {
                    console.error(err);
                    showToast(`Ошибка загрузки PDF: ${err.message}`, 'error');
                }
            }

            function handleDropZone(e) {
                e.preventDefault();
                if (e.type === 'dragover') return e.currentTarget.classList.add('drag-over');
                if (e.type === 'dragleave') return e.currentTarget.classList.remove('drag-over');
                e.currentTarget.classList.remove('drag-over');
                const file = e.dataTransfer.files?.[0];
                if (!file) return;
                if (file.type !== 'application/pdf') return showToast('Нужен PDF-файл', 'error');
                loadPdfFile(file);
            }

            async function loadPdfFile(file) {
                const shelf = getCurrentShelf();
                if (!shelf) return;
                statusLeft.textContent = `⏳ Загрузка ${file.name}...`;
                const reader = new FileReader();
                reader.onload = async e => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const pdfId = uid('pdf');
                        await dbPut(DB_STORE_PDF, pdfId, data);
                        if (shelf.pdfId) {
                            await dbDelete(DB_STORE_PDF, shelf.pdfId);
                        }
                        shelf.pdfId = pdfId;
                        shelf.pdfName = file.name;
                        shelf.currentPage = 1;
                        saveAppState();
                        pdfDoc = await pdfjsLib.getDocument({ data }).promise;
                        totalPages = pdfDoc.numPages;
                        currentPage = 1;
                        const dz = document.getElementById('dropZone');
                        if (dz) dz.style.display = 'none';
                        updatePageInfo();
                        await loadPage(1);
                        showToast(`✅ PDF загружен для "${shelf.name}"`, 'success');
                        statusLeft.textContent = `📖 ${file.name} — ${shelf.name}`;
                        updateMenuBadge();
                        zoomLevel.textContent = Math.round(scale * 100) + '%';
                    } catch (err) {
                        console.error(err);
                        showToast(`Ошибка PDF: ${err.message}`, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            function updatePageInfo() {
                pageInput.value = currentPage;
                pageTotal.textContent = `/ ${totalPages || '—'}`;
                statusPageNum.textContent = currentPage;
                statusTotalPages.textContent = totalPages || '—';
            }

            // ============================================================
            // ЗАГРУЗКА СТРАНИЦЫ С СОХРАНЕНИЕМ ТЕКСТА
            // ============================================================
            async function loadPage(pageNum) {
                if (!pdfDoc) return;

                // Токен защищает от гонки: если пока грузилась/рендерилась
                // эта страница пользователь успел кликнуть зум ещё раз,
                // "устаревший" вызов ниже просто ничего не тронет в DOM.
                const myToken = ++pageLoadToken;

                // Отменяем предыдущий незавершённый рендер PDF.js, чтобы
                // два рендера не гонялись друг с другом и не портили канвас.
                if (currentRenderTask) {
                    try { currentRenderTask.cancel(); } catch (e) {}
                    currentRenderTask = null;
                }

                const page = await pdfDoc.getPage(pageNum);
                if (myToken !== pageLoadToken) return; // устарело

                const qualityMultiplier = highQuality ? 1.5 : 1.0;
                const finalScale = scale * qualityMultiplier;

                const viewport = page.getViewport({ scale: finalScale });
                pdfContainer.innerHTML = '';
                const wrap = document.createElement('div');
                wrap.className = 'page-container';
                wrap.dataset.page = pageNum;
                wrap.style.width = (viewport.width / qualityMultiplier) + 'px';
                wrap.style.maxWidth = '100%';

                const canvas = document.createElement('canvas');
                const dpr = highQuality ? (window.devicePixelRatio || 1) : 1;
                canvas.width = viewport.width * dpr;
                canvas.height = viewport.height * dpr;
                canvas.style.width = (viewport.width / qualityMultiplier) + 'px';
                canvas.style.height = (viewport.height / qualityMultiplier) + 'px';

                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = highQuality ? 'high' : 'low';

                const drawLayer = document.createElement('canvas');
                drawLayer.className = 'draw-layer';
                drawLayer.width = viewport.width * dpr;
                drawLayer.height = viewport.height * dpr;
                drawLayer.style.width = (viewport.width / qualityMultiplier) + 'px';
                drawLayer.style.height = (viewport.height / qualityMultiplier) + 'px';
                updateDrawLayerMode(drawLayer);

                const loading = document.createElement('div');
                loading.className = 'loading-overlay';
                loading.innerHTML = '<div class="spinner"></div><span>Загрузка...</span>';
                wrap.append(canvas, drawLayer, loading);
                pdfContainer.appendChild(wrap);

                const renderTask = page.render({
                    canvasContext: ctx,
                    viewport: viewport,
                    background: 'white',
                    enableWebGL: highQuality,
                    useSystemFonts: true
                });
                currentRenderTask = renderTask;
                try {
                    await renderTask.promise;
                } catch (err) {
                    // RenderingCancelledException — ожидаемо при быстром зуме, просто выходим
                    if (myToken !== pageLoadToken) return;
                    if (err && err.name !== 'RenderingCancelledException') throw err;
                    return;
                }
                if (currentRenderTask === renderTask) currentRenderTask = null;
                if (myToken !== pageLoadToken) return; // страницу успели перелистнуть/перезумить

                loading.remove();

                // Фиксируем параметры, по которым слой заметок будет
                // всегда пересчитываться детерминированно (без обращения
                // к getBoundingClientRect, которое может вернуть 0 до layout).
                currentDpr = dpr;
                currentQualityMult = qualityMultiplier;

                currentPage = pageNum;
                updatePageInfo();

                const shelf = getCurrentShelf();
                if (shelf) {
                    shelf.currentPage = pageNum;
                    shelf.viewedPages = Array.from(new Set([...(shelf.viewedPages || []), pageNum]));
                    saveAppState();
                }

                // СОХРАНЯЕМ ФУНКЦИЮ ОТРИСОВКИ В ГЛОБАЛЬНОЙ ПЕРЕМЕННОЙ
                redrawAllFn = function(canvas, pageNum) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const shelf = getCurrentShelf();
                    if (!shelf) return;
                    const annotations = shelf.annotations?.[pageNum] || [];
                    const textNotes = shelf.textNotes?.[pageNum] || [];
                    // Детерминированный коэффициент: dpr * коэфф.качества * текущий zoom.
                    // Не зависит от текущего размера canvas в DOM, поэтому
                    // не "теряет" текст при быстром/повторном зуме.
                    const ratio = currentDpr * currentQualityMult * scale;

                    ctx.save();
                    ctx.scale(ratio, ratio);

                    annotations.forEach(ann => {
                        ctx.save();
                        if (ann.type === 'strike') {
                            ctx.strokeStyle = ann.color;
                            ctx.lineWidth = ann.lineWidth || 3;
                            ctx.beginPath();
                            ctx.moveTo(ann.startX, ann.startY + 12);
                            ctx.lineTo(ann.endX, ann.endY + 12);
                            ctx.stroke();
                        } else if (ann.type === 'draw') {
                            ctx.strokeStyle = ann.color;
                            ctx.lineWidth = ann.lineWidth || 3;
                            ctx.lineCap = 'round';
                            ctx.lineJoin = 'round';
                            ctx.beginPath();
                            ctx.moveTo(ann.points[0].x, ann.points[0].y);
                            for (let i = 1; i < ann.points.length; i++) {
                                ctx.lineTo(ann.points[i].x, ann.points[i].y);
                            }
                            ctx.stroke();
                        }
                        ctx.restore();
                    });

                    textNotes.forEach(t => {
                        ctx.save();
                        ctx.font = `${t.fontSize || 16}px 'Segoe UI', sans-serif`;
                        ctx.fillStyle = t.color || '#1f140c';
                        ctx.fillText(t.text, t.x, t.y + 2);
                        ctx.restore();
                    });

                    ctx.restore();
                };

                redrawAllFn(drawLayer, pageNum);
                bindDrawEvents(drawLayer, pageNum);
                updateStats();
                updateAudioPageStatus();
                statusLeft.textContent = `📖 Страница ${pageNum} из ${totalPages}`;
                $('#pdfViewer').scrollTop = 0;
                updateMenuBadge();
            }

            // ---------- РИСОВАНИЕ ----------
            function updateDrawLayerMode(layer) {
                layer.className = 'draw-layer';
                const modeClass = {
                    strike: 'strike-mode',
                    draw: 'draw-mode',
                    text: 'text-mode'
                } [currentTool];
                if (modeClass) layer.classList.add(modeClass);
            }

            function canvasPos(e, canvas) {
                const rect = canvas.getBoundingClientRect();
                const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
                const clientX = t ? t.clientX : e.clientX;
                const clientY = t ? t.clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function canvasRatio(canvas) {
                const rect = canvas.getBoundingClientRect();
                return rect.width ? (canvas.width / rect.width) : 1;
            }

            function bindDrawEvents(drawLayer, pageNum) {
                const canvas = drawLayer;
                // Удаляем старые обработчики, чтобы не было дублей
                const newCanvas = canvas.cloneNode(true);
                canvas.parentNode.replaceChild(newCanvas, canvas);
                const newDrawLayer = newCanvas;

                newDrawLayer.addEventListener('mousedown', (e) => {
                    if (currentTool === 'text') {
                        openTextEditor(e, newDrawLayer, pageNum);
                        return;
                    }
                    if (currentTool === 'none') return;
                    const p = canvasPos(e, newDrawLayer);
                    isDrawing = true;
                    startX = p.x;
                    startY = p.y;
                    lastX = p.x;
                    lastY = p.y;
                    drawPoints = currentTool === 'draw' ? [{ x: p.x, y: p.y }] : [];
                });

                newDrawLayer.addEventListener('mousemove', (e) => {
                    if (!isDrawing || currentTool === 'none' || currentTool === 'text') return;
                    const p = canvasPos(e, newDrawLayer);
                    const ctx = newDrawLayer.getContext('2d');
                    const ratio = currentDpr * currentQualityMult;
                    if (currentTool === 'draw') {
                        drawPoints.push({ x: p.x, y: p.y });
                        if (redrawAllFn) redrawAllFn(newDrawLayer, pageNum);
                        ctx.save();
                        ctx.scale(ratio, ratio);
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = currentLineWidth;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(p.x, p.y);
                        ctx.stroke();
                        ctx.restore();
                        lastX = p.x;
                        lastY = p.y;
                        return;
                    }
                    if (redrawAllFn) redrawAllFn(newDrawLayer, pageNum);
                    ctx.save();
                    ctx.scale(ratio, ratio);
                    if (currentTool === 'strike') {
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = currentLineWidth;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY + 12);
                        ctx.lineTo(p.x, p.y + 12);
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                newDrawLayer.addEventListener('mouseup', (e) => {
                    if (!isDrawing || currentTool === 'none' || currentTool === 'text') { isDrawing = false; return; }
                    const shelf = getCurrentShelf();
                    if (!shelf) { isDrawing = false; return; }
                    shelf.annotations[pageNum] ||= [];
                    const p = canvasPos(e, newDrawLayer);
                    if (currentTool === 'draw' && drawPoints.length > 1) {
                        shelf.annotations[pageNum].push({
                            type: 'draw',
                            color: currentColor,
                            lineWidth: currentLineWidth,
                            points: drawPoints.map(pt => ({ x: pt.x / scale, y: pt.y / scale }))
                        });
                    } else if (currentTool === 'strike' && Math.abs(p.x - startX) > 5) {
                        shelf.annotations[pageNum].push({
                            type: 'strike',
                            color: currentColor,
                            lineWidth: currentLineWidth,
                            startX: startX / scale,
                            startY: startY / scale,
                            endX: p.x / scale,
                            endY: p.y / scale
                        });
                    }
                    isDrawing = false;
                    drawPoints = [];
                    saveAppState();
                    if (redrawAllFn) redrawAllFn(newDrawLayer, pageNum);
                    updateStats();
                    updateMenuBadge();
                });

                newDrawLayer.addEventListener('mouseleave', () => { isDrawing = false; });

                // Touch events
                newDrawLayer.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (currentTool === 'text') {
                        openTextEditor(e, newDrawLayer, pageNum);
                        return;
                    }
                    if (currentTool === 'none') return;
                    const p = canvasPos(e, newDrawLayer);
                    isDrawing = true;
                    startX = p.x;
                    startY = p.y;
                    lastX = p.x;
                    lastY = p.y;
                    drawPoints = currentTool === 'draw' ? [{ x: p.x, y: p.y }] : [];
                }, { passive: false });

                newDrawLayer.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!isDrawing || currentTool === 'none' || currentTool === 'text') return;
                    const p = canvasPos(e, newDrawLayer);
                    const ctx = newDrawLayer.getContext('2d');
                    const ratio = currentDpr * currentQualityMult;
                    if (currentTool === 'draw') {
                        drawPoints.push({ x: p.x, y: p.y });
                        if (redrawAllFn) redrawAllFn(newDrawLayer, pageNum);
                        ctx.save();
                        ctx.scale(ratio, ratio);
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = currentLineWidth;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(p.x, p.y);
                        ctx.stroke();
                        ctx.restore();
                        lastX = p.x;
                        lastY = p.y;
                        return;
                    }
                    if (redrawAllFn) redrawAllFn(newDrawLayer, pageNum);
                    ctx.save();
                    ctx.scale(ratio, ratio);
                    if (currentTool === 'strike') {
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = currentLineWidth;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY + 12);
                        ctx.lineTo(p.x, p.y + 12);
                        ctx.stroke();
                    }
                    ctx.restore();
                }, { passive: false });

                newDrawLayer.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (!isDrawing || currentTool === 'none' || currentTool === 'text') { isDrawing = false; return; }
                    const shelf = getCurrentShelf();
                    if (!shelf) { isDrawing = false; return; }
                    shelf.annotations[pageNum] ||= [];
                    const p = canvasPos(e, newDrawLayer);
                    if (currentTool === 'draw' && drawPoints.length > 1) {
                        shelf.annotations[pageNum].push({
                            type: 'draw',
                            color: currentColor,
                            lineWidth: currentLineWidth,
                            points: drawPoints.map(pt => ({ x: pt.x / scale, y: pt.y / scale }))
                        });
                    } else if (currentTool === 'strike' && Math.abs(p.x - startX) > 5) {
                        shelf.annotations[pageNum].push({
                            type: 'strike',
                            color: currentColor,
                            lineWidth: currentLineWidth,
                            startX: startX / scale,
                            startY: startY / scale,
                            endX: p.x / scale,
                            endY: p.y / scale
                        });
                    }
                    isDrawing = false;
                    drawPoints = [];
                    saveAppState();
                    if (redrawAllFn) redrawAllFn(newDrawLayer, pageNum);
                    updateStats();
                    updateMenuBadge();
                }, { passive: false });
            }

            // ============================================================
            // ТЕКСТОВЫЙ РЕДАКТОР
            // ============================================================
            function openTextEditor(e, canvas, pageNum) {
                if (editorOverlay) {
                    editorOverlay.remove();
                    editorOverlay = null;
                }

                const pos = canvasPos(e, canvas);
                const rect = canvas.getBoundingClientRect();

                const overlay = document.createElement('div');
                overlay.className = 'text-editor-overlay';

                let left = pos.x;
                let top = pos.y - 10;

                const editorWidth = Math.min(300, rect.width * 0.8);
                const editorHeight = 80;

                if (left + editorWidth > rect.width) left = rect.width - editorWidth - 10;
                if (left < 10) left = 10;
                if (top + editorHeight > rect.height) top = rect.height - editorHeight - 10;
                if (top < 10) top = 10;

                overlay.style.left = left + 'px';
                overlay.style.top = top + 'px';
                overlay.style.maxWidth = Math.min(320, rect.width * 0.85) + 'px';
                overlay.style.minWidth = Math.min(160, rect.width * 0.5) + 'px';

                overlay.innerHTML = `
                    <textarea placeholder="Введите текст..." rows="1"></textarea>
                    <div class="editor-actions">
                        <button class="save-btn" title="Сохранить (Enter)">✅</button>
                        <button class="cancel-btn" title="Отмена (Esc)">✕</button>
                    </div>
                `;

                canvas.parentElement.appendChild(overlay);

                const textarea = overlay.querySelector('textarea');
                const saveBtn = overlay.querySelector('.save-btn');
                const cancelBtn = overlay.querySelector('.cancel-btn');

                textarea.addEventListener('input', () => {
                    textarea.style.height = 'auto';
                    textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
                });

                setTimeout(() => {
                    textarea.focus();
                    textarea.select();
                }, 50);

                saveBtn.addEventListener('click', () => {
                    const text = textarea.value.trim();
                    if (!text) {
                        overlay.remove();
                        editorOverlay = null;
                        return;
                    }
                    const shelf = getCurrentShelf();
                    if (!shelf) { overlay.remove();
                        editorOverlay = null; return; }
                    shelf.textNotes[pageNum] ||= [];
                    shelf.textNotes[pageNum].push({
                        text: text,
                        x: pos.x / scale,
                        y: pos.y / scale,
                        color: currentColor,
                        fontSize: currentFontSize
                    });
                    saveAppState();
                    if (redrawAllFn) redrawAllFn(canvas, pageNum);
                    overlay.remove();
                    editorOverlay = null;
                    showToast('✅ Текст добавлен', 'success');
                    updateStats();
                    updateMenuBadge();
                });

                cancelBtn.addEventListener('click', () => {
                    overlay.remove();
                    editorOverlay = null;
                });

                textarea.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        saveBtn.click();
                    }
                    if (e.key === 'Escape') {
                        overlay.remove();
                        editorOverlay = null;
                    }
                });

                const closeHandler = (event) => {
                    if (overlay && !overlay.contains(event.target)) {
                        overlay.remove();
                        editorOverlay = null;
                        document.removeEventListener('mousedown', closeHandler);
                        document.removeEventListener('touchstart', closeHandler);
                    }
                };
                setTimeout(() => {
                    document.addEventListener('mousedown', closeHandler);
                    document.addEventListener('touchstart', closeHandler);
                }, 100);

                editorOverlay = overlay;
            }

            // ---------- ОСТАЛЬНЫЕ ФУНКЦИИ ----------
            function undoCurrentPage() {
                const shelf = getCurrentShelf();
                if (!shelf) return;
                if (shelf.textNotes[currentPage]?.length) {
                    shelf.textNotes[currentPage].pop();
                    saveAppState();
                    const layer = $('.draw-layer');
                    if (layer && redrawAllFn) redrawAllFn(layer, currentPage);
                    updateMenuBadge();
                    return showToast('Последняя пометка удалена', '');
                }
                if (shelf.annotations[currentPage]?.length) {
                    shelf.annotations[currentPage].pop();
                    saveAppState();
                    const layer = $('.draw-layer');
                    if (layer && redrawAllFn) redrawAllFn(layer, currentPage);
                    updateMenuBadge();
                    return showToast('Последняя аннотация удалена', '');
                }
                showToast('Нечего отменять', 'error');
            }

            function clearCurrentPage() {
                if (!pdfDoc) return showToast('Сначала загрузите PDF', 'error');
                if (!confirm(`Удалить все пометки на странице ${currentPage}?`)) return;
                const shelf = getCurrentShelf();
                if (!shelf) return;
                delete shelf.annotations[currentPage];
                delete shelf.textNotes[currentPage];
                saveAppState();
                const layer = $('.draw-layer');
                if (layer && redrawAllFn) redrawAllFn(layer, currentPage);
                updateStats();
                updateMenuBadge();
                showToast('Страница очищена', '');
            }

            // ---------- АУДИО ----------
            async function uploadAudioFiles(fileList) {
                const files = Array.from(fileList || []);
                if (!files.length) return;
                const audioExtensions = ['.mp3', '.wav', '.ogg', '.m4a', '.aac', '.flac', '.opus'];
                const audioFiles = files.filter(f => {
                    const ext = '.' + f.name.split('.').pop().toLowerCase();
                    return audioExtensions.includes(ext);
                });
                if (!audioFiles.length) {
                    showToast('Не найдено аудиофайлов', 'error');
                    return;
                }
                const shelf = getCurrentShelf();
                if (!shelf) return;
                let ok = 0;
                const total = audioFiles.length;
                uploadProgressContainer.style.display = 'block';
                uploadProgressFill.style.width = '0%';
                for (let i = 0; i < total; i++) {
                    const file = audioFiles[i];
                    const id = uid('audio');
                    await dbPut(DB_STORE_AUDIO, id, file);
                    shelf.audioTracks.push({ id, name: file.name, page: currentPage });
                    ok++;
                    const percent = ((i + 1) / total) * 100;
                    uploadProgressFill.style.width = percent + '%';
                    if (i % 5 === 0 || i === total - 1) {
                        audioStatus.textContent = `Загружено: ${i+1}/${total}`;
                    }
                }
                setTimeout(() => {
                    uploadProgressContainer.style.display = 'none';
                    uploadProgressFill.style.width = '0%';
                }, 1500);
                saveAppState();
                renderAudioList();
                updateStats();
                updateMenuBadge();
                showToast(`✅ Загружено ${ok} аудиофайлов!`, 'success');
                audioStatus.textContent = `${getCurrentShelf()?.audioTracks?.length || 0}`;
                $('#audioInput').value = '';
                $('#audioFolderInput').value = '';
            }

            function renderAudioList() {
                const shelf = getCurrentShelf();
                const tracks = shelf?.audioTracks || [];
                audioList.innerHTML = '';
                let filteredTracks = tracks;
                if (audioSearchQuery) {
                    filteredTracks = tracks.filter(t => t.name.toLowerCase().includes(audioSearchQuery));
                }
                if (filteredTracks.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'no-results';
                    empty.textContent = audioSearchQuery ? '🔍 Ничего не найдено' : 'Нет аудиофайлов';
                    audioList.appendChild(empty);
                    return;
                }
                filteredTracks.forEach(track => {
                    const row = document.createElement('div');
                    row.className = 'track-item' + (track.id === currentAudioId ? ' active-track' : '');
                    row.innerHTML = `
                    <span class="track-name" title="${track.name}">${track.name}</span>
                    <span class="track-page">Стр. ${track.page || '—'}</span>
                    <button class="track-delete" data-id="${track.id}" title="Удалить">✕</button>
                `;
                    row.querySelector('.track-delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteSingleAudio(track.id);
                    });
                    row.addEventListener('click', () => selectAudio(track.id));
                    audioList.appendChild(row);
                });
                audioStatus.textContent = `${tracks.length}`;
            }

            async function deleteSingleAudio(id) {
                if (!confirm('Удалить этот аудиофайл?')) return;
                const shelf = getCurrentShelf();
                if (!shelf) return;
                const trackIndex = shelf.audioTracks.findIndex(t => t.id === id);
                if (trackIndex === -1) return;
                await dbDelete(DB_STORE_AUDIO, id);
                shelf.audioTracks.splice(trackIndex, 1);
                saveAppState();
                if (currentAudioId === id) {
                    if (activeAudio) { activeAudio.pause();
                        activeAudio.src = '';
                        playBtn.textContent = '▶'; }
                    if (currentAudioUrl) { URL.revokeObjectURL(currentAudioUrl);
                        currentAudioUrl = null; }
                    currentAudioId = null;
                    audioPageLabel.textContent = '—';
                    currentTrackName.textContent = '🎵 Выберите аудио';
                    currentTrackPage.textContent = 'Страница: —';
                }
                renderAudioList();
                updateStats();
                updateMenuBadge();
                showToast('Аудиофайл удалён', 'success');
            }

            async function selectAudio(id) {
                const shelf = getCurrentShelf();
                if (!shelf) return;
                const track = shelf.audioTracks.find(t => t.id === id);
                if (!track) return;
                const blob = await dbGet(DB_STORE_AUDIO, id);
                if (!blob) return showToast('Файл не найден', 'error');
                if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
                currentAudioUrl = URL.createObjectURL(blob);
                if (!activeAudio) {
                    activeAudio = new Audio();
                    activeAudio.addEventListener('timeupdate', updateAudioTimeDisplay);
                    activeAudio.addEventListener('ended', () => {
                        playBtn.textContent = '▶';
                        updateAudioTimeDisplay();
                    });
                }
                activeAudio.src = currentAudioUrl;
                const vol = parseInt(volumeSlider.value) / 100;
                activeAudio.volume = isMuted ? 0 : vol;
                currentAudioId = id;
                audioPageLabel.textContent = track.page || '—';
                currentTrackName.textContent = '🎵 ' + track.name;
                currentTrackPage.textContent = 'Страница: ' + (track.page || '—');
                renderAudioList();
                updateAudioTimeDisplay();
                statusLeft.textContent = `🎵 ${track.name}`;
                playBtn.textContent = '▶';
            }

            async function deleteAllAudio() {
                const shelf = getCurrentShelf();
                if (!shelf || !shelf.audioTracks.length) { showToast('Нет аудиофайлов', 'error'); return; }
                if (!confirm(`Удалить ВСЕ аудиофайлы (${shelf.audioTracks.length} шт.)?`)) return;
                for (const track of shelf.audioTracks) {
                    await dbDelete(DB_STORE_AUDIO, track.id);
                }
                shelf.audioTracks = [];
                saveAppState();
                if (activeAudio) { activeAudio.pause();
                    activeAudio.src = '';
                    playBtn.textContent = '▶'; }
                if (currentAudioUrl) { URL.revokeObjectURL(currentAudioUrl);
                    currentAudioUrl = null; }
                currentAudioId = null;
                audioPageLabel.textContent = '—';
                currentTrackName.textContent = '🎵 Выберите аудио';
                currentTrackPage.textContent = 'Страница: —';
                renderAudioList();
                updateStats();
                updateMenuBadge();
                showToast('Все аудиофайлы удалены', 'success');
            }

            async function toggleAudioPlayback() {
                const shelf = getCurrentShelf();
                const tracks = shelf?.audioTracks || [];
                if (!tracks.length) return showToast('Сначала загрузите аудио', 'error');
                if (!activeAudio || !currentAudioId) {
                    await selectAudio(tracks[0].id);
                }
                if (!activeAudio) return;
                if (activeAudio.paused) {
                    await activeAudio.play();
                    playBtn.textContent = '⏸';
                } else {
                    activeAudio.pause();
                    playBtn.textContent = '▶';
                }
            }

            function seekAudio(e) {
                if (!activeAudio || !activeAudio.duration) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                activeAudio.currentTime = Math.max(0, Math.min(activeAudio.duration, activeAudio.duration * percent));
                updateAudioTimeDisplay();
            }

            function updateAudioTimeDisplay() {
                if (!activeAudio || !Number.isFinite(activeAudio.duration)) {
                    audioTime.textContent = '0:00 / 0:00';
                    audioProgressFill.style.width = '0%';
                    return;
                }
                audioTime.textContent = `${formatTime(activeAudio.currentTime)} / ${formatTime(activeAudio.duration)}`;
                const percent = (activeAudio.currentTime / activeAudio.duration) * 100;
                audioProgressFill.style.width = Math.min(100, percent) + '%';
            }

            function updateAudioPageStatus() {
                const shelf = getCurrentShelf();
                const track = shelf?.audioTracks?.find(t => t.id === currentAudioId);
                audioPageLabel.textContent = track?.page || '—';
                if (track) {
                    currentTrackPage.textContent = 'Страница: ' + (track.page || '—');
                }
            }

            // ---------- STATS ----------
            function updateStats() {
                const shelf = getCurrentShelf();
                if (!shelf) return;
                const viewed = (shelf.viewedPages || []).length;
                const ann = Object.values(shelf.annotations || {}).reduce((n, arr) => n + (arr?.length || 0), 0) +
                    Object.values(shelf.textNotes || {}).reduce((n, arr) => n + (arr?.length || 0), 0);
                pagesViewedTop.textContent = viewed;
                annCountTop.textContent = ann;
                audioStatus.textContent = `${(shelf.audioTracks || []).length}`;
            }

            boot();
        });
    </script>
</body>
</html>
