<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talking Points — An Adult English Course (B1–B2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFE1D3;            /* latte */
    --panel: #F9F1E8;         /* cream */
    --ink: #2B1810;           /* dark cocoa */
    --ink-soft: #6B4A37;      /* roasted brown */
    --line: #D3B9A3;          /* milk-chocolate tint */
    --cocoa: #7B4A2E;         /* milk chocolate */
    --cocoa-deep: #3B1F14;    /* dark chocolate */
    --caramel: #A65A1E;       /* caramel */
    --caramel-soft: #EBD3B9;  /* caramel tint */
    --cream-text: #F6E9DA;
    --field: #FFFAF4;         /* warm white for inputs */
    --good: #5F7A45;
    --good-soft: #E6EBD6;
    --bad: #A63D2F;
    --bad-soft: #F3DAD2;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6; }

  .shell{ max-width: 1120px; margin: 0 auto; padding: 40px 24px 96px; display: grid; grid-template-columns: 220px 1fr; gap: 48px; }

  header.masthead{ grid-column: 1 / -1; padding: 34px 38px 32px; background: var(--cocoa-deep); border-radius: 8px; margin-bottom: 8px; }
  header.masthead .kicker{ font-size: 17.1px; color: #E3A868; font-family: var(--serif); font-style: italic; margin: 0 0 6px; }
  header.masthead h1{ font-family: var(--serif); font-weight: 400; font-size: 60.8px; margin: 0 0 8px; color: var(--cream-text); }
  header.masthead p{ max-width: 560px; color: #D6BBA3; margin: 0; font-size: 21.2px; }

  nav.units{ position: sticky; top: 24px; align-self: start; }
  nav.units .label{ font-family: var(--serif); font-style: italic; color: var(--caramel); display: block; font-size: 17.1px; margin-bottom: 16px; }
  nav.units button{
    display: block; width: 100%; text-align: left; background: none; border: none;
    border-left: 2px solid var(--line); padding: 10px 14px; margin-bottom: 2px;
    font-family: var(--sans); font-size: 18.5px; color: var(--ink-soft); cursor: pointer;
    border-radius: 0 4px 4px 0; transition: all .15s;
  }
  nav.units button .unum{ font-family: var(--serif); font-style: italic; color: var(--caramel); margin-right: 6px; }
  nav.units button:hover{ background: var(--caramel-soft); color: var(--cocoa-deep); }
  nav.units button.active{ background: var(--cocoa-deep); border-left-color: var(--caramel); color: var(--cream-text); font-weight: 600; }
  nav.units button.active .unum{ color: #E3A868; }

  main{ max-width: 720px; }
  .unit-panel{ display: none; }
  .unit-panel.active{ display: block; }

  .unit-head{ margin-bottom: 36px; }
  .unit-head .kicker{ font-size: 17.1px; color: var(--caramel); font-family: var(--serif); font-style: italic; margin: 0 0 6px; }
  .unit-head h2{ font-family: var(--serif); font-weight: 400; font-size: 45px; margin: 0 0 10px; color: var(--cocoa-deep); }
  .unit-head h2::after{ content: ""; display: block; width: 64px; height: 3px; margin-top: 14px; border-radius: 2px; background: var(--caramel); }
  .unit-head p{ color: var(--ink-soft); margin: 0 0 18px; font-size: 19.8px; max-width: 560px; }

  .unit-toc{ display: flex; flex-wrap: wrap; gap: 8px; }
  .unit-toc button{
    font-family: var(--sans); font-size: 17.1px; color: var(--cocoa-deep); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: all .15s;
  }
  .unit-toc button:hover{ border-color: var(--cocoa-deep); background: var(--cocoa-deep); color: var(--cream-text); }

  section{ margin-bottom: 56px; }
  section h3{ font-family: var(--serif); font-weight: 400; font-size: 30.4px; color: var(--cocoa-deep); margin: 0 0 18px; padding-left: 14px; border-left: 4px solid var(--caramel); line-height: 1.25; }
  section > p.lede{ color: var(--ink-soft); margin: -10px 0 18px; font-size: 18.5px; }

  .card{ background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 26px; margin-bottom: 14px; }

  .preview-list{ list-style: none; padding: 0; margin: 0; }
  .preview-list li{ font-family: var(--serif); font-size: 23.8px; padding: 15px 0; border-bottom: 1px solid var(--line); }
  .preview-list li:last-child{ border-bottom: none; }
  .preview-list .q-label{ color: var(--caramel); font-family: var(--sans); font-size: 17.1px; display: block; margin-bottom: 4px; }

  .vocab-grid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .vocab-term{ border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 12px 14px; cursor: pointer; font-size: 18.5px; text-align: left; }
  .vocab-term:hover{ border-color: var(--cocoa); }
  .vocab-term.open{ background: var(--caramel-soft); border-color: var(--cocoa); }
  .vocab-term .def{ display: none; font-size: 17.1px; color: var(--ink-soft); margin-top: 6px; }
  .vocab-term.open .def{ display: block; }

  .exercise-row{ display: flex; align-items: baseline; gap: 10px; margin-bottom: 13px; font-size: 18.5px; flex-wrap: wrap; }
  .exercise-row .num{ color: var(--caramel); font-family: var(--serif); font-style: italic; width: 18px; flex-shrink: 0; }
  select, input[type=text]{ font-family: var(--sans); font-size: 18.5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); color: var(--ink); }
  select.correct, input.correct{ border-color: var(--good); background: var(--good-soft); }
  select.incorrect, input.incorrect{ border-color: var(--bad); background: var(--bad-soft); }

  button.check{ font-family: var(--sans); font-size: 18.5px; font-weight: 600; background: var(--cocoa-deep); color: var(--cream-text); border: none; padding: 10px 24px; border-radius: 999px; cursor: pointer; box-shadow: 0 3px 0 var(--caramel); transition: all .15s; }
  button.check:hover{ background: var(--cocoa); }
  button.check:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--caramel); }
  .score{ font-size: 17.1px; margin-top: 10px; color: var(--ink-soft); }
  .ex-title{ font-size: 17.1px; color: var(--ink-soft); margin: 0 0 12px; }

  .reading{ font-family: var(--serif); font-size: 22.4px; line-height: 1.75; }
  .reading p{ margin: 0 0 16px; }

  .comp-q{ margin-bottom: 18px; }
  .comp-q p.q{ font-size: 18.5px; margin: 0 0 8px; font-weight: 600; }
  .comp-q textarea{ width: 100%; min-height: 56px; font-family: var(--sans); font-size: 18.5px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; resize: vertical; }

  .grammar-box{ display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .grammar-box .panel{ background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; }
  .grammar-box h4{ font-family: var(--serif); font-weight: 400; font-size: 21.2px; margin: 0 0 8px; color: var(--cocoa); }
  .grammar-box .formula{ font-size: 17.1px; color: var(--caramel); margin: 0 0 10px; }
  .grammar-box ul{ margin: 0; padding-left: 18px; font-size: 17.1px; color: var(--ink-soft); }
  .grammar-box li{ margin-bottom: 6px; }

  .speaking-list{ list-style: none; padding: 0; margin: 0; }
  .speaking-list li{ font-family: var(--serif); font-size: 21.2px; padding: 10px 0 10px 26px; position: relative; border-bottom: 1px solid var(--line); }
  .speaking-list li:last-child{ border-bottom: none; }
  .speaking-list li::before{ content: "—"; position: absolute; left: 0; color: var(--caramel); }

  .writing-box textarea{ width: 100%; min-height: 120px; font-family: var(--sans); font-size: 18.5px; padding: 12px; border: 1px solid var(--line); border-radius: 4px; resize: vertical; }

  /* --- Word bank + drag/tap-to-fill gaps --- */
  .word-bank{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .word-chip{ font-family:var(--sans); font-size:17.8px; padding:8px 15px; border:1px solid var(--line); border-radius:999px; background:var(--field); cursor:grab; transition:all .15s; user-select:none; }
  .word-chip:hover{ border-color:var(--cocoa); background:var(--caramel-soft); }
  .word-chip.selected{ border-color:var(--cocoa-deep); background:var(--cocoa-deep); color:var(--cream-text); }
  .word-chip.used{ opacity:.3; pointer-events:none; cursor:default; }
  .gap-row .blank{ display:inline-block; min-width:120px; padding:3px 10px; margin:0 2px; border:none; border-bottom:2px dashed var(--cocoa); border-radius:3px; cursor:pointer; font-family:var(--sans); font-weight:600; color:var(--cocoa-deep); text-align:center; transition:all .15s; }
  .gap-row .blank:hover{ background:var(--caramel-soft); }
  .gap-row .blank.filled{ border-bottom-style:solid; }
  .gap-row .blank.correct{ border-color:var(--good); color:var(--good); background:var(--good-soft); }
  .gap-row .blank.incorrect{ border-color:var(--bad); color:var(--bad); background:var(--bad-soft); }
  .gap-row .blank.dragover{ background:var(--caramel-soft); }

  /* --- Click-to-match columns --- */
  .match-cols{ display:flex; gap:14px; margin-top:4px; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:7px; }
  .match-item{ font-family:var(--sans); font-size:17.8px; padding:9px 13px; border:1px solid var(--line); border-radius:6px; background:var(--field); cursor:pointer; transition:all .15s; }
  .match-item:hover{ border-color:var(--cocoa); }
  .match-item.selected{ border-color:var(--cocoa-deep); background:var(--cocoa-deep); color:var(--cream-text); }
  .match-item.matched{ background:var(--good-soft); border-color:var(--good); color:var(--good); cursor:default; }
  .match-item.wrong{ background:var(--bad-soft); border-color:var(--bad); }

  /* --- Pill-button choice (replaces <select> choose...) --- */
  .pill-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .pill{ font-family:var(--sans); font-size:17.8px; padding:7px 16px; border:1px solid var(--line); border-radius:999px; background:var(--field); cursor:pointer; transition:all .15s; }
  .pill:hover{ border-color:var(--cocoa); background:var(--caramel-soft); }
  .pill.disabled{ pointer-events:none; }
  .pill.correct{ border-color:var(--good); background:var(--good-soft); color:var(--good); font-weight:600; }
  .pill.incorrect{ border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }

  @media (max-width: 760px){
    .shell{ grid-template-columns: 1fr; }
    nav.units{ position: static; display: flex; overflow-x: auto; gap: 4px; }
    nav.units button{ border-left: none; border-bottom: 2px solid var(--line); white-space: nowrap; border-radius: 0; }
    .vocab-grid, .grammar-box{ grid-template-columns: 1fr; }
    header.masthead h1{ font-size: 42.3px; }
  }
:root{--bg:#F5ECE1;--panel:#FCF8F2;--line:#DCC8B5}
.shell{display:block;max-width:820px;padding:32px 20px 80px}
header.masthead{margin-bottom:18px;text-align:center}
header.masthead p{margin:0 auto}
nav.units{position:static;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:36px;overflow:visible}
nav.units .label{width:100%;text-align:center;margin:0 0 4px}
nav.units button{width:auto;margin:0;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:transparent;white-space:normal}
nav.units button.active{border-color:var(--cocoa-deep)}
main{max-width:none;margin:0 auto}
</style>
<style id="unify">
/* ===== UNIFIED LAYER (shared by all three books) ===== */
:root{--u-font:"Times New Roman",Times,"Liberation Serif",serif;--u-bg:#F5ECE1;--u-panel:#FCF8F2;--u-field:#FFFAF4;--u-line:#DCC8B5;--u-ink:#2B1810;--u-soft:#6B4A37;--u-choc:#3B1F14;--u-cocoa:#7B4A2E;--u-caramel:#A65A1E;--u-cream:#F6E9DA;--u-good:#5F7A45;--u-good-soft:#E6EBD6;--u-bad:#A63D2F;--u-bad-soft:#F3DAD2;--u-r:10px}
html{scroll-behavior:smooth}
body{font-family:var(--u-font);font-size:21.2px;line-height:1.6;color:var(--u-ink);background:var(--u-bg)}
button,input,select,textarea{font-family:var(--u-font)}

/* unit heading */
.unit-head h1,.unit-head h2{font-family:var(--u-font);font-size:42.3px;font-weight:500;font-style:normal;line-height:1.15;margin:4px 0 10px;color:var(--u-choc)}
.unit-head h1::after,.unit-head h2::after{content:"";display:block;width:56px;height:3px;margin-top:12px;border-radius:2px;background:var(--u-caramel)}
.unit-head p{font-size:20.5px;color:var(--u-soft);max-width:60ch;margin:0 0 18px}
.unit-head .kicker,.unit-head .unum{font-size:17.8px;font-style:italic;color:var(--u-caramel);margin:0}

/* section heading: caramel bar */
section h3,.block h2,.sec-title h2{font-family:var(--u-font);font-size:29.1px;font-weight:500;line-height:1.25;color:var(--u-choc);margin:0 0 14px;padding-left:14px;border-left:4px solid var(--u-caramel)}
.sec-title h2::after{display:none}
.sec-num{display:none}
.sec-head{display:block;margin:0 0 18px}
.sec-head .sec-title h2{margin-bottom:6px}
section > p.lede{margin:-8px 0 16px}
section > p.lede,.block-sub,.sec-title .sub{font-size:19.2px;color:var(--u-soft);max-width:none;padding-left:0}
.block-sub{margin:-8px 0 16px}
.sec-title .sub{margin:0}
section{padding:0;margin:0 0 52px;border:0;scroll-margin-top:90px}
.block{margin-bottom:52px}

/* cards */
.card,.explainer,.passage,.route-card,.grammar-box .panel{background:var(--u-panel);border:1px solid var(--u-line);border-radius:var(--u-r)}
.card{padding:22px 26px}
.passage{padding:22px 26px;max-width:none}
.explainer{border-left:3px solid var(--u-cocoa);padding:16px 20px;font-size:20.5px}
.reading,.passage{font-family:var(--u-font);font-size:22.4px;line-height:1.75}
.reading p,.passage p{margin:0 0 16px}

/* buttons */
button.check,.btn{font-family:var(--u-font);font-size:19.8px;font-weight:600;letter-spacing:0;background:var(--u-choc);color:var(--u-cream);border:0;padding:10px 24px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--u-caramel);transition:all .15s}
button.check:hover,.btn:hover{background:var(--u-cocoa)}
button.check:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--u-caramel)}
.score,.fb,.score-badge,.match-status,.word-count,.save-note{font-size:18.5px;color:var(--u-soft)}

/* text fields */
textarea{width:100%;font-family:var(--u-font);font-size:20.5px;line-height:1.5;color:var(--u-ink);background:var(--u-field);border:1px solid var(--u-line);border-radius:6px;padding:10px 12px;resize:vertical}
.exercise-row select,.exercise-row input[type=text]{font-family:var(--u-font);font-size:20.5px;padding:6px 10px;border:1px solid var(--u-line);border-radius:6px;background:var(--u-field);color:var(--u-ink)}
.exercise-row{font-size:21.2px}
.comp-q p.q,.mcq p.stem,.q-text,.prompt-title{font-size:21.2px;font-weight:600;color:var(--u-ink)}
.gap-item{font-size:21.2px}

/* options / mcq */
.opt-btn,.opt,.pill{font-family:var(--u-font);font-size:20.5px;padding:10px 14px;border:1px solid var(--u-line);border-radius:8px;background:var(--u-field);color:var(--u-ink);cursor:pointer}
.pill{border-radius:999px;padding:7px 16px}
.opt-btn:hover,.opt:hover,.pill:hover{border-color:var(--u-cocoa)}
.opt-btn.correct,.opt.correct{border-color:var(--u-good);background:var(--u-good-soft);color:var(--u-ink)}
.opt-btn.wrong,.opt.wrong{border-color:var(--u-bad);background:var(--u-bad-soft);color:var(--u-ink)}
.pill.correct{border-color:var(--u-good);background:var(--u-good-soft);color:var(--u-good);font-weight:600}
.pill.incorrect{border-color:var(--u-bad);background:var(--u-bad-soft);color:var(--u-bad)}

/* matching */
.match-col{gap:8px}
.match-item{font-family:var(--u-font);font-size:20.5px;padding:10px 14px;border:1px solid var(--u-line);border-radius:8px;background:var(--u-field);color:var(--u-ink);cursor:pointer;text-align:left}
.match-item:hover{border-color:var(--u-cocoa)}
.match-item.selected{border-color:var(--u-choc);background:var(--u-choc);color:var(--u-cream)}
.match-item.matched,.match-item.correct,.match-item.solved{border-color:var(--u-good);background:var(--u-good-soft);color:var(--u-ink);cursor:default;opacity:1}
.match-item.wrong{border-color:var(--u-bad);background:var(--u-bad-soft);color:var(--u-ink)}

/* word bank chips */
.word-chip,.bank-word,.chip{font-family:var(--u-font);font-size:19.8px;font-weight:400;padding:6px 14px;border:1px solid var(--u-line);border-radius:999px;background:var(--u-field);color:var(--u-ink)}
.word-chip:hover,.chip:hover{border-color:var(--u-cocoa);background:#EBD3B9}
.word-chip.selected{border-color:var(--u-choc);background:var(--u-choc);color:var(--u-cream)}
.word-chip.used,.chip.used,.bank-word.used{opacity:.3}
.word-bank,.bank{display:flex;flex-wrap:wrap;gap:8px}

/* blanks */
.blank{font-family:var(--u-font);font-size:21.2px;font-weight:600;color:var(--u-choc);min-width:120px;text-align:center}
.blank.filled{border-radius:3px}

/* vocab */
.vocab-term{font-size:20.5px;border-radius:var(--u-r)}
.vocab-term .def{font-size:19.2px}
.flash-face{border-radius:var(--u-r)}
.flash-term{font-size:23.8px}

/* grammar */
.grammar-box li{font-size:19.2px}
.grammar-box .formula,.ex-title{font-size:18.5px}
.g-note{font-size:20.5px}
table.verbs{font-size:19.8px}

/* level-2 pill navigation (jump-to sections / tabs) */
.unit-toc button,.unit-tab,.side-nav a,.tab-btn{font-family:var(--u-font);font-size:19.2px;font-weight:500}

:root{--sans:var(--u-font);--serif:var(--u-font)}
.shell{max-width:1180px;padding:0 28px 80px}
header.masthead{border-radius:0;margin:0 0 24px;padding:24px 0;background:var(--u-choc);text-align:center;box-shadow:0 0 0 100vmax var(--u-choc);clip-path:inset(0 -100vmax)}
header.masthead .kicker{font-size:18.5px;margin:0 auto 4px}
header.masthead h1{font-size:45px;font-weight:500;margin:0 0 6px}
header.masthead p{font-size:19.8px;max-width:70ch}
nav.units .label{font-size:18.5px}
nav.units button{font-size:19.2px;font-weight:500}
nav.units button.active{font-weight:500}
.unit-toc{margin-bottom:0}
section{scroll-margin-top:16px}
main{max-width:none}
.unit-toc button{background:var(--u-panel);padding:6px 14px}
.unit-head{margin-bottom:36px}
.preview-list li{font-size:23.8px}
.preview-list .q-label{font-size:17.8px}
.speaking-list li{font-size:22.4px}

/* ---------- иллюстрации, карточки слов, компактность ---------- */
.preview-row.has-art{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.unit-art{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--u-line,#D3B9A3);background:#F3E6D8}
.unit-art-svg{display:block;width:100%;height:auto}
.unit-art figcaption{padding:8px 14px 10px;font-style:italic;color:#6B4A37;font-size:18.5px;line-height:1.4;background:#F9F1E8;border-top:1px solid var(--u-line,#D3B9A3)}
.preview-row.has-art .preview-list li{font-size:21.8px;padding:10px 0}
.flip-tools{display:flex;justify-content:flex-end;margin:-4px 0 10px}
.flip-all{font-family:inherit;font-size:18.5px;background:none;border:1px solid #D3B9A3;border-radius:99px;padding:5px 14px;color:#6B4A37;cursor:pointer}
.flip-all:hover{border-color:#6B4A37}
.flip-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.flip-card{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;perspective:800px;text-align:center}
.flip-inner{display:grid;height:100%;min-height:96px;transition:transform .45s ease;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 10px;border-radius:10px;border:1px solid #D3B9A3;backface-visibility:hidden;-webkit-backface-visibility:hidden}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function checkGroup(containerId, scoreId){
  const container = document.getElementById(containerId);
  const fields = container.querySelectorAll("[data-answer]");
  let correct = 0, answered = 0;
  fields.forEach(f => {
    const norm = t => t.toLowerCase().replace(/[\u2018\u2019\u02BC`]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,;]+$/, "")
      .replace(/\bwon't\b/g, "will not").replace(/\bcan't\b/g, "cannot").replace(/\bshan't\b/g, "shall not")
      .replace(/n't\b/g, " not").replace(/'ll\b/g, " will").replace(/'d\b/g, " would").replace(/'re\b/g, " are").replace(/'ve\b/g, " have").replace(/\bi'm\b/g, "i am")
      .replace(/\bcan not\b/g, "cannot")
      .replace(/practis/g, "practic").replace(/([a-z]{2,})is(e|es|ed|ing|ation)\b/g, "$1iz$2").replace(/([aeiou])ll(ed|ing)\b/g, "$1l$2")
      .replace(/\s+/g, " ").trim();
    const val = norm(f.value);
    if (val === "") { f.classList.remove("correct","incorrect"); return; }
    answered++;
    const accepted = [f.dataset.answer].concat(f.dataset.alts ? f.dataset.alts.split("|") : []);
    const ok = accepted.some(a => norm(a) === val);
    f.classList.toggle("correct", ok);
    f.classList.toggle("incorrect", !ok);
    if (ok) correct++;
  });
  const scoreEl = document.getElementById(scoreId);
  if (answered === 0){
    scoreEl.style.color = "var(--bad)";
    scoreEl.textContent = "Answer at least one item first.";
  } else {
    scoreEl.style.color = "var(--ink-soft)";
    scoreEl.textContent = correct + " of " + fields.length + " correct.";
    if (correct === fields.length) a2MarkDone(containerId);
  }
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

/* ============ Упражнение 1: перетащи / нажми слово в пропуск ============ */
const gapState = {};
function renderWordBankGaps(unit, card){
  const bodyId = unit.id + "-vocabGap";
  const bankId = bodyId + "-bank";
  const scoreId = bodyId + "Score";
  gapState[bodyId] = { selected: null };

  const bank = el("div", "word-bank");
  bank.id = bankId;
  shuffle(unit.vocab.map(v => v.word)).forEach(word => {
    const chip = el("span", "word-chip", word);
    chip.dataset.word = word;
    chip.draggable = true;
    chip.onclick = () => selectChip(bodyId, chip);
    chip.ondragstart = e => { e.dataTransfer.setData("text/plain", word); selectChip(bodyId, chip); };
    bank.appendChild(chip);
  });
  card.appendChild(bank);

  const body = el("div");
  body.id = bodyId;
  unit.vocabGap.forEach((item, i) => {
    const row = el("div", "exercise-row gap-row");
    const parts = item.sentence.split("___");
    row.appendChild(el("span", "num", (i+1) + "."));
    row.appendChild(document.createTextNode(parts[0]));
    const blank = el("span", "blank", "_____");
    blank.dataset.answer = item.answer;
    blank.onclick = () => fillBlank(bodyId, blank, scoreId);
    blank.ondragover = e => { e.preventDefault(); blank.classList.add("dragover"); };
    blank.ondragleave = () => blank.classList.remove("dragover");
    blank.ondrop = e => {
      e.preventDefault();
      blank.classList.remove("dragover");
      const word = e.dataTransfer.getData("text/plain");
      const chip = Array.from(document.getElementById(bankId).children).find(c => c.dataset.word === word && !c.classList.contains("used"));
      if (chip) { gapState[bodyId].selected = chip; fillBlank(bodyId, blank, scoreId); }
    };
    row.appendChild(blank);
    if (parts[1]) row.appendChild(document.createTextNode(parts[1]));
    body.appendChild(row);
  });
  card.appendChild(body);

  const score = el("p", "score", "Drag a word onto a gap, or tap a word then tap a gap.");
  score.id = scoreId;
  card.appendChild(score);
}
function selectChip(bodyId, chip){
  if (chip.classList.contains("used")) return;
  const state = gapState[bodyId];
  if (state.selected) state.selected.classList.remove("selected");
  state.selected = chip;
  chip.classList.add("selected");
}
function fillBlank(bodyId, blank, scoreId){
  if (blank.classList.contains("correct")) return;
  if (blank.classList.contains("filled")){
    const bank = document.getElementById(bodyId + "-bank");
    const returned = Array.from(bank.children).find(c => c.dataset.word === blank.dataset.filledWord);
    if (returned) returned.classList.remove("used");
    blank.textContent = "_____";
    blank.classList.remove("filled", "incorrect");
    delete blank.dataset.filledWord;
    updateGapScore(bodyId, scoreId);
    return;
  }
  const state = gapState[bodyId];
  if (!state.selected) return;
  const chip = state.selected;
  blank.textContent = chip.dataset.word;
  blank.dataset.filledWord = chip.dataset.word;
  blank.classList.add("filled");
  const ok = chip.dataset.word === blank.dataset.answer;
  blank.classList.add(ok ? "correct" : "incorrect");
  chip.classList.add("used");
  chip.classList.remove("selected");
  state.selected = null;
  updateGapScore(bodyId, scoreId);
}
function updateGapScore(bodyId, scoreId){
  const body = document.getElementById(bodyId);
  const blanks = body.querySelectorAll(".blank");
  const filled = body.querySelectorAll(".blank.filled").length;
  const correct = body.querySelectorAll(".blank.correct").length;
  const scoreEl = document.getElementById(scoreId);
  scoreEl.style.color = "var(--ink-soft)";
  if (filled === 0){ scoreEl.textContent = "Drag a word onto a gap, or tap a word then tap a gap."; return; }
  scoreEl.textContent = correct + " of " + blanks.length + " correct" + (filled < blanks.length ? " (" + (blanks.length - filled) + " left)." : ".");
  if (correct === blanks.length) a2MarkDone(bodyId);
}

/* ============ Упражнение 2: нажми слово, затем его пару ============ */
const clickMatchState = {};
function renderClickMatch(id, leftItems, rightItems, card){
  const scoreId = id + "Score";
  clickMatchState[id] = { selIdx: null, selEl: null };
  const perm = shuffle(rightItems.map((_, i) => i));
  const wrap = el("div", "match-cols");
  wrap.id = id;
  const leftCol = el("div", "match-col");
  leftItems.forEach((text, i) => {
    const item = el("div", "match-item", text);
    item.onclick = () => clickMatch(id, "left", i, item, scoreId, leftItems.length);
    leftCol.appendChild(item);
  });
  const rightCol = el("div", "match-col");
  perm.forEach(origIdx => {
    const item = el("div", "match-item", rightItems[origIdx]);
    item.onclick = () => clickMatch(id, "right", origIdx, item, scoreId, leftItems.length);
    rightCol.appendChild(item);
  });
  wrap.appendChild(leftCol);
  wrap.appendChild(rightCol);
  card.appendChild(wrap);
  const score = el("p", "score", "Tap an item on the left, then its match on the right.");
  score.id = scoreId;
  card.appendChild(score);
}
function clickMatch(id, side, idx, itemEl, scoreId, total){
  if (itemEl.classList.contains("matched")) return;
  const state = clickMatchState[id];
  if (side === "left"){
    if (state.selEl) state.selEl.classList.remove("selected");
    state.selIdx = idx; state.selEl = itemEl; itemEl.classList.add("selected");
  } else {
    if (state.selIdx === null) return;
    if (idx === state.selIdx){
      itemEl.classList.add("matched"); itemEl.classList.remove("selected");
      state.selEl.classList.add("matched"); state.selEl.classList.remove("selected");
      state.selIdx = null; state.selEl = null;
      const container = document.getElementById(id);
      const matched = container.querySelectorAll(".match-item.matched").length / 2;
      const scoreEl = document.getElementById(scoreId);
      scoreEl.style.color = "var(--ink-soft)";
      scoreEl.textContent = matched === total ? "All " + total + " matched! 🎉" : matched + " of " + total + " matched.";
      if (matched === total) a2MarkDone(id);
    } else {
      itemEl.classList.add("wrong");
      const selEl = state.selEl;
      setTimeout(() => { itemEl.classList.remove("wrong"); if (selEl) selEl.classList.remove("selected"); }, 450);
      state.selIdx = null; state.selEl = null;
    }
  }
}

/* ============ Упражнения 3: выбор одним нажатием (вместо select) ============ */
function renderPillChoice(id, items, card){
  const scoreId = id + "Score";
  const body = el("div");
  body.id = id;
  items.forEach((item, i) => {
    const row = el("div", "exercise-row");
    row.style.flexDirection = "column";
    row.style.alignItems = "flex-start";
    const top = el("div");
    top.innerHTML = '<span class="num">' + (i+1) + '.</span><span>' + item.sentence.replace("___", "______") + '</span>';
    row.appendChild(top);
    const pillRow = el("div", "pill-row");
    item.options.forEach(opt => {
      const pill = el("button", "pill", opt);
      pill.type = "button";
      pill.dataset.correct = (opt === item.answer) ? "1" : "0";
      pill.onclick = () => selectPill(id, scoreId, pill, items.length);
      pillRow.appendChild(pill);
    });
    row.appendChild(pillRow);
    body.appendChild(row);
  });
  card.appendChild(body);
  const score = el("p", "score", "Tap the correct option in each row.");
  score.id = scoreId;
  card.appendChild(score);
}
function selectPill(containerId, scoreId, pill, total){
  const row = pill.closest(".exercise-row");
  if (row.dataset.answered) return;
  row.dataset.answered = "1";
  const isCorrect = pill.dataset.correct === "1";
  row.dataset.wasCorrect = isCorrect ? "1" : "0";
  const pills = row.querySelectorAll(".pill");
  pills.forEach(p => p.classList.add("disabled"));
  if (isCorrect){
    pill.classList.add("correct");
  } else {
    pill.classList.add("incorrect");
    pills.forEach(p => { if (p.dataset.correct === "1") p.classList.add("correct"); });
  }
  updatePillScore(containerId, scoreId, total);
}
function updatePillScore(containerId, scoreId, total){
  const container = document.getElementById(containerId);
  const rows = container.querySelectorAll(".exercise-row");
  const answered = Array.from(rows).filter(r => r.dataset.answered === "1");
  const correct = answered.filter(r => r.dataset.wasCorrect === "1");
  const scoreEl = document.getElementById(scoreId);
  scoreEl.style.color = "var(--ink-soft)";
  if (answered.length === 0){ scoreEl.textContent = "Tap the correct option in each row."; return; }
  scoreEl.textContent = correct.length + " of " + rows.length + " correct" + (answered.length < rows.length ? " (" + (rows.length - answered.length) + " left)." : ".");
  if (answered.length === rows.length){
    if (correct.length === rows.length){ a2MarkDone(containerId); }
    else {
      scoreEl.textContent += " The exercise counts as done when all answers are correct. ";
      const retry = el("button", "retry-btn", "Try again");
      retry.type = "button";
      retry.onclick = () => {
        rows.forEach(r => { delete r.dataset.answered; delete r.dataset.wasCorrect; r.querySelectorAll(".pill").forEach(p => p.classList.remove("disabled","correct","incorrect")); });
        updatePillScore(containerId, scoreId, total);
      };
      scoreEl.appendChild(retry);
    }
  }
}

function renderUnit(unit, index){
  const panel = el("div", "unit-panel" + (index === 0 ? " active" : ""));
  panel.id = unit.id;

  const head = el("div", "unit-head",
    '<p class="kicker">' + unit.kicker + ' · Grammar focus: ' + unit.grammarName + '</p>' +
    '<h2>' + unit.title + '</h2><p>' + unit.intro + '</p>'
  );
  const toc = el("div", "unit-toc");
  const tocSections = [
    ["Preview", unit.id + "-preview"],
    ["Vocabulary", unit.id + "-vocab"],
    ["Reading", unit.id + "-reading"],
    ["Comprehension", unit.id + "-comprehension"],
    ["Grammar", unit.id + "-grammar"],
    ["Speaking", unit.id + "-speaking"],
    ["Writing", unit.id + "-writing"]
  ];
  tocSections.forEach(([label, secId]) => {
    const b = el("button", null, label);
    b.type = "button";
    b.onclick = () => document.getElementById(secId).scrollIntoView({behavior: "smooth", block: "start"});
    toc.appendChild(b);
  });
  head.appendChild(toc);
  panel.appendChild(head);

  // Preview
  const preview = el("section");
  preview.id = unit.id + "-preview";
  preview.appendChild(el("h3", null, "Before you read"));
  preview.appendChild(el("p", "lede", "Think about these questions for a minute, then discuss."));
  const pList = el("ul", "preview-list");
  unit.preview.forEach((q, i) => {
    pList.appendChild(el("li", null, '<span class="q-label">0' + (i+1) + '</span>' + q));
  });
  const pRow = el("div", "preview-row" + (TP_ART[unit.id] ? " has-art" : ""));
  if (TP_ART[unit.id]) pRow.appendChild(el("figure", "unit-art", TP_ART[unit.id] + '<figcaption>Look at the picture. What can you see? How is it connected to the topic?</figcaption>'));
  pRow.appendChild(pList);
  preview.appendChild(pRow);
  panel.appendChild(preview);

  // Vocabulary
  const vocabSec = el("section");
  vocabSec.id = unit.id + "-vocab";
  vocabSec.appendChild(el("h3", null, "Vocabulary"));
  vocabSec.appendChild(el("p", "lede", "Tap a card to see the translation, then complete the exercises below."));
  const flipTools = el("div", "flip-tools");
  const flipAll = el("button", "flip-all", "Show all translations");
  flipAll.type = "button";
  flipTools.appendChild(flipAll);
  vocabSec.appendChild(flipTools);
  const vGrid = el("div", "flip-grid");
  unit.vocab.forEach(v => {
    const card = el("button", "flip-card",
      '<span class="flip-inner"><span class="flip-face flip-front"><span class="fc-w">' + v.word + '</span></span>' +
      '<span class="flip-face flip-back"><span class="fc-ru">' + (TP_RU[v.word] || '') + '</span><span class="fc-def">' + v.def + '</span></span></span>');
    card.type = "button";
    card.setAttribute("aria-pressed", "false");
    card.onclick = () => { const on = card.classList.toggle("flipped"); card.setAttribute("aria-pressed", on ? "true" : "false"); };
    vGrid.appendChild(card);
  });
  flipAll.onclick = () => {
    const cards = vGrid.querySelectorAll(".flip-card");
    const showAll = Array.from(cards).some(c => !c.classList.contains("flipped"));
    cards.forEach(c => { c.classList.toggle("flipped", showAll); c.setAttribute("aria-pressed", showAll ? "true" : "false"); });
    flipAll.textContent = showAll ? "Hide translations" : "Show all translations";
  };
  vocabSec.appendChild(vGrid);

  // Vocab exercise 1: gap fill — drag / tap a word from the bank into the gap
  const vGapCard = el("div", "card");
  vGapCard.appendChild(el("p", "ex-title", "1. Drag (or tap) the correct word into each gap."));
  renderWordBankGaps(unit, vGapCard);
  vocabSec.appendChild(vGapCard);

  // Vocab exercise 2: matching — tap a word, then tap its definition
  const vMatchCard = el("div", "card");
  vMatchCard.appendChild(el("p", "ex-title", "2. Tap a word, then tap its definition."));
  renderClickMatch(unit.id + "-vocabMatch", unit.vocab.map(v => v.word), unit.vocab.map(v => v.def), vMatchCard);
  vocabSec.appendChild(vMatchCard);

  // Vocab exercise 3: true/false — tap True or False
  const vTFCard = el("div", "card");
  vTFCard.appendChild(el("p", "ex-title", "3. True or false?"));
  renderPillChoice(
    unit.id + "-vocabTF",
    unit.vocabTF.map(item => ({ sentence: item.statement, options: ["True", "False"], answer: item.answer ? "True" : "False" })),
    vTFCard
  );
  vocabSec.appendChild(vTFCard);

  panel.appendChild(vocabSec);

  // Reading
  const readSec = el("section");
  readSec.id = unit.id + "-reading";
  readSec.appendChild(el("h3", null, "Reading"));
  const readCard = el("div", "card reading");
  unit.reading.forEach(p => readCard.appendChild(el("p", null, p)));
  readSec.appendChild(readCard);
  panel.appendChild(readSec);

  // Comprehension
  const compSec = el("section");
  compSec.id = unit.id + "-comprehension";
  compSec.appendChild(el("h3", null, "Comprehension"));
  const compCard = el("div", "card");
  unit.comprehension.forEach((q, i) => {
    const block = el("div", "comp-q");
    block.innerHTML = '<p class="q">' + (i+1) + '. ' + q + '</p><textarea data-save="' + unit.id + '-comp-' + i + '" placeholder="Write your answer here..."></textarea>';
    compCard.appendChild(block);
  });
  compSec.appendChild(compCard);
  panel.appendChild(compSec);

  // Grammar
  const gramSec = el("section");
  gramSec.id = unit.id + "-grammar";
  gramSec.appendChild(el("h3", null, "Grammar: " + unit.grammarName));
  gramSec.appendChild(el("p", "lede", "Study the two forms, then complete the exercises."));
  const gBox = el("div", "grammar-box");
  unit.grammarPanels.forEach(p => {
    const pnl = el("div", "panel");
    pnl.innerHTML = '<h4>' + p.title + '</h4><p class="formula">' + p.formula + '</p><ul>' + p.notes.map(n => '<li>' + n + '</li>').join("") + '</ul>';
    gBox.appendChild(pnl);
  });
  gramSec.appendChild(gBox);

  // Grammar exercise 1: write
  const gWriteCard = el("div", "card");
  gWriteCard.appendChild(el("p", "ex-title", "1. Write the correct form."));
  const gWriteBody = el("div");
  gWriteBody.id = unit.id + "-grammarWrite";
  unit.grammarWrite.forEach((item, i) => {
    const row = el("div", "exercise-row");
    row.innerHTML = '<span class="num">' + (i+1) + '.</span><span>' + item.sentence + '</span>';
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "type the verb form";
    input.dataset.answer = item.answer;
    if (item.alts) input.dataset.alts = item.alts.join("|");
    row.appendChild(input);
    gWriteBody.appendChild(row);
  });
  gWriteCard.appendChild(gWriteBody);
  const gWriteBtn = el("button", "check", "Check answers");
  gWriteBtn.onclick = () => checkGroup(unit.id + "-grammarWrite", unit.id + "-grammarWriteScore");
  gWriteCard.appendChild(gWriteBtn);
  gWriteCard.appendChild(el("p", "score", ""));
  gWriteCard.lastChild.id = unit.id + "-grammarWriteScore";
  gramSec.appendChild(gWriteCard);

  // Grammar exercise 2: choice — tap the correct option
  const gChoiceCard = el("div", "card");
  gChoiceCard.appendChild(el("p", "ex-title", "2. Tap the correct option."));
  renderPillChoice(
    unit.id + "-grammarChoice",
    unit.grammarChoice.map(item => ({ sentence: item.sentence, options: item.options, answer: item.answer })),
    gChoiceCard
  );
  gramSec.appendChild(gChoiceCard);

  // Grammar exercise 3: correct/incorrect — tap Correct or Incorrect
  const gTFCard = el("div", "card");
  gTFCard.appendChild(el("p", "ex-title", "3. Is the sentence correct or incorrect?"));
  renderPillChoice(
    unit.id + "-grammarTF",
    unit.grammarTF.map(item => ({ sentence: item.sentence, options: ["Correct", "Incorrect"], answer: item.answer ? "Correct" : "Incorrect" })),
    gTFCard
  );
  gramSec.appendChild(gTFCard);

  panel.appendChild(gramSec);

  // Speaking
  const speakSec = el("section");
  speakSec.id = unit.id + "-speaking";
  speakSec.appendChild(el("h3", null, "Speaking"));
  const sList = el("ul", "speaking-list");
  unit.speaking.forEach(q => sList.appendChild(el("li", null, q)));
  speakSec.appendChild(sList);
  panel.appendChild(speakSec);

  // Writing
  const writeSec = el("section");
  writeSec.id = unit.id + "-writing";
  writeSec.appendChild(el("h3", null, "Writing"));
  const writeCard = el("div", "card writing-box");
  writeCard.innerHTML = '<p class="lede" style="margin-top:0;">' + unit.writing + '</p><textarea data-save="' + unit.id + '-writing" placeholder="Write your answer here..."></textarea><p class="saved-note">Your text is saved automatically in this browser.</p>';
  writeSec.appendChild(writeCard);
  panel.appendChild(writeSec);

  return panel;
}

const navEl = document.getElementById("unitNav");
const mainEl = document.getElementById("unitMain");
navEl.appendChild(el("span", "label", "Course contents"));

UNITS.forEach((unit, i) => {
  const btn = el("button", i === 0 ? "active" : "", '<span class="unum">' + String(i+1).padStart(2,'0') + '</span>' + unit.title);
  btn.onclick = () => {
    document.querySelectorAll(".unit-panel").forEach(p => p.classList.remove("active"));
    document.getElementById(unit.id).classList.add("active");
    navEl.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    window.scrollTo({top: 0, behavior: "smooth"});
  };
  navEl.appendChild(btn);
  mainEl.appendChild(renderUnit(unit, i));
});

/* ============ ПРОГРЕСС И СОХРАНЕНИЕ ОТВЕТОВ ============ */
const A2_KEYS = ["vocabGap", "vocabMatch", "vocabTF", "grammarWrite", "grammarChoice", "grammarTF"];
const A2_STORE = "talkingPointsProgress", A2_TEXTS = "talkingPointsAnswers", A2_LAST = "talkingPointsLastUnit";
function a2Load(key){ try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch(e){ return {}; } }
function a2Save(key, obj){ try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e){} }
let a2Done = a2Load(A2_STORE);
const a2Texts = a2Load(A2_TEXTS);

function a2UnitPct(uid){ return Math.round(A2_KEYS.filter(k => a2Done[uid + "-" + k]).length / A2_KEYS.length * 100); }
function a2CoursePct(){
  const total = UNITS.length * A2_KEYS.length;
  return Math.round(Object.keys(a2Done).filter(k => a2Done[k]).length / total * 100);
}
function a2MarkDone(key){
  if (a2Done[key]) return;
  a2Done[key] = true;
  a2Save(A2_STORE, a2Done);
  a2Render();
}
function a2Render(){
  // отметки на упражнениях
  UNITS.forEach(u => A2_KEYS.forEach(k => {
    const box = document.getElementById(u.id + "-" + k);
    const card = box && box.closest(".card");
    if (!card) return;
    const done = !!a2Done[u.id + "-" + k];
    card.classList.toggle("ex-done", done);
    const t = card.querySelector(".ex-title");
    if (t && !t.querySelector(".done-mark")) { const m = el("span", "done-mark", "✓ done"); t.appendChild(m); }
  }));
  // кнопки юнитов
  navEl.querySelectorAll("button").forEach((b, i) => {
    const u = UNITS[i]; if (!u) return;
    const pct = a2UnitPct(u.id);
    let tag = b.querySelector(".u-pct");
    if (!tag) { tag = el("span", "u-pct"); b.appendChild(tag); }
    tag.textContent = pct === 100 ? "✓" : (pct ? pct + "%" : "");
    b.classList.toggle("unit-complete", pct === 100);
  });
  // полоска прогресса в шапке юнита
  UNITS.forEach(u => {
    const head = document.querySelector("#" + u.id + " .unit-head");
    if (!head) return;
    let bar = head.querySelector(".unit-progress");
    if (!bar) {
      bar = el("div", "unit-progress", '<span class="up-track"><i></i></span><span class="up-text"></span>');
      head.insertBefore(bar, head.querySelector(".unit-toc"));
    }
    const done = A2_KEYS.filter(k => a2Done[u.id + "-" + k]).length;
    bar.querySelector("i").style.width = (done / A2_KEYS.length * 100) + "%";
    bar.querySelector(".up-text").textContent = "Unit progress: " + done + " of " + A2_KEYS.length + " exercises · Course: " + a2CoursePct() + "%";
  });
}
// сохранение ответов на вопросы и Writing
document.querySelectorAll("textarea[data-save]").forEach(ta => {
  if (a2Texts[ta.dataset.save]) ta.value = a2Texts[ta.dataset.save];
  let timer = null;
  ta.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (ta.value.trim()) a2Texts[ta.dataset.save] = ta.value; else delete a2Texts[ta.dataset.save];
      a2Save(A2_TEXTS, a2Texts);
    }, 400);
  });
});
// запомнить последний юнит
navEl.querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => {
  try { localStorage.setItem(A2_LAST, String(i)); } catch(e){}
  if (b.scrollIntoView && navEl.scrollWidth > navEl.clientWidth) b.scrollIntoView({ inline: "center", block: "nearest" });
}));
(function(){
  let last = 0;
  try { last = parseInt(localStorage.getItem(A2_LAST), 10) || 0; } catch(e){}
  const btns = navEl.querySelectorAll("button");
  if (last > 0 && btns[last]) {
    document.querySelectorAll(".unit-panel").forEach(p => p.classList.remove("active"));
    document.getElementById(UNITS[last].id).classList.add("active");
    btns.forEach(x => x.classList.remove("active"));
    btns[last].classList.add("active");
  }
})();
// сброс
const a2Reset = el("div", "reset-wrap", '<button type="button" class="reset-progress">Reset progress</button>');
mainEl.insertAdjacentElement("afterend", a2Reset);
a2Reset.querySelector("button").onclick = () => {
  if (!confirm("Reset all progress and saved answers?")) return;
  try { localStorage.removeItem(A2_STORE); localStorage.removeItem(A2_TEXTS); } catch(e){}
  location.reload();
};
a2Render();
</script>
<script id="anchor-fix">document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();var t=document.getElementById(a.getAttribute("href").slice(1));if(t)t.scrollIntoView({behavior:"smooth",block:"start"});});window.addEventListener("scroll",function(){var l=document.querySelectorAll(".side-nav a");if(l.length&&window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4){l.forEach(function(a,i){a.classList.toggle("active",i===l.length-1);});}},{passive:true});</script>
