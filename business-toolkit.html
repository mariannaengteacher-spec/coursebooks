<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business English Toolkit</title>
<style>
  :root{
    --paper:#FBF8F3;
    --paper-2:#F8F0E8;
    --ink:#2D1F13;
    --ink-soft:#7A644F;
    --line:#D4C0B0;
    --teal:#6F8F5B;
    --teal-bg:#EAF0E3;
    --brick:#C1652E;
    --brick-bg:#F5E1CB;
    --red:#8B3A2B;
    --red-bg:#F1DAD2;
    --steel:#5C4030;
    --steel-bg:#E6D9C4;
    --plum:#7A4A1E;
    --plum-bg:#EEDFC0;
    --gold:#9C7A1F;
    --gold-bg:#F0E6C0;
    --white:#FBF8F3;
    --radius:3px;
    --shadow: 0 1px 0 rgba(45,31,19,.1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper-2);
    color:var(--ink);
    font-family:'Times New Roman',Times,serif;
    font-size:21.2px;
    line-height:1.55;
  }
  h1,h2,h3,h4{
    font-family:'Times New Roman',Times,serif;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  .letterhead{
    background:var(--ink);
    color:var(--paper);
    padding:28px clamp(16px,4vw,48px) 22px;
    border-bottom:4px solid var(--brick);
  }
  .letterhead-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .letterhead h1{
    color:var(--white);
    font-size:clamp(34.4px,4.6vw,45px);
    letter-spacing:.2px;
  }
  .letterhead p{
    margin:6px 0 0;
    color:#D9C9AF;
    font-size:19.2px;
    max-width:46ch;
  }
  .level-key{
    display:flex;
    gap:10px;
    font-size:17.1px;
    color:#D9C9AF;
  }
  .level-key span{
    border:1px solid #6B5642;
    border-radius:20px;
    padding:4px 12px;
  }
  .level-key b{color:var(--white);}

  .layout{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:200px 1fr;
    gap:0;
    align-items:start;
  }
  .tabs{
    position:sticky;
    top:0;
    padding:26px 0 26px 0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .tab-btn{
    text-align:left;
    border:none;
    border-left:4px solid transparent;
    background:transparent;
    font-family:'Times New Roman',Times,serif;
    font-weight:600;
    font-size:19.2px;
    color:var(--ink-soft);
    padding:12px 16px;
    cursor:pointer;
    letter-spacing:.2px;
    transition:background .15s,color .15s,border-color .15s;
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .tab-btn .lv{
    display:block;
    font-family:'Times New Roman',Times,serif;
    font-weight:500;
    font-size:15.2px;
    color:var(--ink-soft);
    opacity:.65;
    margin-top:2px;
  }
  .tab-btn:hover{background:var(--paper);}
  .tab-btn.active{
    background:var(--white);
    color:var(--ink);
    box-shadow:var(--shadow);
  }
  .tab-btn[data-section="email"].active{border-left-color:var(--teal);}
  .tab-btn[data-section="phone"].active{border-left-color:var(--brick);}
  .tab-btn[data-section="negotiations"].active{border-left-color:var(--red);}
  .tab-btn[data-section="presentations"].active{border-left-color:var(--steel);}
  .tab-btn[data-section="grammar"].active{border-left-color:var(--plum);}
  .tab-btn[data-section="talking"].active{border-left-color:var(--gold);}
  .tab-btn[data-section="emailsamples"].active{border-left-color:var(--teal);}
  .tab-btn[data-section="negsamples"].active{border-left-color:var(--red);}

  .content{
    background:var(--white);
    min-height:70vh;
    padding:32px clamp(16px,4vw,44px) 60px;
    border-left:1px solid var(--line);
  }
  .section{display:none;}
  .section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .section-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding-bottom:18px;
    margin-bottom:22px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .section-head h2{font-size:clamp(29.1px,3.4vw,37px);}
  .badge{
    font-family:'Times New Roman',Times,serif;
    font-weight:700;
    font-size:16.6px;
    padding:4px 11px;
    border-radius:20px;
    letter-spacing:.3px;
  }
  .badge-b1{background:var(--teal-bg);color:var(--teal);}
  .badge-b2{background:var(--plum-bg);color:var(--plum);}
  .section-intro{
    color:var(--ink-soft);
    font-size:19.8px;
    max-width:70ch;
    margin-bottom:26px;
  }
  .block-label{
    font-family:'Times New Roman',Times,serif;
    font-weight:700;
    font-size:17.1px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin:34px 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .block-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  /* ---- reading: email ---- */
  .reading-wrap{
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:8px;
  }
  .email-card{
    background:var(--white);
    padding:18px 20px;
  }
  .email-card + .email-card{border-top:1px dashed var(--line);background:var(--paper);}
  .email-meta{
    font-family:'Times New Roman',Times,serif;
    font-size:16.6px;
    color:var(--ink-soft);
    line-height:1.9;
    padding-bottom:10px;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .email-meta b{color:var(--ink);font-weight:600;}
  .email-body p{margin:0 0 12px;font-size:19.5px;}
  .email-body p:last-child{margin-bottom:0;}

  /* ---- reading: dialogue ---- */
  .dialogue-wrap{background:var(--white);padding:6px 20px;}
  .dialogue-line{
    display:flex;
    gap:12px;
    padding:11px 0;
    border-bottom:1px dashed var(--line);
    font-size:19.5px;
  }
  .dialogue-line:last-child{border-bottom:none;}
  .dialogue-speaker{
    flex-shrink:0;
    width:92px;
    font-weight:700;
    font-size:17.1px;
    padding-top:1px;
  }
  .dialogue-text{flex:1;}

  /* ---- reading: transcript ---- */
  .transcript-wrap{background:var(--white);padding:20px 22px;}
  .transcript-wrap p{font-size:19.5px;margin:0 0 13px;}
  .transcript-wrap p:last-child{margin-bottom:0;}
  .transcript-tag{
    font-family:'Times New Roman',Times,serif;
    font-size:15.9px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--steel);
    margin-bottom:10px;
    display:block;
  }

  /* ---- accordion (shared) ---- */
  .exercise{
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
    background:var(--paper);
  }
  .ex-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 18px;
    cursor:pointer;
    background:var(--white);
  }
  .ex-head:hover{background:var(--paper);}
  .ex-title{
    font-family:'Times New Roman',Times,serif;
    font-weight:600;
    font-size:19.8px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .ex-num{
    width:26px;height:26px;
    border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:16.6px;font-weight:700;
    background:var(--paper-2);
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .ex-status{
    font-size:16.6px;
    color:var(--ink-soft);
    font-weight:500;
    white-space:nowrap;
  }
  .ex-caret{
    font-size:15.9px;color:var(--ink-soft);
    transition:transform .2s;
  }
  .exercise.open .ex-caret{transform:rotate(90deg);}
  .ex-body{
    display:none;
    padding:18px 18px 22px;
    border-top:1px solid var(--line);
  }
  .exercise.open .ex-body{display:block;}

  /* matching */
  .match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 22px;
  }
  .match-item{
    text-align:left;
    width:100%;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:var(--radius);
    padding:10px 13px;
    font-size:19.2px;
    cursor:pointer;
    transition:all .12s;
    color:var(--ink);
  }
  .match-item:hover{border-color:var(--ink-soft);}
  .match-item.selected{
    border-color:var(--ink);
    background:var(--paper-2);
    box-shadow:inset 0 0 0 1px var(--ink);
  }
  .match-item.correct{
    border-color:var(--teal);
    background:var(--teal-bg);
    color:var(--teal);
    cursor:default;
    font-weight:600;
  }
  .match-item.wrong{
    border-color:var(--red);
    background:var(--red-bg);
    animation:shake .3s;
  }
  .match-item.disabled{cursor:default;opacity:.55;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  .match-reset{
    margin-top:14px;
    font-size:17.1px;
    font-family:'Times New Roman',Times,serif;
    font-weight:600;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .match-reset:hover{border-color:var(--ink-soft);}

  /* word bank */
  .wb-bank{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom:1px dashed var(--line);
  }
  .wb-chip{
    font-family:'Times New Roman',Times,serif;
    font-size:16.9px;
    background:var(--teal-bg);
    color:var(--teal);
    border:1px solid #d6e2cc;
    padding:5px 11px;
    border-radius:20px;
    cursor:pointer;
    user-select:none;
  }
  .wb-chip:hover{background:#dde9d2;}
  .wb-chip.used{opacity:.35;text-decoration:line-through;cursor:default;pointer-events:none;}
  .wb-chip.dragging{opacity:.5;}
  .wb-chip[draggable="true"]{cursor:grab;}

  /* grammar / gap rows (shared with wordbank) */
  .g-instructions{
    font-size:17.8px;
    color:var(--ink-soft);
    margin-bottom:14px;
    font-style:italic;
  }
  .g-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:9px 0;
    border-bottom:1px dashed var(--line);
    font-size:19.2px;
    flex-wrap:wrap;
  }
  .g-row:last-of-type{border-bottom:none;}
  .g-num{
    font-weight:700;
    color:var(--ink-soft);
    font-size:17.1px;
    width:18px;
    flex-shrink:0;
  }
  .g-sentence{flex:1;min-width:220px;}
  .g-input{
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    font-family:'Times New Roman',Times,serif;
    font-size:19.2px;
    padding:2px 4px;
    width:170px;
    color:var(--ink);
    font-weight:600;
  }
  .g-input:focus{outline:none;border-bottom-color:var(--plum);}
  .g-input.correct{border-bottom-color:var(--teal);color:var(--teal);background:var(--teal-bg);}
  .g-input.wrong{border-bottom-color:var(--red);color:var(--red);background:var(--red-bg);}
  .g-dropzone{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:150px;
    min-height:26px;
    width:auto;
    border:none;
    border-bottom:2px dashed var(--ink-soft);
    cursor:pointer;
    vertical-align:bottom;
  }
  .g-dropzone:empty::before{
    content:"drop word here";
    color:var(--ink-soft);
    opacity:.55;
    font-weight:400;
    font-style:italic;
    font-size:17.1px;
  }
  .g-dropzone.filled{border-bottom-style:solid;border-bottom-color:var(--line);}
  .g-dropzone.selected{border-bottom-color:var(--plum);border-bottom-style:solid;background:var(--plum-bg);}
  .g-dropzone.dragover{background:var(--teal-bg);border-bottom-color:var(--teal);}
  .g-dropzone.disabled-zone{cursor:default;}

  /* word order exercise */
  .wo-row{
    padding:14px 0;
    border-bottom:1px dashed var(--line);
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .wo-row:last-of-type{border-bottom:none;}
  .wo-col{flex:1;min-width:0;}
  .wo-answer{
    min-height:38px;
    border:2px dashed var(--line);
    border-radius:var(--radius);
    padding:6px 8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
    margin-bottom:10px;
    background:var(--paper);
  }
  .wo-answer.dragover{background:var(--teal-bg);border-color:var(--teal);}
  .wo-row.correct .wo-answer{border-style:solid;border-color:var(--teal);background:var(--teal-bg);}
  .wo-row.wrong .wo-answer{border-style:solid;border-color:var(--red);background:var(--red-bg);}
  .wo-word{
    font-family:'Times New Roman',Times,serif;
    font-size:16.9px;
    background:var(--white);
    border:1px solid var(--line);
    padding:5px 11px;
    border-radius:20px;
    cursor:pointer;
    user-select:none;
  }
  .wo-row.disabled .wo-word{cursor:default;pointer-events:none;}
  .wo-pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .g-select{
    font-family:'Times New Roman',Times,serif;
    font-size:19.2px;
    padding:5px 8px;
    border:2px solid var(--line);
    border-radius:var(--radius);
    background:var(--white);
    color:var(--ink);
    font-weight:600;
  }
  .g-select.correct{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);}
  .g-select.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .g-answer{
    font-size:17.1px;
    color:var(--red);
    font-weight:600;
  }
  .g-footer{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'Times New Roman',Times,serif;
    font-weight:700;
    font-size:17.8px;
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:9px 18px;
    border-radius:20px;
    cursor:pointer;
  }
  .btn:hover{background:#1E1509;}
  .btn.secondary{background:none;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink-soft);}
  .g-score{
    font-size:17.8px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .g-score.good{color:var(--teal);}

  /* talking / discussion questions */
  .talk-list{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-bottom:8px;
  }
  .talk-q{
    display:flex;
    gap:12px;
    align-items:baseline;
    padding:12px 4px;
    border-bottom:1px dashed var(--line);
    font-size:19.8px;
  }
  .talk-q:last-child{border-bottom:none;}
  .talk-q .g-num{color:var(--gold);}
  .talk-q span.q-text{font-style:italic;color:var(--ink);}

  /* ---- samples (extra emails / negotiations) ---- */
  .sample-nav{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 6px;
  }
  .sample-chip{
    font-family:'Times New Roman',Times,serif;
    font-size:17.1px;
    font-weight:600;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 14px;
    cursor:pointer;
    transition:border-color .12s,background .12s;
  }
  .sample-chip b{color:var(--ink-soft);margin-right:4px;}
  .sample-chip:hover{border-color:var(--ink-soft);background:var(--paper-2);}
  .sample{
    margin-top:38px;
    padding-top:26px;
    border-top:2px solid var(--ink);
    scroll-margin-top:12px;
  }
  .sample:first-of-type{margin-top:26px;}
  .sample-title{
    font-size:clamp(25.1px,2.8vw,30.4px);
  }
  .sample-scenario{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:19.2px;
    font-style:italic;
  }

  /* choice (pick one of three) */
  .c-row{align-items:flex-start;}
  .c-wrap{flex:1;min-width:240px;}
  .c-q{font-size:19.5px;font-weight:600;margin-bottom:8px;}
  .c-opts{display:flex;flex-direction:column;gap:6px;}
  .c-opt{
    text-align:left;
    font-family:'Times New Roman',Times,serif;
    font-size:18.9px;
    color:var(--ink);
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 12px;
    cursor:pointer;
    transition:border-color .12s,background .12s;
  }
  .c-opt:hover{border-color:var(--ink-soft);}
  .c-opt.selected{
    border-color:var(--ink);
    background:var(--paper-2);
    box-shadow:inset 0 0 0 1px var(--ink);
  }
  .c-opt.correct{
    border-color:var(--teal);
    background:var(--teal-bg);
    color:var(--teal);
    font-weight:600;
  }
  .c-opt.wrong{
    border-color:var(--red);
    background:var(--red-bg);
    color:var(--red);
  }
  .c-row.locked .c-opt{cursor:default;}

  footer{
    text-align:center;
    padding:26px;
    font-size:16.6px;
    color:var(--ink-soft);
  }

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .tabs{
      position:static;
      flex-direction:row;
      overflow-x:auto;
      padding:14px clamp(16px,4vw,44px);
      gap:6px;
      background:var(--paper-2);
    }
    .tab-btn{
      white-space:nowrap;
      border-left:none;
      border-bottom:4px solid transparent;
      border-radius:var(--radius) var(--radius) 0 0;
    }
    .tab-btn[data-section="email"].active{border-bottom-color:var(--teal);}
    .tab-btn[data-section="phone"].active{border-bottom-color:var(--brick);}
    .tab-btn[data-section="negotiations"].active{border-bottom-color:var(--red);}
    .tab-btn[data-section="presentations"].active{border-bottom-color:var(--steel);}
    .tab-btn[data-section="grammar"].active{border-bottom-color:var(--plum);}
    .tab-btn[data-section="talking"].active{border-bottom-color:var(--gold);}
    .tab-btn[data-section="emailsamples"].active{border-bottom-color:var(--teal);}
    .tab-btn[data-section="negsamples"].active{border-bottom-color:var(--red);}
    .content{border-left:none;border-top:1px solid var(--line);}
    .match-grid{grid-template-columns:1fr;}
    .dialogue-line{flex-direction:column;gap:2px;}
    .dialogue-speaker{width:auto;}
  }

  /* ===== ШОКОЛАДНАЯ ЗАЛИВКА ===== */
  :root{
    --choc:#45301f;
    --choc-deep:#3e2216;
    --choc-light:#75482f;
    --choc-cream:#fbeedd;
  }
  .letterhead{background:var(--choc);border-bottom-color:var(--choc-deep);}
  .level-key span{border-color:#8a5c44;background:var(--choc-light);}
  .tab-btn.active{background:var(--choc);color:var(--choc-cream);}
  .tab-btn.active .lv{color:var(--choc-cream);opacity:.8;}
  .tab-btn:hover:not(.active){background:#eadccb;}
  .badge,.badge-b1,.badge-b2{background:var(--choc);color:var(--choc-cream);}
  .section-head{border-bottom-color:var(--choc);}
  .block-label{color:var(--choc);}
  .ex-head{background:#f3e6d8;}
  .ex-head:hover{background:#ecdac7;}
  .ex-num{background:var(--choc);color:var(--choc-cream);}
  .btn{background:var(--choc);color:var(--choc-cream);box-shadow:0 3px 0 var(--choc-deep);}
  .btn:hover{background:var(--choc-light);}
  .btn.secondary{background:var(--choc);color:var(--choc-cream);border:none;}
  .btn.secondary:hover{background:var(--choc-light);}
  .match-reset{background:var(--choc);color:var(--choc-cream);border:none;}
  .match-reset:hover{background:var(--choc-light);}
  .wb-chip{background:var(--choc);color:var(--choc-cream);border-color:var(--choc-deep);}
  .wb-chip:hover{background:var(--choc-light);}
  .wo-word{background:var(--choc);color:var(--choc-cream);border-color:var(--choc-deep);}
  .match-item.selected,.c-opt.selected{background:var(--choc);color:var(--choc-cream);border-color:var(--choc-deep);box-shadow:none;}
  .sample-chip{background:var(--choc);color:var(--choc-cream);border-color:var(--choc-deep);}
  .sample-chip b{color:#e3c9ac;}
  .sample-chip:hover{background:var(--choc-light);border-color:var(--choc-deep);}
  .sample{border-top-color:var(--choc);}
  .sample-title,.section-head h2{color:var(--choc);}
  .g-dropzone.selected{background:#eadccb;}
  /* ---------- MOBILE FIXES ---------- */
  .content{min-width:0;}
  .wb-chip.picked{outline:3px solid #e3a64a;outline-offset:2px;transform:translateY(-2px);}
  @media (max-width:820px){
    .match-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .match-item{font-size:17.1px;padding:8px 9px;line-height:1.3;}
    .wb-chip,.g-dropzone,.wo-word,.match-item{-webkit-tap-highlight-color:transparent;}
    .g-dropzone{min-height:1.9em;}
  }
  @media (hover:none){
    .wb-chip:hover{background:var(--choc);}
    .match-item:hover{border-color:var(--line);}
  }
  .g-select{max-width:100%;}
  /* ---------- PROGRESS ---------- */
  .progress-btn{
    font-family:inherit;font-size:18.5px;font-weight:700;cursor:pointer;
    background:var(--choc-cream,#fbeedd);color:var(--choc,#45301f);
    border:none;border-radius:20px;padding:7px 16px;display:inline-flex;align-items:center;gap:8px;
  }
  .progress-btn:hover{background:#fff;}
  .progress-btn{white-space:nowrap;}
  .level-key{flex-wrap:wrap;align-items:center;}
  @media (max-width:820px){ .level-key{width:100%;} .level-key span{display:none;} }
  .progress-btn b{background:var(--choc,#45301f);color:var(--choc-cream,#fbeedd);border-radius:12px;padding:1px 8px;font-size:16.6px;}
  .tab-progress{display:block;height:3px;background:rgba(90,52,34,.15);border-radius:2px;margin-top:6px;overflow:hidden;}
  .tab-progress i{display:block;height:100%;background:var(--teal);transition:width .3s;}
  .tab-btn.active .tab-progress{background:rgba(251,238,221,.25);}
  .tab-btn.active .tab-progress i{background:#b9d69a;}
  .ex-mark{font-size:15.9px;font-weight:700;white-space:nowrap;}
  .ex-mark.done{color:var(--teal);}
  .ex-mark.tried{color:var(--brick);}
  .exercise.ex-done .ex-num{background:var(--teal-bg);color:var(--teal);}
  .progress-modal{position:fixed;inset:0;background:rgba(45,31,19,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;overflow-y:auto;}
  .progress-modal.open{display:flex;}
  .progress-panel{background:var(--paper);max-width:620px;width:100%;border-radius:6px;border-top:5px solid var(--choc,#45301f);box-shadow:0 20px 50px -20px rgba(0,0,0,.5);}
  .progress-panel header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px;}
  .progress-panel h2{font-size:29.1px;}
  .pg-close{background:none;border:none;font-size:29.1px;cursor:pointer;color:var(--ink-soft);line-height:1;}
  #progressBody{padding:0 22px 8px;}
  .pg-overall{display:flex;align-items:center;gap:16px;padding:6px 0 16px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .pg-big{font-size:58.2px;font-weight:700;color:var(--choc,#45301f);line-height:1;}
  .pg-overall-text{color:var(--ink-soft);font-size:19.2px;}
  .pg-section{border-bottom:1px dashed var(--line);}
  .pg-section summary{display:grid;grid-template-columns:minmax(0,10.5em) 1fr auto;align-items:center;gap:12px;padding:11px 0;cursor:pointer;list-style:none;}
  .pg-section summary::-webkit-details-marker{display:none;}
  .pg-name{font-weight:600;}
  .pg-name::before{content:"▸ ";color:var(--ink-soft);font-size:14.5px;}
  .pg-section[open] .pg-name::before{content:"▾ ";}
  .pg-bar{display:flex;height:8px;background:var(--paper-2);border-radius:5px;overflow:hidden;}
  .pg-bar i{display:block;height:100%;}
  .pg-bar i.d{background:var(--teal);}
  .pg-bar i.t{background:#e0b07e;}
  .pg-count{font-size:17.1px;color:var(--ink-soft);white-space:nowrap;}
  .pg-section ul{list-style:none;margin:0 0 10px;padding:0;}
  .pg-section li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;font-family:inherit;font-size:18.5px;color:var(--ink);padding:6px 4px;cursor:pointer;border-radius:3px;}
  .pg-section li button:hover{background:var(--paper-2);}
  .pg-ico{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--line);}
  li.done .pg-ico{background:var(--teal);border-color:var(--teal);}
  li.tried .pg-ico{background:linear-gradient(90deg,#e0b07e 50%,transparent 50%);border-color:#e0b07e;}
  .pg-ex{flex:1;}
  .pg-st{font-size:15.9px;color:var(--ink-soft);white-space:nowrap;}
  li.done .pg-st{color:var(--teal);font-weight:700;}
  li.tried .pg-st{color:var(--brick);}
  .pg-note{font-size:16.6px;color:var(--ink-soft);font-style:italic;margin:12px 0 4px;}
  .progress-panel footer{padding:10px 22px 18px;display:flex;justify-content:flex-end;}
  @media (max-width:820px){
    .tab-progress{margin-top:4px;}
    .pg-section summary{grid-template-columns:1fr auto;}
    .pg-bar{grid-column:1 / -1;grid-row:2;}
  }

/* ================= HELPERS ================= */

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function normalize(s){
  return s.toLowerCase().replace(/[.!?,;:'"]/g,"").replace(/\s+/g," ").trim();
}

let lastFocusedInput = null;
let selectedZone = null;
let selectedChip = null;

/* ---- drag & drop word-bank helpers (shared by wordbank + grammar gap exercises) ---- */

function makeDragChip(word){
  const chip = document.createElement("span");
  chip.className = "wb-chip";
  chip.textContent = word;
  chip.draggable = true;
  chip.dataset.word = word;

  chip.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", word);
    e.dataTransfer.effectAllowed = "move";
    chip.classList.add("dragging");
  });
  chip.addEventListener("dragend", () => chip.classList.remove("dragging"));
  chip.addEventListener("click", () => {
    if(chip.classList.contains("used")) return;
    if(selectedZone && !selectedZone.classList.contains("disabled-zone") && document.contains(selectedZone)){
      fillDropZone(selectedZone, word, chip);
      return;
    }
    // Сначала слово, потом пропуск (удобно на телефоне)
    const already = chip.classList.contains("picked");
    document.querySelectorAll(".wb-chip.picked").forEach(c => c.classList.remove("picked"));
    selectedChip = already ? null : chip;
    if(!already) chip.classList.add("picked");
  });
  return chip;
}

function makeDropZone(){
  const zone = document.createElement("span");
  zone.className = "g-input g-dropzone";
  zone.tabIndex = 0;
  zone.dataset.value = "";

  zone.addEventListener("dragover", e => {
    e.preventDefault();
    if(!zone.classList.contains("disabled-zone")) zone.classList.add("dragover");
  });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("dragover");
    if(zone.classList.contains("disabled-zone")) return;
    const word = e.dataTransfer.getData("text/plain");
    if(!word) return;
    const draggingChip = document.querySelector(".wb-chip.dragging");
    fillDropZone(zone, word, draggingChip);
  });
  zone.addEventListener("click", () => {
    if(zone.classList.contains("disabled-zone")) return;
    if(selectedChip && !selectedChip.classList.contains("used") && document.contains(selectedChip)){
      fillDropZone(zone, selectedChip.dataset.word, selectedChip);
      return;
    }
    if(zone.dataset.value){
      clearDropZone(zone);
    } else {
      document.querySelectorAll(".g-dropzone.selected").forEach(z => z.classList.remove("selected"));
      zone.classList.add("selected");
      selectedZone = zone;
    }
  });
  return zone;
}

function fillDropZone(zone, word, chip){
  if(zone.dataset.value) clearDropZone(zone);
  zone.textContent = word;
  zone.dataset.value = word;
  zone.classList.remove("selected");
  zone.classList.add("filled");
  if(chip){
    chip.classList.add("used");
    chip.classList.remove("picked");
    zone._chip = chip;
  }
  if(selectedChip === chip) selectedChip = null;
  if(selectedZone === zone) selectedZone = null;
}

function clearDropZone(zone){
  if(zone._chip){
    zone._chip.classList.remove("used");
    zone._chip = null;
  }
  zone.textContent = "";
  zone.dataset.value = "";
  zone.classList.remove("filled","selected");
}

function resetDropZone(zone){
  clearDropZone(zone);
  zone.classList.remove("correct","wrong","disabled-zone");
}

/* ================= READING RENDER ================= */

function buildReading(parent, reading){
  const label = document.createElement("div");
  label.className = "block-label";
  label.textContent = reading.label || "Reading";
  parent.appendChild(label);

  const wrap = document.createElement("div");
  wrap.className = "reading-wrap";

  if(reading.type === "email"){
    reading.messages.forEach(m => {
      const card = document.createElement("div");
      card.className = "email-card";
      const meta = document.createElement("div");
      meta.className = "email-meta";
      meta.innerHTML = `<b>From:</b> ${m.from}<br><b>To:</b> ${m.to}<br><b>Subject:</b> ${m.subject}`;
      card.appendChild(meta);
      const body = document.createElement("div");
      body.className = "email-body";
      m.body.forEach(p => {
        const pEl = document.createElement("p");
        pEl.innerHTML = p;
        body.appendChild(pEl);
      });
      card.appendChild(body);
      wrap.appendChild(card);
    });
  } else if(reading.type === "dialogue"){
    const d = document.createElement("div");
    d.className = "dialogue-wrap";
    reading.lines.forEach(([speaker,text]) => {
      const line = document.createElement("div");
      line.className = "dialogue-line";
      const sp = document.createElement("span");
      sp.className = "dialogue-speaker";
      sp.textContent = speaker + ":";
      const tx = document.createElement("span");
      tx.className = "dialogue-text";
      tx.textContent = text;
      line.appendChild(sp);
      line.appendChild(tx);
      d.appendChild(line);
    });
    wrap.appendChild(d);
  } else if(reading.type === "transcript"){
    const t = document.createElement("div");
    t.className = "transcript-wrap";
    const tag = document.createElement("span");
    tag.className = "transcript-tag";
    tag.textContent = "Presenter";
    t.appendChild(tag);
    reading.paragraphs.forEach(p => {
      const pEl = document.createElement("p");
      pEl.textContent = p;
      t.appendChild(pEl);
    });
    wrap.appendChild(t);
  }

  parent.appendChild(wrap);
}

function buildWordbankExercise(parent, wb, opts){
  opts = opts || {};
  if(opts.label !== null){
    const label = document.createElement("div");
    label.className = "block-label";
    label.textContent = opts.label || "Vocabulary in context";
    parent.appendChild(label);
  }

  const ex = document.createElement("div");
  ex.className = "exercise" + (opts.open === false ? "" : " open");

  const head = document.createElement("div");
  head.className = "ex-head";
  head.innerHTML = `
    <span class="ex-title"><span class="ex-num">${opts.icon || "✎"}</span>${opts.title || "Complete the sentences from the text above"}</span>
    <span style="display:flex;align-items:center;gap:12px;">
      <span class="ex-status">${wb.items.length} blanks</span>
      <span class="ex-caret">▸</span>
    </span>`;
  ex.appendChild(head);

  const body = document.createElement("div");
  body.className = "ex-body";

  const instr = document.createElement("div");
  instr.className = "g-instructions";
  instr.textContent = "Drag each word from the bank into the correct blank (or tap a word, then tap a blank).";
  body.appendChild(instr);

  const bank = document.createElement("div");
  bank.className = "wb-bank";
  wb.words.forEach(w => bank.appendChild(makeDragChip(w)));
  body.appendChild(bank);

  const inputs = [];
  wb.items.forEach(([sentence, answer], i) => {
    const row = document.createElement("div");
    row.className = "g-row";
    const num = document.createElement("span");
    num.className = "g-num";
    num.textContent = (i+1)+".";
    row.appendChild(num);

    const parts = sentence.split("___");
    const sEl = document.createElement("span");
    sEl.className = "g-sentence";
    sEl.appendChild(document.createTextNode(parts[0]));
    const zone = makeDropZone();
    sEl.appendChild(zone);
    sEl.appendChild(document.createTextNode(parts[1] || ""));
    row.appendChild(sEl);
    inputs.push({el:zone, answer});
    body.appendChild(row);
  });

  const footer = document.createElement("div");
  footer.className = "g-footer";
  const checkBtn = document.createElement("button");
  checkBtn.className = "btn";
  checkBtn.type = "button";
  checkBtn.textContent = "Check answers";
  const scoreEl = document.createElement("span");
  scoreEl.className = "g-score";
  const retryBtn = document.createElement("button");
  retryBtn.className = "btn secondary";
  retryBtn.type = "button";
  retryBtn.textContent = "Try again";
  retryBtn.style.display = "none";

  checkBtn.addEventListener("click", () => {
    let correct = 0;
    inputs.forEach(inp => {
      const ok = normalize(inp.el.dataset.value || "") === normalize(inp.answer);
      inp.el.classList.remove("correct","wrong","selected");
      inp.el.classList.add(ok ? "correct" : "wrong");
      inp.el.classList.add("disabled-zone");
      if(ok) correct++;
      else {
        const hint = document.createElement("span");
        hint.className = "g-answer";
        hint.textContent = " → " + inp.answer;
        inp.el.insertAdjacentElement("afterend", hint);
      }
    });
    selectedZone = null;
    scoreEl.textContent = `Score: ${correct} / ${inputs.length}`;
    scoreEl.classList.toggle("good", correct === inputs.length);
    checkBtn.style.display = "none";
    retryBtn.style.display = "inline-block";
  });

  retryBtn.addEventListener("click", () => {
    inputs.forEach(inp => resetDropZone(inp.el));
    body.querySelectorAll(".g-answer").forEach(a => a.remove());
    scoreEl.textContent = "";
    checkBtn.style.display = "inline-block";
    retryBtn.style.display = "none";
  });

  footer.appendChild(checkBtn);
  footer.appendChild(retryBtn);
  footer.appendChild(scoreEl);
  body.appendChild(footer);

  ex.appendChild(body);
  head.addEventListener("click", () => ex.classList.toggle("open"));
  parent.appendChild(ex);
}

function buildWordOrderExercise(parent, wo){
  const ex = document.createElement("div");
  ex.className = "exercise open";

  const head = document.createElement("div");
  head.className = "ex-head";
  head.innerHTML = `
    <span class="ex-title"><span class="ex-num">★</span>Rebuild the sentences from the dialogue</span>
    <span style="display:flex;align-items:center;gap:12px;">
      <span class="ex-status">${wo.items.length} sentences</span>
      <span class="ex-caret">▸</span>
    </span>`;
  ex.appendChild(head);

  const body = document.createElement("div");
  body.className = "ex-body";

  const instr = document.createElement("div");
  instr.className = "g-instructions";
  instr.textContent = wo.instr + " Drag words into the box, or tap a word to add it. Tap a placed word to take it back out.";
  body.appendChild(instr);

  const rows = [];

  wo.items.forEach((sentence, i) => {
    const correctWords = sentence.split(" ");
    const shuffled = shuffle(correctWords);

    const row = document.createElement("div");
    row.className = "wo-row";
    const num = document.createElement("span");
    num.className = "g-num";
    num.textContent = (i+1)+".";
    row.appendChild(num);

    const col = document.createElement("div");
    col.className = "wo-col";

    const answer = document.createElement("div");
    answer.className = "wo-answer";
    const pool = document.createElement("div");
    pool.className = "wo-pool";

    function place(chip){
      if(row.classList.contains("disabled")) return;
      chip.classList.add("used");
      const span = document.createElement("span");
      span.className = "wo-word";
      span.textContent = chip.textContent;
      span.addEventListener("click", () => {
        if(row.classList.contains("disabled")) return;
        span.remove();
        chip.classList.remove("used");
      });
      answer.appendChild(span);
    }

    shuffled.forEach(word => {
      const chip = document.createElement("span");
      chip.className = "wb-chip";
      chip.textContent = word;
      chip.draggable = true;
      chip.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", word);
        e.dataTransfer.effectAllowed = "move";
        chip.classList.add("dragging");
      });
      chip.addEventListener("dragend", () => chip.classList.remove("dragging"));
      chip.addEventListener("click", () => {
        if(chip.classList.contains("used") || row.classList.contains("disabled")) return;
        place(chip);
      });
      pool.appendChild(chip);
    });

    answer.addEventListener("dragover", e => {
      e.preventDefault();
      if(!row.classList.contains("disabled")) answer.classList.add("dragover");
    });
    answer.addEventListener("dragleave", () => answer.classList.remove("dragover"));
    answer.addEventListener("drop", e => {
      e.preventDefault();
      answer.classList.remove("dragover");
      if(row.classList.contains("disabled")) return;
      const draggingChip = pool.querySelector(".wb-chip.dragging");
      if(draggingChip && !draggingChip.classList.contains("used")) place(draggingChip);
    });

    col.appendChild(answer);
    col.appendChild(pool);
    row.appendChild(col);
    body.appendChild(row);

    rows.push({row, answer, correctWords});
  });

  const footer = document.createElement("div");
  footer.className = "g-footer";
  const checkBtn = document.createElement("button");
  checkBtn.className = "btn";
  checkBtn.type = "button";
  checkBtn.textContent = "Check answers";
  const scoreEl = document.createElement("span");
  scoreEl.className = "g-score";
  const retryBtn = document.createElement("button");
  retryBtn.className = "btn secondary";
  retryBtn.type = "button";
  retryBtn.textContent = "Try again";
  retryBtn.style.display = "none";

  checkBtn.addEventListener("click", () => {
    let correct = 0;
    rows.forEach(r => {
      const given = Array.from(r.answer.children).map(s => s.textContent);
      const ok = given.length === r.correctWords.length && given.every((w,i) => w === r.correctWords[i]);
      r.row.classList.remove("correct","wrong");
      r.row.classList.add(ok ? "correct" : "wrong");
      r.row.classList.add("disabled");
      if(ok) correct++;
      else {
        const hint = document.createElement("div");
        hint.className = "g-answer";
        hint.textContent = "→ " + r.correctWords.join(" ");
        r.answer.insertAdjacentElement("afterend", hint);
      }
    });
    scoreEl.textContent = `Score: ${correct} / ${rows.length}`;
    scoreEl.classList.toggle("good", correct === rows.length);
    checkBtn.style.display = "none";
    retryBtn.style.display = "inline-block";
  });

  retryBtn.addEventListener("click", () => {
    rows.forEach(r => {
      r.row.classList.remove("correct","wrong","disabled");
      r.answer.innerHTML = "";
      r.row.querySelectorAll(".wb-chip").forEach(c => c.classList.remove("used"));
    });
    body.querySelectorAll(".g-answer").forEach(a => a.remove());
    scoreEl.textContent = "";
    checkBtn.style.display = "inline-block";
    retryBtn.style.display = "none";
  });

  footer.appendChild(checkBtn);
  footer.appendChild(retryBtn);
  footer.appendChild(scoreEl);
  body.appendChild(footer);

  ex.appendChild(body);
  head.addEventListener("click", () => ex.classList.toggle("open"));
  parent.appendChild(ex);
}

function buildMatchExercise(parent, set, idx){
  const ex = document.createElement("div");
  ex.className = "exercise";

  const numLabel = (typeof idx === "number") ? (idx+1) : "★";

  const head = document.createElement("div");
  head.className = "ex-head";
  head.innerHTML = `
    <span class="ex-title"><span class="ex-num">${numLabel}</span>${set.title}</span>
    <span style="display:flex;align-items:center;gap:12px;">
      <span class="ex-status">0 / ${set.pairs.length} matched</span>
      <span class="ex-caret">▸</span>
    </span>`;
  ex.appendChild(head);

  const body = document.createElement("div");
  body.className = "ex-body";

  const grid = document.createElement("div");
  grid.className = "match-grid";
  const leftCol = document.createElement("div");
  const rightCol = document.createElement("div");
  leftCol.style.display = "flex"; leftCol.style.flexDirection="column"; leftCol.style.gap="10px";
  rightCol.style.display = "flex"; rightCol.style.flexDirection="column"; rightCol.style.gap="10px";

  const terms = set.pairs.map((p,i)=>({text:p[0], id:i}));
  const defs = set.pairs.map((p,i)=>({text:p[1], id:i}));
  const leftShuffled = shuffle(terms);
  const rightShuffled = shuffle(defs);

  let matchedCount = 0;
  let selectedLeft = null;
  const statusEl = head.querySelector(".ex-status");

  function makeBtn(item, side){
    const btn = document.createElement("button");
    btn.className = "match-item";
    btn.type = "button";
    btn.textContent = item.text;
    btn.dataset.id = item.id;
    btn.dataset.side = side;
    btn.addEventListener("click", () => onPick(btn));
    return btn;
  }

  leftShuffled.forEach(t => leftCol.appendChild(makeBtn(t,"left")));
  rightShuffled.forEach(d => rightCol.appendChild(makeBtn(d,"right")));

  function onPick(btn){
    if(btn.classList.contains("correct") || btn.classList.contains("disabled")) return;
    if(btn.dataset.side === "left"){
      if(selectedLeft) selectedLeft.classList.remove("selected");
      selectedLeft = btn;
      btn.classList.add("selected");
      return;
    }
    if(!selectedLeft) return;
    if(selectedLeft.dataset.id === btn.dataset.id){
      selectedLeft.classList.remove("selected");
      selectedLeft.classList.add("correct");
      btn.classList.add("correct");
      selectedLeft = null;
      matchedCount++;
      statusEl.textContent = `${matchedCount} / ${set.pairs.length} matched`;
      if(matchedCount === set.pairs.length){
        statusEl.textContent = "Complete ✓";
        statusEl.style.color = "var(--teal)";
      }
    } else {
      btn.classList.add("wrong");
      selectedLeft.classList.add("wrong");
      setTimeout(()=>{
        btn.classList.remove("wrong");
        selectedLeft.classList.remove("wrong","selected");
        selectedLeft = null;
      },320);
    }
  }

  grid.appendChild(leftCol);
  grid.appendChild(rightCol);
  body.appendChild(grid);

  const resetBtn = document.createElement("button");
  resetBtn.className = "match-reset";
  resetBtn.type = "button";
  resetBtn.textContent = "Reset exercise";
  resetBtn.addEventListener("click", () => {
    matchedCount = 0;
    selectedLeft = null;
    statusEl.style.color = "";
    statusEl.textContent = `0 / ${set.pairs.length} matched`;
    [...leftCol.children, ...rightCol.children].forEach(b => {
      b.classList.remove("correct","selected","wrong","disabled");
    });
  });
  body.appendChild(resetBtn);

  ex.appendChild(body);
  head.addEventListener("click", () => ex.classList.toggle("open"));
  parent.appendChild(ex);
}

function buildGrammarExercise(parent, g, idx){
  const ex = document.createElement("div");
  ex.className = "exercise";

  const head = document.createElement("div");
  head.className = "ex-head";
  head.innerHTML = `
    <span class="ex-title"><span class="ex-num">${idx+1}</span>${g.title}</span>
    <span style="display:flex;align-items:center;gap:12px;">
      <span class="ex-status">${g.items.length} questions</span>
      <span class="ex-caret">▸</span>
    </span>`;
  ex.appendChild(head);

  const body = document.createElement("div");
  body.className = "ex-body";

  const instr = document.createElement("div");
  instr.className = "g-instructions";
  instr.textContent = g.type === "gap"
    ? g.instr + " Drag the correct word/phrase from the bank into each blank (or tap a chip, then tap a blank)."
    : g.instr;
  body.appendChild(instr);

  if(g.type === "gap"){
    const bank = document.createElement("div");
    bank.className = "wb-bank";
    const bankWords = shuffle(g.items.map(([,answers]) => answers[0]));
    bankWords.forEach(w => bank.appendChild(makeDragChip(w)));
    body.appendChild(bank);
  }

  const inputs = [];

  g.items.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "g-row";
    const num = document.createElement("span");
    num.className = "g-num";
    num.textContent = (i+1)+".";
    row.appendChild(num);

    if(g.type === "gap"){
      const [sentence, answers] = item;
      const parts = sentence.split("___");
      const sEl = document.createElement("span");
      sEl.className = "g-sentence";
      sEl.appendChild(document.createTextNode(parts[0]));
      const zone = makeDropZone();
      sEl.appendChild(zone);
      sEl.appendChild(document.createTextNode(parts[1] || ""));
      row.appendChild(sEl);
      inputs.push({type:"gap", el:zone, answers});
    } else {
      const [sentence, options, correctIdx] = item;
      const sEl = document.createElement("span");
      sEl.className = "g-sentence";
      sEl.style.display="block";
      sEl.textContent = sentence;
      row.appendChild(sEl);
      const select = document.createElement("select");
      select.className = "g-select";
      const placeholder = document.createElement("option");
      placeholder.textContent = "Choose the correct version...";
      placeholder.value = "";
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);
      options.forEach((opt,oi) => {
        const o = document.createElement("option");
        o.textContent = opt;
        o.value = oi;
        select.appendChild(o);
      });
      row.style.flexDirection = "column";
      row.style.alignItems = "stretch";
      const selWrap = document.createElement("div");
      selWrap.style.marginTop = "6px";
      selWrap.style.marginLeft = "26px";
      selWrap.appendChild(select);
      row.appendChild(selWrap);
      inputs.push({type:"choice", el:select, correctIdx});
    }
    body.appendChild(row);
  });

  const footer = document.createElement("div");
  footer.className = "g-footer";
  const checkBtn = document.createElement("button");
  checkBtn.className = "btn";
  checkBtn.type = "button";
  checkBtn.textContent = "Check answers";
  const scoreEl = document.createElement("span");
  scoreEl.className = "g-score";
  const retryBtn = document.createElement("button");
  retryBtn.className = "btn secondary";
  retryBtn.type = "button";
  retryBtn.textContent = "Try again";
  retryBtn.style.display = "none";

  checkBtn.addEventListener("click", () => {
    let correct = 0;
    inputs.forEach(inp => {
      if(inp.type === "gap"){
        const val = normalize(inp.el.dataset.value || "");
        const ok = val !== "" && inp.answers.some(a => normalize(a) === val);
        inp.el.classList.remove("correct","wrong","selected");
        inp.el.classList.add(ok ? "correct" : "wrong");
        inp.el.classList.add("disabled-zone");
        if(ok) correct++;
        else {
          const hint = document.createElement("span");
          hint.className = "g-answer";
          hint.textContent = " → " + inp.answers[0];
          inp.el.insertAdjacentElement("afterend", hint);
        }
      } else {
        const val = inp.el.value;
        const ok = val !== "" && parseInt(val,10) === inp.correctIdx;
        inp.el.classList.remove("correct","wrong");
        inp.el.classList.add(ok ? "correct" : "wrong");
        inp.el.disabled = true;
        if(ok) correct++;
      }
    });
    selectedZone = null;
    scoreEl.textContent = `Score: ${correct} / ${inputs.length}`;
    scoreEl.classList.toggle("good", correct === inputs.length);
    checkBtn.style.display = "none";
    retryBtn.style.display = "inline-block";
  });

  retryBtn.addEventListener("click", () => {
    inputs.forEach(inp => {
      if(inp.type === "gap"){
        resetDropZone(inp.el);
      } else {
        inp.el.disabled = false;
        inp.el.classList.remove("correct","wrong");
        inp.el.value = "";
      }
    });
    body.querySelectorAll(".g-answer").forEach(a => a.remove());
    scoreEl.textContent = "";
    checkBtn.style.display = "inline-block";
    retryBtn.style.display = "none";
  });

  footer.appendChild(checkBtn);
  footer.appendChild(retryBtn);
  footer.appendChild(scoreEl);
  body.appendChild(footer);

  ex.appendChild(body);
  head.addEventListener("click", () => ex.classList.toggle("open"));
  parent.appendChild(ex);
}

/* ================= CHOICE (pick 1 of 3) EXERCISE ================= */

function buildChoiceExercise(parent, cfg){
  const ex = document.createElement("div");
  ex.className = "exercise" + (cfg.open ? " open" : "");

  const head = document.createElement("div");
  head.className = "ex-head";
  head.innerHTML = `
    <span class="ex-title"><span class="ex-num">${cfg.icon}</span>${cfg.title}</span>
    <span style="display:flex;align-items:center;gap:12px;">
      <span class="ex-status">${cfg.items.length} questions</span>
      <span class="ex-caret">▸</span>
    </span>`;
  ex.appendChild(head);

  const body = document.createElement("div");
  body.className = "ex-body";

  const instr = document.createElement("div");
  instr.className = "g-instructions";
  instr.textContent = cfg.instr + " Choose one of the three options for each question, then press Check answers.";
  body.appendChild(instr);

  const rows = [];
  cfg.items.forEach(([q, options, correctIdx], i) => {
    const row = document.createElement("div");
    row.className = "g-row c-row";
    const num = document.createElement("span");
    num.className = "g-num";
    num.textContent = (i+1)+".";
    row.appendChild(num);

    const wrap = document.createElement("div");
    wrap.className = "c-wrap";
    const qEl = document.createElement("div");
    qEl.className = "c-q";
    qEl.textContent = q;
    wrap.appendChild(qEl);

    const optsEl = document.createElement("div");
    optsEl.className = "c-opts";
    const order = shuffle(options.map((t,k) => ({t, ok: k === correctIdx})));
    const state = {row, btns:[], chosen:null};
    order.forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "c-opt";
      b.textContent = o.t;
      b.dataset.ok = o.ok ? "1" : "0";
      b.addEventListener("click", () => {
        if(row.classList.contains("locked")) return;
        state.btns.forEach(x => x.classList.remove("selected"));
        b.classList.add("selected");
        state.chosen = b;
      });
      state.btns.push(b);
      optsEl.appendChild(b);
    });
    wrap.appendChild(optsEl);
    row.appendChild(wrap);
    body.appendChild(row);
    rows.push(state);
  });

  const footer = document.createElement("div");
  footer.className = "g-footer";
  const checkBtn = document.createElement("button");
  checkBtn.className = "btn";
  checkBtn.type = "button";
  checkBtn.textContent = "Check answers";
  const scoreEl = document.createElement("span");
  scoreEl.className = "g-score";
  const retryBtn = document.createElement("button");
  retryBtn.className = "btn secondary";
  retryBtn.type = "button";
  retryBtn.textContent = "Try again";
  retryBtn.style.display = "none";

  checkBtn.addEventListener("click", () => {
    let correct = 0;
    rows.forEach(s => {
      s.row.classList.add("locked");
      const ok = s.chosen && s.chosen.dataset.ok === "1";
      if(ok) correct++;
      s.btns.forEach(b => {
        b.classList.remove("selected");
        if(b.dataset.ok === "1") b.classList.add("correct");
      });
      if(s.chosen && !ok) s.chosen.classList.add("wrong");
    });
    scoreEl.textContent = `Score: ${correct} / ${rows.length}`;
    scoreEl.classList.toggle("good", correct === rows.length);
    checkBtn.style.display = "none";
    retryBtn.style.display = "inline-block";
  });

  retryBtn.addEventListener("click", () => {
    rows.forEach(s => {
      s.row.classList.remove("locked");
      s.chosen = null;
      s.btns.forEach(b => b.classList.remove("selected","correct","wrong"));
    });
    scoreEl.textContent = "";
    checkBtn.style.display = "inline-block";
    retryBtn.style.display = "none";
  });

  footer.appendChild(checkBtn);
  footer.appendChild(retryBtn);
  footer.appendChild(scoreEl);
  body.appendChild(footer);

  ex.appendChild(body);
  head.addEventListener("click", () => ex.classList.toggle("open"));
  parent.appendChild(ex);
}

function buildSamplesSection(key, data){
  const wrap = document.createElement("div");
  wrap.className = "section";
  wrap.id = "sec-"+key;

  const head = document.createElement("div");
  head.className = "section-head";
  head.innerHTML = `<h2>${data.title}</h2><span class="badge badge-b1">B1–B2 · Examples</span>`;
  wrap.appendChild(head);

  const intro = document.createElement("p");
  intro.className = "section-intro";
  intro.textContent = data.intro;
  wrap.appendChild(intro);
  { const f=document.createElement("figure"); f.className="unit-art"; f.innerHTML=bizArtFor((typeof key!=="undefined"?key:"")+" "+(data.title||"")); wrap.appendChild(f); }

  const nav = document.createElement("div");
  nav.className = "sample-nav";
  wrap.appendChild(nav);

  data.examples.forEach((exm, i) => {
    const box = document.createElement("div");
    box.className = "sample";

    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "sample-chip";
    chip.innerHTML = `<b>${i+1}</b> ${exm.title}`;
    chip.addEventListener("click", () => box.scrollIntoView({behavior:"smooth", block:"start"}));
    nav.appendChild(chip);

    const title = document.createElement("h3");
    title.className = "sample-title";
    title.textContent = `Example ${i+1} — ${exm.title}`;
    box.appendChild(title);

    const sc = document.createElement("p");
    sc.className = "sample-scenario";
    sc.textContent = exm.scenario;
    box.appendChild(sc);

    buildReading(box, exm.reading);

    const exLabel = document.createElement("div");
    exLabel.className = "block-label";
    exLabel.textContent = "Exercises";
    box.appendChild(exLabel);

    buildChoiceExercise(box, {icon:"1", title:"Check your understanding", instr:"Read the text again if you need to.", items:exm.comprehension, open:true});
    buildWordbankExercise(box, {words:shuffle(exm.wordbank.words), items:exm.wordbank.items}, {label:null, open:false, icon:"2", title:"Vocabulary in context"});
    buildChoiceExercise(box, {icon:"3", title:exm.language.title, instr:exm.language.instr, items:exm.language.items, open:false});

    wrap.appendChild(box);
  });

  return wrap;
}

const TALKING = [
  { topic:"Business", questions:[
    "What does your company do, and what makes it different from its competitors?",
    "How has your industry changed over the last five years?",
    "What's the biggest challenge your business is facing right now?",
    "Do you think remote work has been good or bad for productivity?",
    "If you started your own company, what would it do?",
  ]},
  { topic:"Partners", questions:[
    "What qualities do you look for in a good business partner?",
    "Have you ever worked with a partner from a different culture? What was it like?",
    "How do you build trust with a new business partner?",
    "What would you do if a partner missed an important deadline?",
    "Is it better to have one long-term partner or several smaller ones? Why?",
  ]},
  { topic:"Selling", questions:[
    "What's the most important skill a good salesperson needs?",
    "How do you handle a customer who says your price is too high?",
    "Do you prefer selling face-to-face or online? Why?",
    "What's the best sales pitch you've ever heard, and why did it work?",
    "How do you deal with rejection in sales?",
  ]},
];

function buildTalkingSection(){
  const wrap = document.createElement("div");
  wrap.className = "section";
  wrap.id = "sec-talking";

  const head = document.createElement("div");
  head.className = "section-head";
  head.innerHTML = `<h2>Talking</h2><span class="badge badge-b1">B1–B2 · Discussion</span>`;
  wrap.appendChild(head);

  const intro = document.createElement("p");
  intro.className = "section-intro";
  intro.textContent = "15 questions for speaking practice — no right or wrong answers. Use them for conversation practice, one-to-one lessons, or as warm-up discussion topics.";
  wrap.appendChild(intro);

  let counter = 0;
  TALKING.forEach(group => {
    const label = document.createElement("div");
    label.className = "block-label";
    label.textContent = group.topic;
    wrap.appendChild(label);

    const list = document.createElement("div");
    list.className = "talk-list";
    group.questions.forEach(q => {
      counter++;
      const row = document.createElement("div");
      row.className = "talk-q";
      const num = document.createElement("span");
      num.className = "g-num";
      num.textContent = counter + ".";
      const text = document.createElement("span");
      text.className = "q-text";
      text.textContent = q;
      row.appendChild(num);
      row.appendChild(text);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  });

  return wrap;
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("sec-"+btn.dataset.section).classList.add("active");
    window.scrollTo({top:0, behavior:"smooth"});
  });

document.querySelector("#sec-email .exercise")?.classList.add("open");

/* ================= PROGRESS ================= */
const PROGRESS_KEY = "btkProgress";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}") || {}; } catch(e){ progress = {}; }
function saveProgress(){ try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch(e){} }

const progressIndex = []; // {id, sectionKey, sectionName, title, ex}
function sectionName(key){
  const b = document.querySelector(`.tab-btn[data-section="${key}"]`);
  return b ? b.childNodes[0].textContent.trim() : key;
}
function exTitle(ex){
  const t = ex.querySelector(".ex-title");
  if(!t) return "Exercise";
  const clone = t.cloneNode(true);
  clone.querySelectorAll(".ex-num").forEach(n => n.remove());
  let title = clone.textContent.trim();
  const sample = ex.closest(".sample");
  if(sample){
    const st = sample.querySelector(".sample-title");
    if(st) title = st.textContent.replace(/^Example\s+/, "Ex. ") + " — " + title;
  }
  return title;
}
function indexExercises(){
  document.querySelectorAll(".section").forEach(sec => {
    const key = sec.id.replace(/^sec-/, "");
    sec.querySelectorAll(".exercise").forEach((ex, i) => {
      const id = key + "#" + i;
      ex.dataset.progressId = id;
      const head = ex.querySelector(".ex-head");
      if(head && !head.querySelector(".ex-mark")){
        const mark = document.createElement("span");
        mark.className = "ex-mark";
        const right = head.lastElementChild;
        if(right && right !== head.firstElementChild) right.insertBefore(mark, right.firstChild);
        else head.appendChild(mark);
      }
      progressIndex.push({ id, sectionKey:key, sectionName:sectionName(key), title:exTitle(ex), ex });
    });
  });
}
function readExerciseResult(ex){
  const status = ex.querySelector(".ex-head .ex-status");
  if(status && /Complete/.test(status.textContent)) return { score:1, total:1 };
  const m = status && status.textContent.match(/^(\d+)\s*\/\s*(\d+)\s*matched/);
  if(m && +m[1] > 0) return { score:+m[1], total:+m[2], partial:true };
  const sc = ex.querySelector(".g-score");
  const g = sc && sc.textContent.match(/(\d+)\s*\/\s*(\d+)/);
  if(g) return { score:+g[1], total:+g[2] };
  return null;
}
function updateExerciseMark(item){
  const p = progress[item.id];
  const mark = item.ex.querySelector(".ex-mark");
  item.ex.classList.toggle("ex-done", !!(p && p.done));
  if(!mark) return;
  if(!p){ mark.textContent = ""; mark.className = "ex-mark"; return; }
  if(p.done){ mark.textContent = "✓ done"; mark.className = "ex-mark done"; }
  else { mark.textContent = `best ${p.best}/${p.total}`; mark.className = "ex-mark tried"; }
}
let progressScanTimer = null;
function scanProgress(){
  let changed = false;
  progressIndex.forEach(item => {
    const r = readExerciseResult(item.ex);
    if(!r) return;
    const prev = progress[item.id] || { best:0, total:r.total, done:false };
    const done = r.score === r.total;
    if(r.partial && !prev.best && !done){
      if(!progress[item.id]){ progress[item.id] = { best:r.score, total:r.total, done:false, at:Date.now() }; changed = true; }
      else if(r.score > prev.best){ prev.best = r.score; prev.total = r.total; changed = true; }
    } else if(!progress[item.id] || r.score > prev.best || r.total !== prev.total || (done && !prev.done)){
      progress[item.id] = { best:Math.max(r.total === prev.total ? prev.best : 0, r.score), total:r.total, done:prev.done || done, at:Date.now() };
      changed = true;
    }
  });
  if(changed){ saveProgress(); renderProgressEverywhere(); }
}
function sectionStats(key){
  const items = progressIndex.filter(i => i.sectionKey === key);
  const done = items.filter(i => progress[i.id] && progress[i.id].done).length;
  const tried = items.filter(i => progress[i.id] && !progress[i.id].done).length;
  return { total:items.length, done, tried };
}
function overallStats(){
  const total = progressIndex.length;
  const done = progressIndex.filter(i => progress[i.id] && progress[i.id].done).length;
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}
function renderProgressEverywhere(){
  progressIndex.forEach(updateExerciseMark);
  document.querySelectorAll(".tab-btn").forEach(btn => {
    const st = sectionStats(btn.dataset.section);
    let bar = btn.querySelector(".tab-progress");
    if(!st.total){ if(bar) bar.remove(); return; }
    if(!bar){ bar = document.createElement("span"); bar.className = "tab-progress"; bar.innerHTML = "<i></i>"; btn.appendChild(bar); }
    bar.querySelector("i").style.width = (st.done / st.total * 100) + "%";
    bar.title = `${st.done} of ${st.total} exercises done`;
  });
  const o = overallStats();
  const pctEl = document.getElementById("progressPct");
  if(pctEl) pctEl.textContent = o.pct + "%";
  if(document.getElementById("progressModal").classList.contains("open")) renderProgressPanel();
}
function renderProgressPanel(){
  const o = overallStats();
  const keys = [...document.querySelectorAll(".tab-btn")].map(b => b.dataset.section).filter(k => sectionStats(k).total);
  const body = document.getElementById("progressBody");
  body.innerHTML = `
    <div class="pg-overall">
      <div class="pg-big">${o.pct}%</div>
      <div class="pg-overall-text">${o.done} of ${o.total} exercises completed with a perfect score</div>
    </div>
    ${keys.map(k => {
      const st = sectionStats(k);
      const items = progressIndex.filter(i => i.sectionKey === k);
      const w1 = st.done / st.total * 100, w2 = st.tried / st.total * 100;
      return `<details class="pg-section">
        <summary>
          <span class="pg-name">${sectionName(k)}</span>
          <span class="pg-bar"><i class="d" style="width:${w1}%"></i><i class="t" style="width:${w2}%"></i></span>
          <span class="pg-count">${st.done} / ${st.total}</span>
        </summary>
        <ul>${items.map(i => {
          const p = progress[i.id];
          const cls = p ? (p.done ? "done" : "tried") : "todo";
          const label = p ? (p.done ? "done" : `best ${p.best}/${p.total}`) : "not started";
          return `<li class="${cls}"><button type="button" data-goto="${i.id}"><span class="pg-ico"></span><span class="pg-ex">${i.title}</span><span class="pg-st">${label}</span></button></li>`;
        }).join("")}</ul>
      </details>`;
    }).join("")}
    <p class="pg-note">An exercise counts as done when every answer is correct. If you score less, your best result is saved — try again any time. Progress is saved in this browser.</p>`;
  body.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => gotoExercise(b.dataset.goto)));
}
function gotoExercise(id){
  const item = progressIndex.find(i => i.id === id);
  if(!item) return;
  closeProgress();
  const tab = document.querySelector(`.tab-btn[data-section="${item.sectionKey}"]`);
  if(tab && !tab.classList.contains("active")) tab.click();
  item.ex.classList.add("open");
  setTimeout(() => item.ex.scrollIntoView({ behavior:"smooth", block:"start" }), 80);
}
function openProgress(){
  document.getElementById("progressModal").classList.add("open");
  renderProgressPanel();
  document.getElementById("progressClose").focus();
}
function closeProgress(){ document.getElementById("progressModal").classList.remove("open"); }

indexExercises();
renderProgressEverywhere();
new MutationObserver(() => {
  clearTimeout(progressScanTimer);
  progressScanTimer = setTimeout(scanProgress, 60);
}).observe(content, { subtree:true, childList:true, characterData:true });
document.getElementById("progressBtn").addEventListener("click", openProgress);
document.getElementById("progressClose").addEventListener("click", closeProgress);
document.getElementById("progressModal").addEventListener("click", e => { if(e.target.id === "progressModal") closeProgress(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeProgress(); });
document.getElementById("progressReset").addEventListener("click", () => {
  if(!confirm("Reset all saved progress?")) return;
  progress = {}; saveProgress(); renderProgressEverywhere();
});

</script>
