<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids Grammar 1–6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f0e8; --elev:#fbf8f3; --soft:#f5ede4; --text:#3d2b1a; --muted:#7a644f;
  --border:#d4c0b0; --accent:#a67c6b; --accent-soft:#f5ede4;
  --success:#7c9a6e; --success-soft:#eef1e4;
  --warn:#f5a623; --warn-soft:#fdf1dc;
  --purple:#7a5a4a; --purple-soft:#f0e4d8;
  --error:#c1584e; --error-soft:#f9e4e0;
  --choco:#5a3220; --choco-2:#7b4a2e; --choco-soft:#ecdccd; --on-choco:#f7e9da;
  --sh-sm:0 1px 3px rgba(90,63,40,.08); --sh-md:0 8px 30px rgba(166,124,107,.1);
  --sh-lg:0 14px 36px rgba(90,63,40,.16); --r:14px; --r-sm:10px;
}
[data-theme="dark"]{
  --bg:#20150d; --elev:#2b1d12; --soft:#3a2818; --text:#f3e6d6; --muted:#cbae94;
  --border:#4a3624; --accent:#c99b7f; --accent-soft:#3a2818;
  --success:#9ab08a; --success-soft:#2a3324;
  --warn:#f0b768; --warn-soft:#3d2f13;
  --purple:#b08f74; --purple-soft:#3a2b1c;
  --error:#d98d81; --error-soft:#3a2320;
  --choco:#c58a63; --choco-2:#8a5233; --choco-soft:#4a2f1d; --on-choco:#f7e9da;
  --sh-sm:0 1px 3px rgba(0,0,0,.3); --sh-md:0 4px 14px rgba(0,0,0,.4); --sh-lg:0 14px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Times New Roman',Times,'Liberation Serif',serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#3f2214,#6b3d25);color:var(--on-choco);border-bottom:2px solid #2d180d;box-shadow:0 4px 16px rgba(60,30,15,.35)}
[data-theme="dark"] .topbar{background:linear-gradient(135deg,#1c0f08,#4a2a18);border-bottom-color:#0f0804}
.tb-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21.2px;letter-spacing:-.02em}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#d9a684,#a0684a);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18.5px;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo small{display:block;font-size:14.5px;font-weight:500;color:#dcc3ab}
.sp{flex:1}
.pw{display:flex;align-items:center;gap:9px;font-size:16.6px;color:#e6d0ba;font-weight:500}
.pbar{width:150px;height:7px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#e8c39f,#c58a63);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--on-choco);cursor:pointer;display:grid;place-items:center;font-size:19.8px;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px);box-shadow:var(--sh-sm)}

.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:30px;padding:26px 22px 80px}
.sidebar{position:sticky;top:138px;align-self:start;max-height:calc(100vh - 162px);overflow-y:auto;padding-right:4px}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.sidebar h3{font-size:14.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:10px;padding-left:12px}
.nav-list{display:none;flex-direction:column;gap:3px}
.nav-list.active{display:flex}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:17.8px;color:var(--muted);font-weight:500;border:1px solid transparent;transition:.18s;text-align:left;background:none;font-family:inherit;width:100%}
.nav-item:hover{background:var(--elev);color:var(--text);border-color:var(--border)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.nav-num{width:22px;height:22px;border-radius:6px;background:var(--soft);color:var(--muted);display:grid;place-items:center;font-size:14.5px;font-weight:700;flex-shrink:0;transition:.18s}
.nav-item.active .nav-num{background:var(--choco);color:#fff}
[data-theme="dark"] .nav-item.active .nav-num{color:#20150d}

.content{min-width:0}
.topic{display:none;animation:fadeUp .4s cubic-bezier(.4,0,.2,1)}
.topic.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.topic-header{margin-bottom:20px;padding-bottom:18px;border-bottom:2px solid var(--choco)}
.topic-tag{display:inline-block;font-size:14.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--on-choco);background:linear-gradient(135deg,var(--choco-2),var(--choco));padding:4px 12px;border-radius:99px;margin-bottom:10px}
[data-theme="dark"] .topic-tag{color:#20150d;background:linear-gradient(135deg,#d9a684,var(--choco))}
.topic-header h2{font-family:'Times New Roman',Times,'Liberation Serif',serif;font-size:clamp(31.7px,3.9vw,45px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.topic-header p{color:var(--muted);font-size:19.2px;margin-top:6px}

.rule{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--purple-soft) 60%,var(--accent-soft)));border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:var(--r);padding:16px 20px;margin-bottom:24px;font-size:19.2px;position:relative;overflow:hidden}
.rule::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--choco-2),var(--choco))}
.rule b{color:var(--choco);font-weight:700}
.rule i{color:var(--muted);font-style:italic}
.rule-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.2px;text-transform:uppercase;letter-spacing:.08em;color:var(--choco);margin-bottom:7px}

.ex{background:var(--elev);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:var(--sh-sm);transition:.25s;position:relative;overflow:hidden}
.ex:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.ex::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--accent))}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ex-num{font-weight:700;font-size:15.9px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.ex-type{font-size:13.2px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tb,var(--accent-soft));color:var(--tc,var(--accent))}
.ex p{font-size:19.8px;margin:7px 0}
.ex .task{font-size:17.8px;color:var(--muted);font-style:italic;margin-top:3px}

.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opts li{padding:8px 13px;border-radius:var(--r-sm);background:var(--soft);border:1px solid transparent;font-size:18.5px;transition:.18s}
.opts li:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}

.words{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.word{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:17.8px;font-weight:500;transition:.18s}
.word:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.match-table{width:100%;border-collapse:collapse;margin-top:9px;font-size:18.5px}
.match-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.match-table tr:last-child td{border-bottom:none}
.match-table td:first-child{width:50%;font-weight:500}
.match-table td:last-child{color:var(--muted)}
.tf{font-weight:600;padding:9px 13px;background:var(--soft);border-radius:var(--r-sm);font-size:18.5px}

.toggle{margin-top:12px;background:var(--elev);border:1px solid var(--border);color:var(--text);padding:7px 15px;border-radius:9px;cursor:pointer;font-size:16.6px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.toggle:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.toggle::before{content:'👁';font-size:15.9px}

.answers{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .25s,margin .25s,padding .25s;margin-top:0;padding:0 14px;border-radius:var(--r-sm);background:var(--success-soft);border-left:3px solid var(--success);font-size:18.5px}
.answers.show{max-height:400px;opacity:1;margin-top:11px;padding:11px 14px}
.answers div{font-weight:500}
.answers i{color:var(--muted)}

.ex[data-type="order"]{--tc:var(--accent);--tb:var(--accent-soft)}
.ex[data-type="match"]{--tc:var(--purple);--tb:var(--purple-soft)}
.ex[data-type="choice"]{--tc:var(--warn);--tb:var(--warn-soft)}
.ex[data-type="tf"]{--tc:var(--success);--tb:var(--success-soft)}

.ex.done{--tc:var(--success)}

/* --- Order (word arrangement) --- */
.slot{min-height:46px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:9px 11px;margin:9px 0;border:1.5px dashed var(--border);border-radius:var(--r-sm);background:var(--soft);transition:.2s}
.slot.correct{border-color:var(--success);border-style:solid;background:var(--success-soft)}
.slot.incorrect{border-color:var(--error);border-style:solid;background:var(--error-soft)}
.words .word{cursor:pointer;user-select:none}
.words .word.placed{opacity:.3;pointer-events:none}
.slot .word{cursor:pointer;background:var(--elev);border-color:var(--accent)}
.ex-actions{margin-top:2px}

/* --- Multiple choice --- */
.opts li{cursor:pointer}
.opts.answered li{pointer-events:none}
.opts li.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);font-weight:600}
.opts li.incorrect{background:var(--error-soft);border-color:var(--error);color:var(--error)}

/* --- True/False --- */
.tf-btns{display:flex;gap:10px;margin-top:11px}
.tf-btn{flex:1;padding:9px 0;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--soft);color:var(--text);cursor:pointer;font-weight:700;font-size:17.8px;font-family:inherit;transition:.18s}
.tf-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.tf-btns.answered .tf-btn{pointer-events:none}
.tf-btn.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.tf-btn.incorrect{background:var(--error-soft);border-color:var(--error);color:var(--error)}

/* --- Matching --- */
.match-cols{display:flex;gap:12px;margin-top:9px}
.match-col{flex:1;display:flex;flex-direction:column;gap:6px}
.match-item{padding:8px 12px;border-radius:var(--r-sm);background:var(--soft);border:1px solid var(--border);font-size:17.8px;cursor:pointer;transition:.16s}
.match-item:hover{border-color:var(--accent)}
.match-item.selected{border-color:var(--accent);background:var(--accent-soft)}
.match-item.matched{background:var(--success-soft);border-color:var(--success);color:var(--success);cursor:default}
.match-item.wrong{background:var(--error-soft);border-color:var(--error)}


/* --- Book tabs --- */
.book-tabs{max-width:1240px;margin:0 auto;display:flex;gap:8px;padding:0 22px 10px}
.book-tab{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--on-choco);cursor:pointer;font-family:inherit;font-size:19.8px;font-weight:700;transition:.2s;text-align:left}
.book-tab:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.book-tab.active{background:var(--on-choco);color:#3f2214;border-color:var(--on-choco);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bt-sub{font-size:17.1px;font-weight:500;opacity:.85}
.bt-count{font-size:15.2px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.28);color:var(--on-choco)}
.book-tab.active .bt-count{background:rgba(90,50,32,.16);color:#3f2214}

.menu-btn{display:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;backdrop-filter:blur(2px)}
.overlay.show{display:block}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;padding:18px 14px 60px;gap:16px}
  .sidebar{position:fixed;top:0;left:-320px;bottom:0;width:300px;max-height:none;z-index:95;background:var(--elev);padding:132px 16px 20px;transition:left .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg);overflow-y:auto}
  .sidebar.open{left:0}
  .menu-btn{display:grid}
  .pw span{display:none}
  .pbar{width:100px}
  .ex{padding:15px 17px}
}
@media(max-width:520px){
  .tb-in{padding:11px 14px;gap:9px}
  .book-tabs{padding:0 14px 10px;gap:6px}
  .book-tab{padding:7px 11px;font-size:18.5px;gap:7px;flex:1;justify-content:space-between}
  .bt-sub{display:none}
  .logo .full{display:none}
  .pbar{width:70px}
}

/* ===== честный прогресс и расширенные правила ===== */
.ex-status{font-size:17.8px;font-weight:600;color:var(--success);margin:-2px 0 10px}
.ex-status.bad{color:var(--error)}
.ex.peeked{border-color:var(--warn)!important}
.nav-item .nav-done{margin-left:auto;font-size:15.2px;font-weight:700;color:var(--muted);padding-left:6px;white-space:nowrap}
.nav-item.topic-complete .nav-done{color:var(--success)}
.gr-reset{padding:14px 12px 20px}
.gr-reset button{font-family:inherit;font-size:17.1px;background:none;border:1px solid var(--border);border-radius:99px;padding:5px 14px;color:var(--muted);cursor:pointer}
.gr-reset button:hover{border-color:var(--choco);color:var(--choco)}
.rule-ext{margin-top:12px;border-top:1px dashed color-mix(in srgb,var(--choco) 30%,transparent);padding-top:10px}
.rule-ext summary{cursor:pointer;font-weight:700;color:var(--choco);font-size:18.5px;list-style:none}
.rule-ext summary::-webkit-details-marker{display:none}
.rule-ext summary::after{content:" ▾";font-size:.85em}
.rule-ext:not([open]) summary::after{content:" ▸"}
.rx-block{margin-top:12px}
.rx-title{font-size:15.2px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--choco-2);margin-bottom:6px}
.rx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rx-table{border-collapse:collapse;width:100%;font-size:18.5px;background:var(--elev);border-radius:8px;overflow:hidden;min-width:520px}
.rx-table th{background:var(--choco);color:var(--on-choco);font-weight:600;padding:6px 10px;text-align:left}
.rx-table td{border-top:1px solid var(--border);padding:7px 10px;vertical-align:top;color:var(--text)}
.rx-table td.rx-name{font-weight:700;color:var(--choco);white-space:nowrap}
.rx-table b,.rx-use b,.rx-mist b{color:var(--choco)}
.rx-use,.rx-mist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rx-use li{background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:grid;gap:2px}
.rx-when{font-size:17.1px;font-weight:700;color:var(--choco-2)}
.rx-ex{font-size:19.8px;color:var(--text)}
.rx-tr{font-size:17.1px;color:var(--muted);font-style:italic}
.rx-markers{margin:0;font-size:18.5px;color:var(--text)}
.rx-mist li{background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:grid;gap:2px}
.rx-bad{color:var(--error);font-size:19.2px}
.rx-bad s{text-decoration-thickness:2px}
.rx-good{color:var(--success);font-size:19.2px;font-weight:600}
.rx-note{font-size:17.1px;color:var(--muted)}
@media (max-width:640px){.rx-table{font-size:17.1px}.rx-ex{font-size:19.2px}}
/* ===== Kids Grammar: дополнения ===== */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.topbar{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:101;background:#3f2214}
.sidebar{top:86px;max-height:calc(100vh - 106px)}
#navHost{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:14.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--choco-2);font-weight:700;padding:14px 12px 4px}
.nav-group:first-child{padding-top:2px}
.nav-item{padding:6px 10px}
.nav-num{width:26px}
.nav-title{flex:1;min-width:0}
.topic-header{margin-bottom:16px;padding-bottom:12px}
.rule{margin-bottom:16px}
.rule p{margin:0;font-size:19.8px}
.rule-ex{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-style:italic;font-size:19.8px}
.ex{padding:16px 20px}
.ex:hover{transform:none}
.ex .task{margin:0 0 8px}
.mc-item{padding:9px 0;border-top:1px solid var(--border)}
.mc-item:first-of-type{border-top:0;padding-top:2px}
.ex p.mc-q{margin:0 0 6px;font-size:20.5px}
.mc-n{color:var(--muted);font-weight:700;margin-right:2px}
.gap{color:var(--muted);letter-spacing:1px}
.ex .opts{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:2px}
.ex .opts li{padding:6px 14px;font-size:19.8px;border-color:var(--border)}
.ex .opts li:focus-visible,.word:focus-visible,.match-item:focus-visible,.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.match-item{font-family:inherit;color:var(--text);text-align:left;font-size:19.2px}
.match-item:disabled{cursor:default}
.ord-item{padding:10px 0;border-top:1px solid var(--border)}
.ord-item:first-of-type{border-top:0;padding-top:2px}
.ord-top{display:flex;align-items:center;gap:8px}
.ord-top .slot{flex:1;margin:0;min-height:40px;padding:6px 9px}
.ord-reset{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--elev);color:var(--muted);cursor:pointer;font-size:21.2px;font-family:inherit}
.ord-reset:hover{border-color:var(--accent);color:var(--accent)}
.words{margin:8px 0 0 22px}
button.word{font-family:inherit;color:var(--text);cursor:pointer;font-size:19.2px}
.slot button.word{background:var(--elev)}
.ord-fb{font-size:17.8px;color:var(--error);margin:6px 0 0 22px}
.ord-fb:empty{display:none}
.ord-fb b{color:var(--text)}
.ex-actions:empty{display:none}
.unit-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.unit-nav .toggle::before{content:none}
.unit-nav .toggle{margin-top:0;font-size:17.8px;max-width:48%}
@media(max-width:900px){.sidebar{top:0;max-height:none;padding:calc(72px + env(safe-area-inset-top,0px)) 12px 20px}}
@media(max-width:520px){
  .ex{padding:14px 14px}
  .rule{padding:14px 16px 14px 18px}
  .match-cols{gap:8px}
  .match-item{font-size:17.8px;padding:8px 9px}
  .words{margin-left:0}
  .ord-fb{margin-left:0}
  .unit-nav .toggle{max-width:100%;flex:1}
}

.sidebar{top:138px;max-height:calc(100vh - 158px)}
@media(max-width:900px){.sidebar{top:0;max-height:none;padding:calc(124px + env(safe-area-inset-top,0px)) 12px 20px}}
.book-tabs{overflow-x:auto;scrollbar-width:none}
.book-tabs::-webkit-scrollbar{display:none}
.book-tab{flex:none}
.nav-review .nav-title{font-style:italic}
.nav-review .nav-num{background:var(--choco-soft);font-size:13.2px}
.t-icon{font-size:.85em}

/* ===== Тетрадь: тёмно-коричневые акценты, кофейный фон, линованный лист ===== */
:root,[data-theme="dark"]{
  --ink:#2e241e; --ink-soft:#5a3f2a; --paper:#f5efe8; --paper-alt:#f1e7de; --card:#fffaf5;
  --line:#dccfc2; --cover:#45301f; --cover-soft:#5a3f2a; --cover-text:#fcf5ed; --gold:#c3a06a;
  --bg:#f5efe8; --elev:#fffaf5; --soft:#f1e7de; --text:#2e241e; --muted:#5a3f2a;
  --border:#e5d6c8; --accent:#8a6246; --accent-soft:#f1e7de;
  --success:#2d7a4a; --success-soft:#e3ecdd; --error:#b34a4a; --error-soft:#f3e0da;
  --choco:#45301f; --choco-2:#5a3f2a; --choco-soft:#f1e7de; --on-choco:#fcf5ed;
  --sh-sm:0 6px 16px rgba(46,36,30,.05); --sh-md:0 8px 20px rgba(46,36,30,.07); --sh-lg:0 14px 36px rgba(46,36,30,.2);
  --r:10px; --r-sm:8px; --mono:'Space Mono','Courier New',monospace; --hand:'Caveat',cursive;
  color-scheme:light;
}
html,body{background:var(--paper)}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0 38px,var(--line) 38px 39px);background-attachment:local}
#themeBtn{display:none}
/* обложка: шапка */
.topbar,[data-theme="dark"] .topbar{background:var(--cover);border-bottom:3px solid var(--accent);box-shadow:0 4px 14px rgba(46,36,30,.25)}
body::before{background:var(--cover)!important}
.logo .full{font-family:var(--mono);font-weight:700;letter-spacing:.2px;color:var(--cover-text)}
.logo small{font-family:var(--hand);font-size:22.4px;color:var(--gold);font-weight:500}
.logo-mark{background:var(--gold);color:var(--cover);box-shadow:none;font-family:var(--mono)}
.pw{color:rgba(252,245,237,.75)}
.pbar{background:rgba(0,0,0,.25)}
.pfill{background:var(--gold)}
.ibtn{background:var(--cover-soft);border-color:rgba(255,255,255,.12);color:var(--cover-text)}
.book-tab{background:var(--cover-soft);color:var(--cover-text);border-color:rgba(255,255,255,.12)}
.book-tab.active{background:var(--paper);color:var(--ink);border-color:var(--gold)}
.book-tab .bt-name{font-family:var(--mono)}
/* обложка: оглавление */
.sidebar{background:var(--cover);border-radius:12px;padding:16px 10px 10px;border-left:3px solid var(--accent);box-shadow:var(--sh-md)}
.sidebar h3{font-family:var(--hand);text-transform:none;letter-spacing:0;font-size:26.4px;color:var(--gold);font-weight:700;padding-left:10px}
.sidebar::-webkit-scrollbar-thumb{background:var(--cover-soft)}
.nav-group{font-family:var(--hand);text-transform:none;letter-spacing:0;font-size:23.8px;color:var(--gold)!important;font-weight:700}
.nav-item{color:var(--cover-text);border-left:3px solid transparent;border-radius:8px}
.nav-item:hover{background:var(--cover-soft);color:#fff;border-color:transparent;border-left-color:transparent}
.nav-item.active{background:var(--cover-soft);color:#fff;font-weight:700;border-color:transparent;border-left:3px solid var(--gold)}
.nav-num,.nav-item.active .nav-num{background:rgba(255,255,255,.12);color:var(--cover-text);font-family:var(--mono);font-size:13.9px}
.nav-item.active .nav-num{background:var(--gold);color:var(--cover)}
.nav-item .nav-done{color:rgba(252,245,237,.6)}
.nav-item.topic-complete .nav-done{color:#b9dcb7}
.gr-reset button{color:var(--cover-text);border-color:rgba(255,255,255,.25)}
.gr-reset button:hover{color:#fff;border-color:var(--gold)}
/* лист: поле слева */
.content{border-left:2px solid var(--accent);padding-left:26px}
.topic-header{border-bottom:none;margin-bottom:22px}
.topic-header h2{display:inline-block;font-family:var(--mono);font-size:clamp(26.4px,3.4vw,35.6px);letter-spacing:.2px;color:var(--ink);
  background:var(--card);border:2px dashed var(--accent);border-radius:10px;padding:10px 20px;transform:rotate(-1deg);box-shadow:var(--sh-md);margin-top:8px}
.topic-tag,[data-theme="dark"] .topic-tag{background:var(--cover);color:var(--cover-text);font-family:var(--mono);letter-spacing:.06em}
.rule{background:var(--card);border:1px solid var(--border);border-left:6px solid var(--gold);border-radius:0 10px 10px 0;box-shadow:var(--sh-sm)}
.rule-title{font-family:var(--mono);color:var(--accent);font-size:18.5px;letter-spacing:.4px}
.rule p{font-size:21.8px;line-height:1.6}
.rule-ex span{font-style:normal;font-family:var(--mono);font-size:19.2px;background:var(--paper-alt);border-radius:8px;padding:3px 12px;align-self:flex-start}
.rule-ex{gap:5px}
.pic-cell{background:var(--paper-alt);border-color:var(--border)}
.ex{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh-sm)}
.ex::before{display:none}
.ex-head{border-bottom:1px solid var(--border);padding-bottom:9px}
.ex-num{font-family:var(--mono);font-size:19.8px;color:var(--ink);text-transform:none;letter-spacing:0}
.ex-type{background:var(--paper-alt);color:var(--ink-soft);font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;font-size:16.6px;font-weight:500}
.ex.done .ex-type{background:var(--success-soft);color:var(--success)}
.ex .task{font-family:var(--hand);font-style:normal;font-size:25.1px;color:var(--ink-soft);line-height:1.3}
.mc-q,.ex p.mc-q{font-size:21.2px}
.opts li,.match-item,.word,button.word{font-family:var(--mono);font-size:18.5px;background:var(--paper-alt);border:1px solid var(--border);border-radius:30px;color:var(--ink)}
.match-item{border-radius:20px}
.opts li:hover,.match-item:hover,.words .word:hover{background:#ead9ca;border-color:var(--accent);color:var(--ink)}
.match-item.selected{background:var(--cover);border-color:var(--cover);color:var(--cover-text)}
.opts li.correct,.match-item.matched{background:var(--success-soft);border-color:var(--success);color:#1f5c34}
.opts li.incorrect,.match-item.wrong{background:var(--error-soft);border-color:var(--error);color:#5c2a22}
.slot{background:var(--paper);border:1.5px dashed var(--accent);border-radius:12px}
.slot .word,.slot button.word{background:var(--card)}
.ord-reset{border-radius:50%;background:var(--card)}
.toggle,.unit-nav .toggle{background:var(--cover);color:var(--cover-text);border:none;border-radius:30px;font-family:var(--mono);font-size:17.1px}
.toggle:hover,.unit-nav .toggle:hover{background:var(--cover-soft);color:#fff;transform:none}
.q-pic{filter:none}
@media(min-width:901px){
  .layout{grid-template-columns:1fr 280px}
  .sidebar{order:2}
  .content{order:1}
}
@media(max-width:900px){
  .sidebar{border-radius:0;border-left:none;border-right:3px solid var(--accent)}
  .content{padding-left:16px}

}

/* ============ КНИГИ ============ */
const EX_KEYS = ['m','c','o'];
const KEY = 'grammarFriends';
let solved = {};
try{ solved = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
const saveSolved = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(solved)); }catch(e){} };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
const normalize = s => s.toLowerCase().replace(/[.,;:!?]+/g,' ').replace(/\s+/g,' ').trim();
function parseLabel(label){
  let m;
  if((m = label.match(/^Starter:\s*(.*)$/))) return {num:'S', tag:'Starter', title:m[1], review:false};
  if((m = label.match(/^Review\s+(\d+)\s*(.*)$/))) return {num:'R'+m[1], tag:'Review '+m[1], title:'Review '+m[1]+(m[2]?' '+m[2]:''), review:true};
  if((m = label.match(/^(\d+)\.\s*(.*)$/))) return {num:m[1], tag:'Unit '+m[1], title:m[2], review:false};
  return {num:'•', tag:'', title:label, review:false};
}
let curBook = '1', cur = 0;
const UNITS = () => BOOKS[curBook];
const sKey = (u,k) => curBook+'-'+u.id+'-'+k;
const bookTotal = b => BOOKS[b].length * EX_KEYS.length;
const bookDone = b => Object.keys(solved).filter(k=>k.startsWith(b+'-')).length;

const navHost = document.getElementById('navHost');
function buildNav(){
  navHost.innerHTML = UNITS().map((u,i)=>{
    const p = parseLabel(u.label);
    return `<button type="button" class="nav-item${p.review?' nav-review':''}" data-i="${i}"><span class="nav-num">${p.num}</span><span class="nav-title">${esc(p.title)}</span><span class="nav-done"></span></button>`;
  }).join('');
  navHost.querySelectorAll('.nav-item').forEach(b=> b.addEventListener('click', ()=> showUnit(+b.dataset.i)));
  document.getElementById('sideTitle').textContent = 'Содержание · Уровень ' + curBook;
}
function buildTabs(){
  const t = document.getElementById('bookTabs');
  t.innerHTML = Object.keys(BOOKS).map(b=>`<button type="button" class="book-tab${b===curBook?' active':''}" data-b="${b}" role="tab" aria-selected="${b===curBook}"><span class="bt-name">${b}</span><span class="bt-sub">Уровень</span><span class="bt-count" id="bc-${b}"></span></button>`).join('');
  t.querySelectorAll('.book-tab').forEach(x=> x.addEventListener('click', ()=> switchBook(x.dataset.b)));
}
function switchBook(b, unitIdx){
  curBook = b;
  try{ localStorage.setItem(KEY+':book', b); }catch(e){}
  document.querySelectorAll('.book-tab').forEach(x=>{ const on = x.dataset.b===b; x.classList.toggle('active', on); x.setAttribute('aria-selected', on); });
  buildNav();
  let last = 0; try{ last = parseInt(localStorage.getItem(KEY+':last'+b),10) || 0; }catch(e){}
  showUnit(unitIdx != null ? unitIdx : (last < UNITS().length ? last : 0));
}
function updateProgress(){
  navHost.querySelectorAll('.nav-item').forEach(b=>{
    const u = UNITS()[+b.dataset.i];
    const d = EX_KEYS.filter(k=>solved[sKey(u,k)]).length;
    b.querySelector('.nav-done').textContent = d===3 ? '✓' : (d ? d+'/3' : '');
    b.classList.toggle('topic-complete', d===3);
  });
  Object.keys(BOOKS).forEach(b=>{ const c = document.getElementById('bc-'+b); if(c) c.textContent = bookDone(b)+'/'+bookTotal(b); });
  const done = bookDone(curBook), total = bookTotal(curBook);
  document.getElementById('pfill').style.width = Math.round(done/total*100) + '%';
  document.getElementById('ptext').textContent = done + '/' + total;
}
function markDone(u, k, el){
  if(!solved[sKey(u,k)]){ solved[sKey(u,k)] = 1; saveSolved(); }
  el.classList.add('done');
  setStatus(el, '✓ Всё верно!');
  updateProgress();
}
function setStatus(el, text, bad){
  let st = el.querySelector('.ex-status');
  if(!st){ st = document.createElement('div'); st.className = 'ex-status'; el.querySelector('.ex-head').after(st); }
  st.textContent = text; st.classList.toggle('bad', !!bad);
}
function exHead(n, type, task){
  return `<div class="ex-head"><span class="ex-num">Exercise ${n}</span><span class="ex-type">${type}</span></div><p class="task">${esc(task)}</p>`;
}

/* ============ УПРАЖНЕНИЯ ============ */
function buildMatch(u, el){
  const pairs = u.matching.pairs;
  el.innerHTML = exHead(1, 'Matching', u.matching.title + ' — нажмите слева, затем справа.') +
    `<div class="match-cols"><div class="match-col">${pairs.map((p,i)=>`<button type="button" class="match-item" data-side="l" data-i="${i}">${esc(p.left)}</button>`).join('')}</div>
     <div class="match-col">${shuffle(pairs.map((p,i)=>i)).map(i=>`<button type="button" class="match-item" data-side="r" data-i="${i}">${esc(pairs[i].right)}</button>`).join('')}</div></div>`;
  if(solved[sKey(u,'m')]){
    el.querySelectorAll('.match-item').forEach(b=>{ b.classList.add('matched'); b.disabled = true; });
    el.classList.add('done'); setStatus(el, '✓ Решено'); return;
  }
  let sel = null;
  el.querySelectorAll('.match-item[data-side="l"]').forEach(b=> b.addEventListener('click', ()=>{
    if(sel) sel.classList.remove('selected');
    sel = b; b.classList.add('selected');
  }));
  el.querySelectorAll('.match-item[data-side="r"]').forEach(b=> b.addEventListener('click', ()=>{
    if(!sel){ setStatus(el, 'Сначала выберите элемент слева.', true); return; }
    // сравниваем текст: в некоторых юнитах один ответ подходит к нескольким словам
    if(pairs[+b.dataset.i].right === pairs[+sel.dataset.i].right || pairs[+b.dataset.i].left === pairs[+sel.dataset.i].left){
      [sel,b].forEach(x=>{ x.classList.remove('selected'); x.classList.add('matched'); x.disabled = true; });
      sel = null;
      const st = el.querySelector('.ex-status'); if(st) st.remove();
      if(!el.querySelector('.match-item:not(.matched)')) markDone(u, 'm', el);
    } else {
      b.classList.add('wrong'); const s = sel;
      setTimeout(()=>{ b.classList.remove('wrong'); s && s.classList.remove('selected'); }, 450);
      sel = null;
    }
  }));
}

function buildChoice(u, el){
  const qs = u.multiple.questions;
  el.innerHTML = exHead(2, 'Multiple choice', u.multiple.title) +
    qs.map((q,qi)=>`<div class="mc-item"><p class="mc-q"><span class="mc-n">${qi+1}.</span> ${(q.e||((gfPics(q.q.replace(/\(.*?\)/g,''),2,q.options.map(o=>GF_EMOJI[o.toLowerCase()]).filter(Boolean))).map(p=>p.e).join('')))?`<span class="q-pic" aria-hidden="true">${q.e||gfPics(q.q.replace(/\(.*?\)/g,''),2,q.options.map(o=>GF_EMOJI[o.toLowerCase()]).filter(Boolean)).map(p=>p.e).join('')}</span>`:''}${esc(q.q).replace(/_{2,}/g,'<span class="gap">_____</span>')}</p><ul class="opts">${q.options.map((o,oi)=>`<li tabindex="0" role="button" data-q="${qi}" data-o="${oi}">${esc(o)}</li>`).join('')}</ul></div>`).join('') +
    `<div class="ex-actions"></div>`;
  const isDone = !!solved[sKey(u,'c')];
  if(isDone){ el.classList.add('done'); setStatus(el, '✓ Решено · можно пройти ещё раз'); }
  let answered = 0, correct = 0;
  const pick = li=>{
    const ul = li.parentElement; if(ul.classList.contains('answered')) return;
    ul.classList.add('answered');
    const q = qs[+li.dataset.q];
    if(+li.dataset.o === q.correct){ li.classList.add('correct'); correct++; }
    else { li.classList.add('incorrect'); ul.children[q.correct].classList.add('correct'); }
    answered++;
    if(answered === qs.length){
      if(correct === qs.length) markDone(u, 'c', el);
      else {
        setStatus(el, `Верно ${correct} из ${qs.length}. Упражнение засчитается, когда все ответы будут верными.`, true);
        el.querySelector('.ex-actions').innerHTML = '<button type="button" class="toggle retry-btn">↻ Пройти ещё раз</button>';
        el.querySelector('.retry-btn').addEventListener('click', ()=> buildChoice(u, el));
      }
    }
  };
  el.querySelectorAll('.opts li').forEach(li=>{
    li.addEventListener('click', ()=> pick(li));
    li.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(li); } });
  });
}

function buildOrder(u, el){
  const ss = u.unscramble.sentences;
  el.innerHTML = exHead(3, 'Word order', u.unscramble.title + ' — нажимайте на слова по порядку.') +
    ss.map((s,si)=>`<div class="ord-item" data-s="${si}"><div class="ord-top"><span class="mc-n">${si+1}.</span>${(()=>{const p=gfPics(s.correct,2).map(x=>x.e).join('');return p?`<span class="q-pic ord-pic" aria-hidden="true">${p}</span>`:'';})()}<div class="slot"></div><button type="button" class="ord-reset" title="Сбросить" aria-label="Сбросить">↺</button></div><div class="words">${shuffle(s.words).map(w=>`<button type="button" class="word">${esc(w)}</button>`).join('')}</div><div class="ord-fb"></div></div>`).join('');
  const ok = new Set();
  if(solved[sKey(u,'o')]){ el.classList.add('done'); setStatus(el, '✓ Решено · можно пройти ещё раз'); }
  el.querySelectorAll('.ord-item').forEach(item=>{
    const s = ss[+item.dataset.s];
    const slot = item.querySelector('.slot'), pool = item.querySelector('.words'), fb = item.querySelector('.ord-fb');
    const locked = ()=> slot.classList.contains('correct');
    const reset = ()=>{
      if(locked()) return;
      slot.innerHTML = ''; slot.classList.remove('incorrect'); fb.textContent = '';
      pool.querySelectorAll('.word').forEach(w=> w.classList.remove('placed'));
    };
    item.querySelector('.ord-reset').addEventListener('click', reset);
    pool.querySelectorAll('.word').forEach(w=> w.addEventListener('click', ()=>{
      if(w.classList.contains('placed') || locked() || slot.classList.contains('incorrect')) return;
      w.classList.add('placed');
      const sp = document.createElement('button'); sp.type = 'button'; sp.className = 'word'; sp.textContent = w.textContent;
      sp.addEventListener('click', ()=>{ if(locked() || slot.classList.contains('incorrect')) return; sp.remove(); w.classList.remove('placed'); });
      slot.appendChild(sp);
      if(!pool.querySelector('.word:not(.placed)')){
        const built = [...slot.children].map(c=>c.textContent).join(' ');
        if(normalize(built) === normalize(s.correct)){
          slot.classList.add('correct'); fb.textContent = '';
          ok.add(item.dataset.s);
          if(ok.size === ss.length) markDone(u, 'o', el);
        } else {
          slot.classList.add('incorrect');
          fb.innerHTML = `Неверно. Правильно: <b>${esc(s.correct)}</b> — нажмите ↺ и соберите ещё раз.`;
        }
      }
    }));
  });
}

function gfPics(text, max, exclude){
  const seen = new Set(exclude||[]), out = [];
  (text.toLowerCase().match(/[a-z]+/g)||[]).forEach(w=>{
    const e = GF_EMOJI[w];
    if(e && !seen.has(e)){ seen.add(e); out.push({w, e}); }
  });
  return out.slice(0, max);
}

function picStrip(u){
  const base = (u.pics||[]).slice();
  const txt = [u.examples].concat(u.matching.pairs.map(p=>p.left+' '+p.right), u.multiple.questions.map(q=>q.q), u.unscramble.sentences.map(x=>x.correct)).join(' ');
  const extra = gfPics(txt, Math.max(0, 8 - base.length), base.map(p=>p.e));
  const all = base.concat(extra);
  if(!all.length) return '';
  return `<div class="pic-strip" aria-label="Слова в картинках">${all.map(p=>`<div class="pic-cell"><span class="pc-e" aria-hidden="true">${p.e}</span><span class="pc-w">${esc(PROPER[p.w]||p.w)}</span></div>`).join('')}</div>`;
}
/* ============ ЮНИТ ============ */
function showUnit(i){
  cur = i;
  const u = UNITS()[i];
  try{ localStorage.setItem(KEY+':last'+curBook, String(i)); }catch(e){}
  const ex = u.examples.split(/(?<=[.?!])\s+(?=[A-Z'"])/).filter(Boolean);
  document.getElementById('content').innerHTML = `
    <section class="topic active">
      <div class="topic-header"><span class="topic-tag">Level ${curBook} · ${esc(parseLabel(u.label).tag)}</span><h2>${u.icon?`<span class="t-icon">${u.icon}</span> `:''}${esc(parseLabel(u.label).title)}</h2></div>
      <div class="rule"><div class="rule-title">📘 Правило</div><p>${esc(u.rule)}</p>
        <div class="rule-ex">${ex.map(e=>`<span>${esc(e)}</span>`).join('')}</div>${picStrip(u)}</div>
      <div class="ex" data-type="match" id="exM"></div>
      <div class="ex" data-type="choice" id="exC"></div>
      <div class="ex" data-type="order" id="exO"></div>
      <div class="unit-nav">
        ${i>0 ? `<button type="button" class="toggle nav-btn" data-go="${i-1}">← ${esc(parseLabel(UNITS()[i-1].label).title)}</button>` : '<span></span>'}
        ${i<UNITS().length-1 ? `<button type="button" class="toggle nav-btn" data-go="${i+1}">${esc(parseLabel(UNITS()[i+1].label).title)} →</button>` : (curBook<'6' ? `<button type="button" class="toggle nav-btn" data-book="${+curBook+1}">Уровень ${+curBook+1} →</button>` : '')}
      </div>
    </section>`;
  buildMatch(u, document.getElementById('exM'));
  buildChoice(u, document.getElementById('exC'));
  buildOrder(u, document.getElementById('exO'));
  document.querySelectorAll('.unit-nav .nav-btn').forEach(b=> b.addEventListener('click', ()=> b.dataset.book ? switchBook(b.dataset.book, 0) : showUnit(+b.dataset.go)));
  navHost.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('active', +b.dataset.i === i));
  const act = navHost.querySelector('.nav-item.active');
  if(act){ const sb = document.getElementById('sidebar'); const r = act.offsetTop - sb.clientHeight/2; sb.scrollTop = Math.max(0, r); }
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  updateProgress();
  window.scrollTo({top:0});
}

/* ============ МЕНЮ, ТЕМА, СБРОС ============ */
function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
document.getElementById('menuBtn').addEventListener('click', toggleMenu);
document.getElementById('overlay').addEventListener('click', toggleMenu);
const themeBtn = document.getElementById('themeBtn');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t==='dark' ? '☀️' : '🌙';
  try{ localStorage.setItem(KEY+':theme', t); }catch(e){}
}
themeBtn.addEventListener('click', ()=> setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'));
let theme = null; try{ theme = localStorage.getItem(KEY+':theme'); }catch(e){}
if(!theme) theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
setTheme('light');
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Сбросить весь прогресс?')) return;
  solved = {}; saveSolved(); showUnit(cur);
});

buildTabs();
let startBook = '1'; try{ const b = localStorage.getItem(KEY+':book'); if(b && BOOKS[b]) startBook = b; }catch(e){}
switchBook(startBook);
