<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Grammar Workbooks · B1–B2 + B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f0e8; --elev:#fbf8f3; --soft:#f5ede4; --text:#3d2b1a; --muted:#7a644f;
  --border:#d4c0b0; --accent:#a67c6b; --accent-soft:#f5ede4;
  --success:#7c9a6e; --success-soft:#eef1e4;
  --warn:#f5a623; --warn-soft:#fdf1dc;
  --purple:#7a5a4a; --purple-soft:#f0e4d8;
  --error:#c1584e; --error-soft:#f9e4e0;
  --choco:#5a3220; --choco-2:#7b4a2e; --choco-soft:#ecdccd; --on-choco:#f7e9da;
  --sh-sm:0 1px 3px rgba(90,63,40,.08); --sh-md:0 8px 30px rgba(166,124,107,.1);
  --sh-lg:0 14px 36px rgba(90,63,40,.16); --r:14px; --r-sm:10px;
}
[data-theme="dark"]{
  --bg:#20150d; --elev:#2b1d12; --soft:#3a2818; --text:#f3e6d6; --muted:#cbae94;
  --border:#4a3624; --accent:#c99b7f; --accent-soft:#3a2818;
  --success:#9ab08a; --success-soft:#2a3324;
  --warn:#f0b768; --warn-soft:#3d2f13;
  --purple:#b08f74; --purple-soft:#3a2b1c;
  --error:#d98d81; --error-soft:#3a2320;
  --choco:#c58a63; --choco-2:#8a5233; --choco-soft:#4a2f1d; --on-choco:#f7e9da;
  --sh-sm:0 1px 3px rgba(0,0,0,.3); --sh-md:0 4px 14px rgba(0,0,0,.4); --sh-lg:0 14px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Times New Roman',Times,'Liberation Serif',serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#3f2214,#6b3d25);color:var(--on-choco);border-bottom:2px solid #2d180d;box-shadow:0 4px 16px rgba(60,30,15,.35)}
[data-theme="dark"] .topbar{background:linear-gradient(135deg,#1c0f08,#4a2a18);border-bottom-color:#0f0804}
.tb-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21.2px;letter-spacing:-.02em}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#d9a684,#a0684a);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18.5px;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo small{display:block;font-size:14.5px;font-weight:500;color:#dcc3ab}
.sp{flex:1}
.pw{display:flex;align-items:center;gap:9px;font-size:16.6px;color:#e6d0ba;font-weight:500}
.pbar{width:150px;height:7px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#e8c39f,#c58a63);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--on-choco);cursor:pointer;display:grid;place-items:center;font-size:19.8px;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px);box-shadow:var(--sh-sm)}

.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:30px;padding:26px 22px 80px}
.sidebar{position:sticky;top:138px;align-self:start;max-height:calc(100vh - 162px);overflow-y:auto;padding-right:4px}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.sidebar h3{font-size:14.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:10px;padding-left:12px}
.nav-list{display:none;flex-direction:column;gap:3px}
.nav-list.active{display:flex}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:17.8px;color:var(--muted);font-weight:500;border:1px solid transparent;transition:.18s;text-align:left;background:none;font-family:inherit;width:100%}
.nav-item:hover{background:var(--elev);color:var(--text);border-color:var(--border)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.nav-num{width:22px;height:22px;border-radius:6px;background:var(--soft);color:var(--muted);display:grid;place-items:center;font-size:14.5px;font-weight:700;flex-shrink:0;transition:.18s}
.nav-item.active .nav-num{background:var(--choco);color:#fff}
[data-theme="dark"] .nav-item.active .nav-num{color:#20150d}

.content{min-width:0}
.topic{display:none;animation:fadeUp .4s cubic-bezier(.4,0,.2,1)}
.topic.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.topic-header{margin-bottom:20px;padding-bottom:18px;border-bottom:2px solid var(--choco)}
.topic-tag{display:inline-block;font-size:14.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--on-choco);background:linear-gradient(135deg,var(--choco-2),var(--choco));padding:4px 12px;border-radius:99px;margin-bottom:10px}
[data-theme="dark"] .topic-tag{color:#20150d;background:linear-gradient(135deg,#d9a684,var(--choco))}
.topic-header h2{font-family:'Times New Roman',Times,'Liberation Serif',serif;font-size:clamp(31.7px,3.9vw,45px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.topic-header p{color:var(--muted);font-size:19.2px;margin-top:6px}

.rule{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--purple-soft) 60%,var(--accent-soft)));border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:var(--r);padding:16px 20px;margin-bottom:24px;font-size:19.2px;position:relative;overflow:hidden}
.rule::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--choco-2),var(--choco))}
.rule b{color:var(--choco);font-weight:700}
.rule i{color:var(--muted);font-style:italic}
.rule-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.2px;text-transform:uppercase;letter-spacing:.08em;color:var(--choco);margin-bottom:7px}

.ex{background:var(--elev);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:var(--sh-sm);transition:.25s;position:relative;overflow:hidden}
.ex:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.ex::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--accent))}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ex-num{font-weight:700;font-size:15.9px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.ex-type{font-size:13.2px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--tb,var(--accent-soft));color:var(--tc,var(--accent))}
.ex p{font-size:19.8px;margin:7px 0}
.ex .task{font-size:17.8px;color:var(--muted);font-style:italic;margin-top:3px}

.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opts li{padding:8px 13px;border-radius:var(--r-sm);background:var(--soft);border:1px solid transparent;font-size:18.5px;transition:.18s}
.opts li:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}

.words{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.word{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:17.8px;font-weight:500;transition:.18s}
.word:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.match-table{width:100%;border-collapse:collapse;margin-top:9px;font-size:18.5px}
.match-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.match-table tr:last-child td{border-bottom:none}
.match-table td:first-child{width:50%;font-weight:500}
.match-table td:last-child{color:var(--muted)}
.tf{font-weight:600;padding:9px 13px;background:var(--soft);border-radius:var(--r-sm);font-size:18.5px}

.toggle{margin-top:12px;background:var(--elev);border:1px solid var(--border);color:var(--text);padding:7px 15px;border-radius:9px;cursor:pointer;font-size:16.6px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.toggle:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.toggle::before{content:'👁';font-size:15.9px}

.answers{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .25s,margin .25s,padding .25s;margin-top:0;padding:0 14px;border-radius:var(--r-sm);background:var(--success-soft);border-left:3px solid var(--success);font-size:18.5px}
.answers.show{max-height:400px;opacity:1;margin-top:11px;padding:11px 14px}
.answers div{font-weight:500}
.answers i{color:var(--muted)}

.ex[data-type="order"]{--tc:var(--accent);--tb:var(--accent-soft)}
.ex[data-type="match"]{--tc:var(--purple);--tb:var(--purple-soft)}
.ex[data-type="choice"]{--tc:var(--warn);--tb:var(--warn-soft)}
.ex[data-type="tf"]{--tc:var(--success);--tb:var(--success-soft)}

.ex.done{--tc:var(--success)}

/* --- Order (word arrangement) --- */
.slot{min-height:46px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:9px 11px;margin:9px 0;border:1.5px dashed var(--border);border-radius:var(--r-sm);background:var(--soft);transition:.2s}
.slot.correct{border-color:var(--success);border-style:solid;background:var(--success-soft)}
.slot.incorrect{border-color:var(--error);border-style:solid;background:var(--error-soft)}
.words .word{cursor:pointer;user-select:none}
.words .word.placed{opacity:.3;pointer-events:none}
.slot .word{cursor:pointer;background:var(--elev);border-color:var(--accent)}
.ex-actions{margin-top:2px}

/* --- Multiple choice --- */
.opts li{cursor:pointer}
.opts.answered li{pointer-events:none}
.opts li.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);font-weight:600}
.opts li.incorrect{background:var(--error-soft);border-color:var(--error);color:var(--error)}

/* --- True/False --- */
.tf-btns{display:flex;gap:10px;margin-top:11px}
.tf-btn{flex:1;padding:9px 0;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--soft);color:var(--text);cursor:pointer;font-weight:700;font-size:17.8px;font-family:inherit;transition:.18s}
.tf-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.tf-btns.answered .tf-btn{pointer-events:none}
.tf-btn.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.tf-btn.incorrect{background:var(--error-soft);border-color:var(--error);color:var(--error)}

/* --- Matching --- */
.match-cols{display:flex;gap:12px;margin-top:9px}
.match-col{flex:1;display:flex;flex-direction:column;gap:6px}
.match-item{padding:8px 12px;border-radius:var(--r-sm);background:var(--soft);border:1px solid var(--border);font-size:17.8px;cursor:pointer;transition:.16s}
.match-item:hover{border-color:var(--accent)}
.match-item.selected{border-color:var(--accent);background:var(--accent-soft)}
.match-item.matched{background:var(--success-soft);border-color:var(--success);color:var(--success);cursor:default}
.match-item.wrong{background:var(--error-soft);border-color:var(--error)}


/* --- Book tabs --- */
.book-tabs{max-width:1240px;margin:0 auto;display:flex;gap:8px;padding:0 22px 10px}
.book-tab{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--on-choco);cursor:pointer;font-family:inherit;font-size:19.8px;font-weight:700;transition:.2s;text-align:left}
.book-tab:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.book-tab.active{background:var(--on-choco);color:#3f2214;border-color:var(--on-choco);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bt-sub{font-size:17.1px;font-weight:500;opacity:.85}
.bt-count{font-size:15.2px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.28);color:var(--on-choco)}
.book-tab.active .bt-count{background:rgba(90,50,32,.16);color:#3f2214}

.menu-btn{display:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;backdrop-filter:blur(2px)}
.overlay.show{display:block}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;padding:18px 14px 60px;gap:16px}
  .sidebar{position:fixed;top:0;left:-320px;bottom:0;width:300px;max-height:none;z-index:95;background:var(--elev);padding:132px 16px 20px;transition:left .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg);overflow-y:auto}
  .sidebar.open{left:0}
  .menu-btn{display:grid}
  .pw span{display:none}
  .pbar{width:100px}
  .ex{padding:15px 17px}
}
@media(max-width:520px){
  .tb-in{padding:11px 14px;gap:9px}
  .book-tabs{padding:0 14px 10px;gap:6px}
  .book-tab{padding:7px 11px;font-size:18.5px;gap:7px;flex:1;justify-content:space-between}
  .bt-sub{display:none}
  .logo .full{display:none}
  .pbar{width:70px}
}

/* ===== честный прогресс и расширенные правила ===== */
.ex-status{font-size:17.8px;font-weight:600;color:var(--success);margin:-2px 0 10px}
.ex-status.bad{color:var(--error)}
.ex.peeked{border-color:var(--warn)!important}
.nav-item .nav-done{margin-left:auto;font-size:15.2px;font-weight:700;color:var(--muted);padding-left:6px;white-space:nowrap}
.nav-item.topic-complete .nav-done{color:var(--success)}
.gr-reset{padding:14px 12px 20px}
.gr-reset button{font-family:inherit;font-size:17.1px;background:none;border:1px solid var(--border);border-radius:99px;padding:5px 14px;color:var(--muted);cursor:pointer}
.gr-reset button:hover{border-color:var(--choco);color:var(--choco)}
.rule-ext{margin-top:12px;border-top:1px dashed color-mix(in srgb,var(--choco) 30%,transparent);padding-top:10px}
.rule-ext summary{cursor:pointer;font-weight:700;color:var(--choco);font-size:18.5px;list-style:none}
.rule-ext summary::-webkit-details-marker{display:none}
.rule-ext summary::after{content:" ▾";font-size:.85em}
.rule-ext:not([open]) summary::after{content:" ▸"}
.rx-block{margin-top:12px}
.rx-title{font-size:15.2px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--choco-2);margin-bottom:6px}
.rx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rx-table{border-collapse:collapse;width:100%;font-size:18.5px;background:var(--elev);border-radius:8px;overflow:hidden;min-width:520px}
.rx-table th{background:var(--choco);color:var(--on-choco);font-weight:600;padding:6px 10px;text-align:left}
.rx-table td{border-top:1px solid var(--border);padding:7px 10px;vertical-align:top;color:var(--text)}
.rx-table td.rx-name{font-weight:700;color:var(--choco);white-space:nowrap}
.rx-table b,.rx-use b,.rx-mist b{color:var(--choco)}
.rx-use,.rx-mist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rx-use li{background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:grid;gap:2px}
.rx-when{font-size:17.1px;font-weight:700;color:var(--choco-2)}
.rx-ex{font-size:19.8px;color:var(--text)}
.rx-tr{font-size:17.1px;color:var(--muted);font-style:italic}
.rx-markers{margin:0;font-size:18.5px;color:var(--text)}
.rx-mist li{background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:grid;gap:2px}
.rx-bad{color:var(--error);font-size:19.2px}
.rx-bad s{text-decoration-thickness:2px}
.rx-good{color:var(--success);font-size:19.2px;font-weight:600}
.rx-note{font-size:17.1px;color:var(--muted)}
@media (max-width:640px){.rx-table{font-size:17.1px}.rx-ex{font-size:19.2px}}
/* ===== Тетрадь: тёмно-коричневые акценты, кофейный фон, линованный лист ===== */
:root,[data-theme="dark"]{
  --ink:#2e241e; --ink-soft:#5a3f2a; --paper:#f5efe8; --paper-alt:#f1e7de; --card:#fffaf5;
  --line:#dccfc2; --cover:#45301f; --cover-soft:#5a3f2a; --cover-text:#fcf5ed; --gold:#c3a06a;
  --bg:#f5efe8; --elev:#fffaf5; --soft:#f1e7de; --text:#2e241e; --muted:#5a3f2a;
  --border:#e5d6c8; --accent:#8a6246; --accent-soft:#f1e7de;
  --success:#2d7a4a; --success-soft:#e3ecdd; --error:#b34a4a; --error-soft:#f3e0da;
  --choco:#45301f; --choco-2:#5a3f2a; --choco-soft:#f1e7de; --on-choco:#fcf5ed;
  --sh-sm:0 6px 16px rgba(46,36,30,.05); --sh-md:0 8px 20px rgba(46,36,30,.07); --sh-lg:0 14px 36px rgba(46,36,30,.2);
  --r:10px; --r-sm:8px; --mono:'Space Mono','Courier New',monospace; --hand:'Caveat',cursive;
  color-scheme:light;
}
html,body{background:var(--paper)}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0 38px,var(--line) 38px 39px);background-attachment:local}
#themeBtn{display:none}
/* обложка: шапка */
.topbar,[data-theme="dark"] .topbar{background:var(--cover);border-bottom:3px solid var(--accent);box-shadow:0 4px 14px rgba(46,36,30,.25)}
body::before{background:var(--cover)!important}
.logo .full{font-family:var(--mono);font-weight:700;letter-spacing:.2px;color:var(--cover-text)}
.logo small{font-family:var(--hand);font-size:22.4px;color:var(--gold);font-weight:500}
.logo-mark{background:var(--gold);color:var(--cover);box-shadow:none;font-family:var(--mono)}
.pw{color:rgba(252,245,237,.75)}
.pbar{background:rgba(0,0,0,.25)}
.pfill{background:var(--gold)}
.ibtn{background:var(--cover-soft);border-color:rgba(255,255,255,.12);color:var(--cover-text)}
.book-tab{background:var(--cover-soft);color:var(--cover-text);border-color:rgba(255,255,255,.12)}
.book-tab.active{background:var(--paper);color:var(--ink);border-color:var(--gold)}
.book-tab .bt-name{font-family:var(--mono)}
/* обложка: оглавление */
.sidebar{background:var(--cover);border-radius:12px;padding:16px 10px 10px;border-left:3px solid var(--accent);box-shadow:var(--sh-md)}
.sidebar h3{font-family:var(--hand);text-transform:none;letter-spacing:0;font-size:26.4px;color:var(--gold);font-weight:700;padding-left:10px}
.sidebar::-webkit-scrollbar-thumb{background:var(--cover-soft)}
.nav-group{font-family:var(--hand);text-transform:none;letter-spacing:0;font-size:23.8px;color:var(--gold)!important;font-weight:700}
.nav-item{color:var(--cover-text);border-left:3px solid transparent;border-radius:8px}
.nav-item:hover{background:var(--cover-soft);color:#fff;border-color:transparent;border-left-color:transparent}
.nav-item.active{background:var(--cover-soft);color:#fff;font-weight:700;border-color:transparent;border-left:3px solid var(--gold)}
.nav-num,.nav-item.active .nav-num{background:rgba(255,255,255,.12);color:var(--cover-text);font-family:var(--mono);font-size:13.9px}
.nav-item.active .nav-num{background:var(--gold);color:var(--cover)}
.nav-item .nav-done{color:rgba(252,245,237,.6)}
.nav-item.topic-complete .nav-done{color:#b9dcb7}
.gr-reset button{color:var(--cover-text);border-color:rgba(255,255,255,.25)}
.gr-reset button:hover{color:#fff;border-color:var(--gold)}
/* лист: поле слева */
.content{border-left:2px solid var(--accent);padding-left:26px}
.topic-header{border-bottom:none;margin-bottom:22px}
.topic-header h2{display:inline-block;font-family:var(--mono);font-size:clamp(26.4px,3.4vw,35.6px);letter-spacing:.2px;color:var(--ink);

.topic-tag,[data-theme="dark"] .topic-tag{background:var(--cover);color:var(--cover-text);font-family:var(--mono);letter-spacing:.06em}
.rule{background:var(--card);border:1px solid var(--border);border-left:6px solid var(--gold);border-radius:0 10px 10px 0;box-shadow:var(--sh-sm)}
.rule-title{font-family:var(--mono);color:var(--accent);font-size:18.5px;letter-spacing:.4px}
.rule p{font-size:21.8px;line-height:1.6}
.rule-ex span{font-style:normal;font-family:var(--mono);font-size:19.2px;background:var(--paper-alt);border-radius:8px;padding:3px 12px;align-self:flex-start}
.rule-ex{gap:5px}
.pic-cell{background:var(--paper-alt);border-color:var(--border)}
.ex{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh-sm)}
.ex::before{display:none}
.ex-head{border-bottom:1px solid var(--border);padding-bottom:9px}
.ex-num{font-family:var(--mono);font-size:19.8px;color:var(--ink);text-transform:none;letter-spacing:0}
.ex-type{background:var(--paper-alt);color:var(--ink-soft);font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;font-size:16.6px;font-weight:500}
.ex.done .ex-type{background:var(--success-soft);color:var(--success)}
.ex .task{font-family:var(--hand);font-style:normal;font-size:25.1px;color:var(--ink-soft);line-height:1.3}
.mc-q,.ex p.mc-q{font-size:21.2px}
.opts li,.match-item,.word,button.word{font-family:var(--mono);font-size:18.5px;background:var(--paper-alt);border:1px solid var(--border);border-radius:30px;color:var(--ink)}
.match-item{border-radius:20px}
.opts li:hover,.match-item:hover,.words .word:hover{background:#ead9ca;border-color:var(--accent);color:var(--ink)}
.match-item.selected{background:var(--cover);border-color:var(--cover);color:var(--cover-text)}
.opts li.correct,.match-item.matched{background:var(--success-soft);border-color:var(--success);color:#1f5c34}
.opts li.incorrect,.match-item.wrong{background:var(--error-soft);border-color:var(--error);color:#5c2a22}
.slot{background:var(--paper);border:1.5px dashed var(--accent);border-radius:12px}
.slot .word,.slot button.word{background:var(--card)}
.ord-reset{border-radius:50%;background:var(--card)}
.toggle,.unit-nav .toggle{background:var(--cover);color:var(--cover-text);border:none;border-radius:30px;font-family:var(--mono);font-size:17.1px}
.toggle:hover,.unit-nav .toggle:hover{background:var(--cover-soft);color:#fff;transform:none}
.q-pic{filter:none}

<script>

const BOOKS = [
{key:"b1",tab:"B1–B2",sub:"Grammar Workbook",topics:[
{title:"Present Simple vs Present Continuous",sub:"Регулярные действия против действий прямо сейчас.",rule:`<b>Present Simple</b> — регулярные действия, факты: <i>I work every day.</i><br><b>Present Continuous</b> — действие прямо сейчас: <i>I am working now.</i><br>Маркеры: <i>always, usually, often, never</i> → Simple; <i>now, at the moment, today</i> → Continuous.`,
ex:[
{t:"order",task:"Расставьте слова в правильном порядке.",words:["usually","she","at 7","gets up"],a:"She usually gets up at 7."},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["are","they","now","watching","TV"],a:"They are watching TV now."},
{t:"choice",q:"Look! The baby ___ .",opts:["a) sleeps","b) is sleeping","c) sleep"],a:"b) is sleeping"},
{t:"choice",q:"My brother ___ football every Saturday.",opts:["a) play","b) is playing","c) plays"],a:"c) plays"},
{t:"match",task:"Соотнесите начало и окончание.",rows:[["1. I am reading","a. every morning."],["2. She goes to school","b. a book at the moment."],["3. We don't watch","c. TV in the evening."]],a:"1 — b, 2 — a, 3 — c"},
{t:"match",task:"Соотнесите вопрос и ответ.",rows:[["1. What are you doing?","a. Yes, she does."],["2. Does she like coffee?","b. I'm writing an email."],["3. Do they live here?","c. No, they don't."]],a:"1 — b, 2 — a, 3 — c"},
{t:"tf",q:"«She is knowing the answer» — правильное предложение.",a:"False. Глагол <i>know</i> не употребляется в Continuous. Правильно: <i>She knows the answer.</i>"},
{t:"tf",q:"«I am liking this song» — грамматически верно.",a:"False. <i>Like</i> — глагол состояния. Правильно: <i>I like this song.</i>"},
{t:"choice",q:"___ you always ___ breakfast?",opts:["a) Do / have","b) Are / having","c) Does / have"],a:"a) Do / have"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["doesn't","he","like","fish"],a:"He doesn't like fish."},
{t:"choice",q:"Water ___ at 100 degrees.",opts:["a) is boiling","b) boils","c) boil"],a:"b) boils"},
{t:"choice",q:"Why ___ you ___ that jacket today? It's so hot!",opts:["a) do / wear","b) are / wearing","c) does / wear"],a:"b) are / wearing"},
{t:"choice",q:"He usually ___ to work by bus, but today he ___ his car.",opts:["a) goes / drives","b) is going / drives","c) goes / is driving"],a:"c) goes / is driving"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["does","what","your father","do"],a:"What does your father do?"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["is","the sun","shining","today"],a:"The sun is shining today."},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["never","they","late","are"],a:"They are never late."},
{t:"match",task:"Соотнесите предложение и его значение.",rows:[["1. I live in Kyiv.","a. Постоянная ситуация."],["2. I am living with friends this week.","b. Временная ситуация."],["3. I am meeting Ann at 6 tomorrow.","c. Запланированное будущее."]],a:"1 — a, 2 — b, 3 — c"},
{t:"match",task:"Соотнесите начало и окончание.",rows:[["1. She usually drinks tea,","a. but today she is drinking coffee."],["2. Listen! Someone","b. is playing the piano."],["3. My sister works","c. in a bank."]],a:"1 — a, 2 — b, 3 — c"},
{t:"tf",q:"«He is having a shower now» — правильное предложение.",a:"True. <i>Have</i> в значении «принимать душ» — действие, поэтому Continuous возможен."},
{t:"tf",q:"«I am hating early mornings» — правильное предложение.",a:"False. <i>Hate</i> — глагол состояния. Правильно: <i>I hate early mornings.</i>"}
]},

{title:"Past Simple vs Past Continuous",sub:"Завершённое действие против процесса в прошлом.",rule:`<b>Past Simple</b> — завершённое действие: <i>I watched a film yesterday.</i><br><b>Past Continuous</b> — процесс в момент: <i>I was watching TV at 8 pm.</i><br>Часто вместе: <i>I was cooking when he came.</i>`,
ex:[
{t:"choice",q:"I ___ dinner when the phone rang.",opts:["a) cooked","b) was cooking","c) cook"],a:"b) was cooking"},
{t:"choice",q:"They ___ to Paris last summer.",opts:["a) were going","b) went","c) go"],a:"b) went"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["was","she","reading","at 10 pm"],a:"She was reading at 10 pm."},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["didn't","we","see","him","yesterday"],a:"We didn't see him yesterday."},
{t:"match",task:"Соотнесите начало и конец.",rows:[["1. I was walking home","a. when I met Ann."],["2. She called me","b. while I was sleeping."],["3. They were playing","c. football at 5 pm."]],a:"1 — a, 2 — b, 3 — c"},
{t:"match",task:"Соотнесите вопрос и ответ.",rows:[["1. What were you doing at 8?","a. Yes, I did."],["2. Did you finish the task?","b. I was studying."],["3. Where did they go?","c. They went to Rome."]],a:"1 — b, 2 — a, 3 — c"},
{t:"tf",q:"«While I was reading, he was cooking» — правильное предложение.",a:"True. Два одновременных процесса в прошлом."},
{t:"tf",q:"«I was knowing him for years» — верно.",a:"False. <i>Know</i> — глагол состояния. Правильно: <i>I knew him for years.</i>"},
{t:"choice",q:"While she ___ , the lights went out.",opts:["a) studied","b) was studying","c) studies"],a:"b) was studying"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["were","they","what","doing"],a:"What were they doing?"},
{t:"choice",q:"I ___ TV when the lights went out.",opts:["a) watched","b) was watching","c) watch"],a:"b) was watching"},
{t:"choice",q:"She ___ her keys yesterday morning.",opts:["a) was losing","b) lost","c) loses"],a:"b) lost"},
{t:"choice",q:"What ___ you ___ at 9 o'clock last night?",opts:["a) did / do","b) were / doing","c) are / doing"],a:"b) were / doing"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["was","it","raining","when","we","left"],a:"It was raining when we left."},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["did","where","you","go","yesterday"],a:"Where did you go yesterday?"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["weren't","they","listening","to the teacher"],a:"They weren't listening to the teacher."},
{t:"match",task:"Соотнесите начало и конец.",rows:[["1. I was having lunch","a. when Tom arrived."],["2. The phone rang","b. while we were watching the film."],["3. It was snowing","c. when I woke up."]],a:"1 — a, 2 — b, 3 — c"},
{t:"match",task:"Соотнесите предложение и время.",rows:[["1. She wrote a letter.","a. Past Simple"],["2. She was writing a letter.","b. Past Continuous"],["3. She has written a letter.","c. Present Perfect"]],a:"1 — a, 2 — b, 3 — c"},
{t:"tf",q:"«When I was walking home, I saw an accident» — правильное предложение.",a:"True. Процесс (<i>was walking</i>) прервало короткое действие (<i>saw</i>)."},
{t:"tf",q:"«She was wanting a new phone» — правильное предложение.",a:"False. <i>Want</i> — глагол состояния. Правильно: <i>She wanted a new phone.</i>"}
]},

{title:"Present Perfect vs Past Simple",sub:"Результат сейчас против конкретного времени в прошлом.",rule:`<b>Present Perfect</b> — результат важен сейчас, время не указано: <i>I have lost my keys.</i><br><b>Past Simple</b> — конкретное время: <i>I lost my keys yesterday.</i><br>Маркеры Perfect: <i>already, yet, just, ever, never, since, for</i>.`,
ex:[
{t:"choice",q:"I ___ my homework already.",opts:["a) did","b) have done","c) do"],a:"b) have done"},

{t:"order",task:"Расставьте слова в правильном порядке.",words:["has","she","just","arrived"],a:"She has just arrived."},
{t:"match",task:"Соотнесите предложение и время.",rows:[["1. I have seen this film.","a. Past Simple"],["2. We visited Rome last year.","b. Present Perfect"],["3. He has never eaten sushi.","c. Present Perfect"]],a:"1 — b, 2 — a, 3 — c"},
{t:"match",task:"Соотнесите вопрос и ответ.",rows:[["1. Have you finished?","a. Last Monday."],["2. When did you see him?","b. Yes, I have."],["3. How long have you lived here?","c. For five years."]],a:"1 — b, 2 — a, 3 — c"},
{t:"tf",q:"«I have seen him yesterday» — правильно.",a:"False. С <i>yesterday</i> — Past Simple: <i>I saw him yesterday.</i>"},
{t:"tf",q:"«She has already written the report» — правильно.",a:"True."},
{t:"choice",q:"They ___ here since 2020.",opts:["a) live","b) lived","c) have lived"],a:"c) have lived"},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["haven't","I","finished","yet"],a:"I haven't finished yet."},
{t:"choice",q:"___ you ever ___ sushi?",opts:["a) Did / eat","b) Have / eaten","c) Do / eat"],a:"b) Have / eaten"},
{t:"choice",q:"We ___ the museum last Sunday.",opts:["a) have visited","b) visited","c) visit"],a:"b) visited"},

{t:"order",task:"Расставьте слова в правильном порядке.",words:["haven't","we","seen","her","since Monday"],a:"We haven't seen her since Monday."},
{t:"order",task:"Расставьте слова в правильном порядке.",words:["did","when","you","buy","this car"],a:"When did you buy this car?"},

{t:"tf",q:"«Have you finished your homework yet?» — правильное предложение.",a:"True."}
]},

{title:"Past Perfect",sub:"Действие раньше другого действия в прошлом.",rule:`Форма: <b>had + V3</b>.<br>Пример: <i>When I arrived, they had already left.</i>`,

  let h = '<details class="rule-ext"><summary>📖 Подробное правило</summary>';
  if (r.form && r.form.length) {
    h += '<div class="rx-block"><div class="rx-title">Как образуется</div><div class="rx-scroll"><table class="rx-table">';
    const hasCols = r.form.some(f => f[2] || f[3]);
    if (hasCols) h += '<tr><th></th><th>+</th><th>−</th><th>?</th></tr>';
    r.form.forEach(f => {
      h += hasCols ? `<tr><td class="rx-name">${f[0]}</td><td>${f[1]}</td><td>${f[2]||""}</td><td>${f[3]||""}</td></tr>`
                   : `<tr><td class="rx-name">${f[0]}</td><td colspan="3">${f[1]}</td></tr>`;
    });
    h += '</table></div></div>';
  }
  if (r.use && r.use.length) {
    h += '<div class="rx-block"><div class="rx-title">Когда используется</div><ul class="rx-use">';
    r.use.forEach(u => { h += `<li><span class="rx-when">${u[0]}</span><span class="rx-ex">${u[1]}</span>${u[2] ? `<span class="rx-tr">${u[2]}</span>` : ""}</li>`; });
    h += '</ul></div>';
  }
  if (r.markers) h += `<div class="rx-block"><div class="rx-title">Слова-подсказки</div><p class="rx-markers">${r.markers}</p></div>`;
  if (r.mistakes && r.mistakes.length) {
    h += '<div class="rx-block"><div class="rx-title">Типичные ошибки</div><ul class="rx-mist">';
    r.mistakes.forEach(m => { h += `<li><span class="rx-bad">✗ ${m[0]}</span><span class="rx-good">✓ ${m[1]}</span>${m[2] ? `<span class="rx-note">${m[2]}</span>` : ""}</li>`; });
    h += '</ul></div>';
  }
  return h + '</details>';
}

function gfPics(text, max, exclude){
  const seen = new Set(exclude||[]), out = [];
  (text.toLowerCase().match(/[a-z]+/g)||[]).forEach(w=>{
    const e = GF_EMOJI[w];
    if(e && !seen.has(e)){ seen.add(e); out.push({w, e}); }
  });
  return out.slice(0, max);
}

function wbPic(t,ex){const p=gfPics(String(t).replace(/<[^>]+>/g," ").replace(/\(.*?\)/g,""),2,(ex||[]).map(o=>GF_EMOJI[String(o).replace(/^[a-d][).]\s*/i,"").toLowerCase()]).filter(Boolean)).map(x=>x.e).join("");return p?`<span class="q-pic" aria-hidden="true">${p}</span> `:"";}

const exData={}; // id -> исходные данные упражнения, чтобы проверять ответы без хранения их в DOM

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalize(s){
  return s.toLowerCase().replace(/[.,;:!?]+/g," ").replace(/\s+/g," ").trim();
}
function extractLetter(text){
  const m=text.trim().match(/^([a-zA-Z])\)/);
  return m?m[1].toLowerCase():null;
}
function parseMatchAnswer(a,n){
  const map=new Array(n).fill(null);
  const re=/(\d+)\s*[—-]\s*([a-zA-Zа-яА-Я]+)/g;
  let m;
  while((m=re.exec(a))!==null){
    const li=parseInt(m[1],10)-1;
    const ri=m[2].trim().toLowerCase().charCodeAt(0)-97;
    if(li>=0&&li<n&&ri>=0&&ri<n)map[li]=ri;
  }
  for(let i=0;i<n;i++){if(map[i]===null)map[i]=i;}
  return map;
}
/* прогресс: засчитывается только правильное решение без подсмотренного ответа */
const GR_KEY="grammarB1B2_progress";
let grSolved={}, grPeeked={};
try{const d=JSON.parse(localStorage.getItem(GR_KEY)||"{}");grSolved=d.solved||{};}catch(e){}
function grSave(){try{localStorage.setItem(GR_KEY,JSON.stringify({solved:grSolved}));}catch(e){}}
function markDone(id){
  const exEl=document.getElementById("ex-"+id);
  if(!exEl)return;
  if(grPeeked[id] && !grSolved[id]){ exEl.classList.add("peeked"); setExStatus(id,"Решено с подсказкой — пока не засчитано. Вернитесь к этому заданию позже (после перезагрузки) и решите сами."); return; }
  if(!grSolved[id]){ grSolved[id]=1; grSave(); }
  exEl.classList.add("done");
  setExStatus(id,"✓ Верно!");
  updateProgress();
}
function setExStatus(id,text,bad){
  const exEl=document.getElementById("ex-"+id); if(!exEl)return;
  let st=exEl.querySelector(".ex-status");
  if(!st){st=document.createElement("div");st.className="ex-status";exEl.querySelector(".ex-head").after(st);}
  st.textContent=text; st.classList.toggle("bad",!!bad);
}
function wrongTry(id){
  const exEl=document.getElementById("ex-"+id); if(!exEl)return;
  setExStatus(id,"✗ Неверно. Попробуйте ещё раз.",true);
  let rb=exEl.querySelector(".retry-btn");
  if(!rb){rb=document.createElement("button");rb.className="toggle retry-btn";rb.textContent="↻ Попробовать ещё";rb.onclick=()=>retryEx(id);exEl.querySelector(".toggle").before(rb);}
}
function retryEx(id){
  const exEl=document.getElementById("ex-"+id); const ex=exData[id];
  const ul=document.getElementById("opts-"+id);
  if(ul){ul.classList.remove("answered");Array.from(ul.children).forEach(li=>li.classList.remove("correct","incorrect"));}
  const tf=document.getElementById("tfb-"+id);
  if(tf){tf.classList.remove("answered");Array.from(tf.children).forEach(b=>b.classList.remove("correct","incorrect"));}
  if(ex.t==="order") resetOrder(id);
  const rb=exEl.querySelector(".retry-btn"); if(rb)rb.remove();
  const st=exEl.querySelector(".ex-status"); if(st && !grSolved[id]) st.remove();
  exEl.classList.remove("peeked");
}

function renderExercise(ex,i,tid){
  const id=`${tid}-e${i}`;
  exData[id]=ex;
  const head=`<div class="ex-head"><span class="ex-num">Exercise ${i+1}</span><span class="ex-type">${labels[ex.t]}</span></div>`;
  let body="";
  if(ex.t==="order"){
    const shuffled=shuffle(ex.words);
    body=`<p class="task">${wbPic(ex.a)}${ex.task}</p>
      <div class="slot" id="slot-${id}"></div>
      <div class="words" id="pool-${id}">${shuffled.map(w=>`<span class="word" onclick="pickWord('${id}',this)">${w}</span>`).join("")}</div>
      <div class="ex-actions"><button class="toggle" onclick="resetOrder('${id}')">Сбросить</button></div>`;
  } else if(ex.t==="choice"){
    body=`<p>${wbPic(ex.q,ex.opts)}${ex.q}</p><ul class="opts" id="opts-${id}">${ex.opts.map((o,oi)=>`<li onclick="selectChoice('${id}',${oi},this)">${o}</li>`).join("")}</ul>`;
  } else if(ex.t==="match"){
    const n=ex.rows.length;
    exData[id].correctMap=parseMatchAnswer(ex.a,n);
    const perm=shuffle(ex.rows.map((_,ri)=>ri));
    const leftCol=ex.rows.map((r,ri)=>`<div class="match-item" onclick="clickMatch('${id}','left',${ri},this)">${r[0]}</div>`).join("");
    const rightCol=perm.map((origIdx,pos)=>{
      const pure=ex.rows[origIdx][1].replace(/^[^.]*\.\s*/,"");
      const letter=String.fromCharCode(97+pos);
      return `<div class="match-item" onclick="clickMatch('${id}','right',${origIdx},this)">${letter}. ${pure}</div>`;
    }).join("");
    body=`<p class="task">${ex.task}</p><div class="match-cols" id="match-${id}"><div class="match-col">${leftCol}</div><div class="match-col">${rightCol}</div></div>`;
  } else {
    body=`<p class="tf">${ex.q}</p>
      <div class="tf-btns" id="tfb-${id}">
        <button class="tf-btn" onclick="selectTF('${id}',true,this)">True</button>
        <button class="tf-btn" onclick="selectTF('${id}',false,this)">False</button>
      </div>`;
  }
  return `<div class="ex" id="ex-${id}" data-type="${ex.t}">${head}${body}<button class="toggle" onclick="toggleAns(this,'${id}')">Показать ответ</button><div class="answers"><div>${ex.a}</div></div></div>`;
}

/* --- Word order --- */
function pickWord(id,el){
  if(el.classList.contains("placed"))return;
  const slot=document.getElementById("slot-"+id);
  if(slot.classList.contains("correct")||slot.classList.contains("incorrect"))return;
  el.classList.add("placed");
  const span=document.createElement("span");
  span.className="word";
  span.textContent=el.textContent;
  span.onclick=()=>{
    if(slot.classList.contains("correct")||slot.classList.contains("incorrect"))return;
    span.remove();
    el.classList.remove("placed");
  };
  slot.appendChild(span);
  checkOrderComplete(id);
}
function checkOrderComplete(id){
  const pool=document.getElementById("pool-"+id);
  const slot=document.getElementById("slot-"+id);
  if(pool.querySelectorAll(".word:not(.placed)").length>0)return;
  const built=Array.from(slot.children).map(c=>c.textContent).join(" ");
  const ok=normalize(built)===normalize(exData[id].a);
  slot.classList.add(ok?"correct":"incorrect");
  if(ok) markDone(id); else setExStatus(id,"✗ Порядок неверный. Нажмите «Сбросить» и попробуйте ещё раз.",true);
}
function resetOrder(id){
  const pool=document.getElementById("pool-"+id);
  const slot=document.getElementById("slot-"+id);
  slot.innerHTML="";
  slot.classList.remove("correct","incorrect");
  pool.querySelectorAll(".word").forEach(w=>w.classList.remove("placed"));
  const exEl=document.getElementById("ex-"+id); const st=exEl&&exEl.querySelector(".ex-status");
  if(st && !grSolved[id]) st.remove();
}

/* --- Multiple choice --- */
function selectChoice(id,idx,el){
  const ul=document.getElementById("opts-"+id);
  if(ul.classList.contains("answered"))return;
  ul.classList.add("answered");
  const answerRaw=exData[id].a.trim();
  const answerLetter=extractLetter(answerRaw);
  const items=Array.from(ul.children);
  const clickedLetter=extractLetter(el.textContent);
  const isCorrect = answerLetter && clickedLetter
    ? clickedLetter===answerLetter
    : el.textContent.trim()===answerRaw;
  if(isCorrect){
    el.classList.add("correct");
    markDone(id);
  } else {
    el.classList.add("incorrect");
    wrongTry(id);
  }
}

/* --- True / False --- */
function selectTF(id,val,el){
  const box=document.getElementById("tfb-"+id);
  if(box.classList.contains("answered"))return;
  box.classList.add("answered");
  const correct=exData[id].a.trim().toLowerCase().startsWith("true");
  if(val===correct){ el.classList.add("correct"); markDone(id); }
  else { el.classList.add("incorrect"); wrongTry(id); }
}

/* --- Matching --- */
const matchState={};
function clickMatch(id,side,idx,el){
  if(el.classList.contains("matched"))return;
  const state=matchState[id]||(matchState[id]={selIdx:null,selEl:null});
  if(side==="left"){
    if(state.selEl)state.selEl.classList.remove("selected");
    state.selIdx=idx;state.selEl=el;el.classList.add("selected");
  } else {
    if(state.selIdx===null)return;
    const correctRight=exData[id].correctMap[state.selIdx];
    if(idx===correctRight){
      el.classList.add("matched");el.classList.remove("selected");
      state.selEl.classList.add("matched");state.selEl.classList.remove("selected");
      state.selIdx=null;state.selEl=null;
      const container=document.getElementById("match-"+id);
      if(container.querySelectorAll(".match-item:not(.matched)").length===0)markDone(id);
    } else {
      el.classList.add("wrong");
      const selEl=state.selEl;
      setTimeout(()=>{
        el.classList.remove("wrong");
        if(selEl)selEl.classList.remove("selected");
      },450);
      state.selIdx=null;state.selEl=null;
    }
  }
}

    Object.keys(grSolved).forEach(k=>{
      const mm=k.match(/^(.*-t\d+)-e(\d+)$/); if(!mm) return;
      const nw=maps[mm[1]] && maps[mm[1]][+mm[2]];
      if(nw!==undefined) ns[mm[1]+"-e"+nw]=1;
    });
    grSolved=ns; grSave();
    try{localStorage.setItem(GR_KEY+":noTF","1");}catch(e){}
  }
})();

const content=document.getElementById("content");
const navHost=document.getElementById("navHost");
const tabsEl=document.getElementById("bookTabs");
let curBook=null;
BOOKS.forEach(bk=>{
  bk.total=bk.topics.reduce((s,t)=>s+t.ex.length,0);
  bk.last=bk.key+"-t1";
  const nav=document.createElement("div");
  nav.className="nav-list"; nav.id="nav-"+bk.key;
  bk.topics.forEach((t,i)=>{
    const tid=bk.key+"-t"+(i+1);
    content.appendChild(renderTopic(t,i+1,tid));
    const btn=document.createElement("button");
    btn.className="nav-item"; btn.dataset.id=tid;
    btn.innerHTML=`<span class="nav-num">${i+1}</span><span>${t.title}</span>`;
    btn.onclick=()=>showTopic(tid);
    nav.appendChild(btn);
  });
  navHost.appendChild(nav);
  const tab=document.createElement("button");
  tab.className="book-tab"; tab.dataset.key=bk.key;
  tab.setAttribute("role","tab");
  tab.innerHTML=`<span class="bt-name">${bk.tab}</span><span class="bt-sub">${bk.sub}</span><span class="bt-count" id="bc-${bk.key}">0/${bk.total}</span>`;
  tab.onclick=()=>switchBook(bk.key);
  tabsEl.appendChild(tab);
});
document.getElementById("logoSub").textContent=
  BOOKS.length+" workbooks · "+BOOKS.reduce((s,b)=>s+b.total,0)+" exercises";

/* ============ НАВИГАЦИЯ ============ */
function bookOf(id){return BOOKS.find(b=>id.startsWith(b.key+"-t"));}
function setBook(key){
  curBook=key;
  const bk=BOOKS.find(b=>b.key===key);
  document.querySelectorAll(".book-tab").forEach(t=>{
    const on=t.dataset.key===key;
    t.classList.toggle("active",on);
    t.setAttribute("aria-selected",on?"true":"false");
  });
  document.querySelectorAll(".nav-list").forEach(n=>n.classList.toggle("active",n.id==="nav-"+key));
  document.getElementById("sideTitle").textContent="Содержание · "+bk.tab;
  updateProgress();
}
function showTopic(id){
  const bk=bookOf(id);
  if(curBook!==bk.key)setBook(bk.key);
  bk.last=id;
  document.querySelectorAll(".topic").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  try{localStorage.setItem(GR_KEY+":last",id);}catch(e){}
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
  window.scrollTo({top:0,behavior:"smooth"});
}
function switchBook(key){
  if(curBook===key)return;
  showTopic(BOOKS.find(b=>b.key===key).last);
}
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}
function toggleAns(btn,id){
  const a=btn.nextElementSibling;
  a.classList.toggle("show");
  btn.textContent=a.classList.contains("show")?"Скрыть ответ":"Показать ответ";
  if(a.classList.contains("show") && !grSolved[id]){ grPeeked[id]=1; }
}

/* ============ ПРОГРЕСС ============ */
function updateProgress(){
  document.querySelectorAll(".nav-item").forEach(b=>{
    const tid=b.dataset.id; const n=document.querySelectorAll("#"+tid+" .ex").length;
    const d=Object.keys(grSolved).filter(k=>k.startsWith(tid+"-e")).length;
    let c=b.querySelector(".nav-done"); if(!c){c=document.createElement("span");c.className="nav-done";b.appendChild(c);}
    c.textContent=d===n?"✓":(d?d+"/"+n:"");
    b.classList.toggle("topic-complete",d===n);
  });
  BOOKS.forEach(bk=>{
    bk.done=Object.keys(grSolved).filter(k=>k.startsWith(bk.key+"-t")).length;
    const c=document.getElementById("bc-"+bk.key);
    if(c)c.textContent=bk.done+"/"+bk.total;
  });
  const bk=BOOKS.find(b=>b.key===curBook);
  if(!bk)return;
  const pct=Math.round(bk.done/bk.total*100);
  document.getElementById("pfill").style.width=pct+"%";
  document.getElementById("ptext").textContent=bk.done+"/"+bk.total;
}

/* ============ ТЕМА ============ */
function toggleTheme(){
  const html=document.documentElement;
  const cur=html.getAttribute("data-theme");
  const next=cur==="light"?"dark":"light";
  html.setAttribute("data-theme",next);
  document.getElementById("themeBtn").textContent=next==="dark"?"☀️":"🌙";
}
if(false){
  document.documentElement.setAttribute("data-theme","dark");
  document.getElementById("themeBtn").textContent="☀️";
}

/* старт */
Object.keys(grSolved).forEach(id=>{const e=document.getElementById("ex-"+id); if(e){e.classList.add("done"); setExStatus(id,"✓ Решено");}});
let grLast="b1-t1"; try{grLast=localStorage.getItem(GR_KEY+":last")||"b1-t1";}catch(e){}
if(!document.getElementById(grLast)) grLast="b1-t1";
BOOKS.forEach(bk=>{ if(grLast.startsWith(bk.key+"-t")) bk.last=grLast; });
showTopic(grLast);
(function(){
  const side=document.getElementById("sidebar"); if(!side)return;
  const w=document.createElement("div"); w.className="gr-reset";
  w.innerHTML='<button type="button">Сбросить прогресс</button>';
  w.querySelector("button").onclick=()=>{ if(!confirm("Сбросить весь прогресс?"))return; grSolved={};grPeeked={};grSave();location.reload(); };
  side.appendChild(w);
})();
</script>
</body>
</html>
