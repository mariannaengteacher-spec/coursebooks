<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English B2 — интерактивный курс</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font:"Times New Roman", Times, "Liberation Serif", serif;
    --bg:#EFE1D3;            /* latte */
    --bg-panel:#F9F1E8;      /* cream */
    --bg-sunken:#E2CDB8;
    --ink:#2B1810;           /* dark cocoa */
    --ink-soft:#6B4A37;      /* roasted brown */
    --choc-deep:#3B1F14;     /* dark chocolate */
    --accent:#A65A1E;        /* caramel */
    --accent-soft:#EBD3B9;
    --calm:#7B4A2E;          /* milk chocolate */
    --calm-soft:#EBD3B9;
    --gold:#3B1F14;
    --gold-soft:#3B1F14;
    --good:#5F7A45;
    --good-soft:#E6EBD6;
    --bad:#A63D2F;
    --bad-soft:#F3DAD2;
    --cream-text:#F6E9DA;
    --border:#D3B9A3;
    --white:#FFFAF4;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:21.2px;
    line-height:1.6;
  }
  h1,h2,h3{
    font-family:var(--font);
    font-weight:500;
    margin:0;
    line-height:1.15;
  }
  a{color:var(--accent);}
  .layout{
    display:grid;
    grid-template-columns:220px minmax(0,760px);
    gap:56px;
    max-width:1080px;
    margin:0 auto;
    padding:0 24px 120px;
    justify-content:center;
  }
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--choc-deep);
    border-bottom:1px solid var(--choc-deep);
  }
  .topbar-inner{
    max-width:1080px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    flex-wrap:wrap;
  }
  .brand{
    font-family:var(--font); font-weight:500; font-size:25.1px; letter-spacing:.2px;
  }
  .brand{ color:var(--cream-text); }
  .brand span{color:#E3A868;}
  .progress-wrap{
    display:flex; align-items:center; gap:10px; min-width:160px;
  }
  .progress-track{
    flex:1; height:6px; background:#5A3A2A; border-radius:99px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%; background:#E3A868; transition:width .5s ease;
  }
  .progress-label{ font-size:17.1px; color:#D6BBA3; white-space:nowrap;}

  /* unit tabs */
  .unit-tabs{
    max-width:1080px; margin:0 auto; padding:0 24px 14px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .unit-tab{
    font-family:inherit; font-size:17.1px; font-weight:600; color:var(--ink-soft);
    background:var(--bg-panel); border:1px solid var(--border); border-radius:99px;
    padding:7px 14px; cursor:pointer; white-space:nowrap;
  }
  .unit-tab:hover{ border-color:var(--calm); background:var(--accent-soft); color:var(--ink); }
  .unit-tab.active{ background:var(--choc-deep); color:var(--cream-text); border-color:var(--choc-deep); }
  .unit-tab .u-num{ opacity:.6; margin-right:5px; }

  /* side nav */
  .side-nav{ padding-top:40px; }
  .side-nav ol{ list-style:none; margin:0; padding:0; border-left:1px solid var(--border);}
  .side-nav li{ margin:0; }
  .side-nav a{
    display:flex; gap:10px; align-items:baseline;
    text-decoration:none; color:var(--ink-soft);
    padding:10px 0 10px 16px;
    margin-left:-1px;
    border-left:2px solid transparent;
    font-size:18.5px;
    transition:color .2s, border-color .2s;
  }
  .side-nav a .num{ font-family:var(--font); font-size:17.1px; color:var(--ink-soft); }
  .side-nav a.active{ color:var(--ink); border-left:2px solid var(--accent); font-weight:600;}
  .side-nav a.active .num{ color:var(--accent);}
  .side-nav a.done::after{ content:"✓"; margin-left:auto; color:var(--good); font-size:15.9px;}

  main{ padding-top:40px; min-width:0; }
  section{ padding:64px 0; border-bottom:1px solid var(--border); scroll-margin-top:90px; }
  section:last-of-type{ border-bottom:none; }

  .sec-head{ display:flex; gap:18px; align-items:flex-start; margin-bottom:22px;}
  .sec-num{ font-family:var(--font); font-size:19.8px; color:var(--accent); padding-top:6px; min-width:22px;}
  .sec-title h2{ font-size:37px; }
  .sec-title h2::after{ content:""; display:block; width:56px; height:3px; margin-top:12px; border-radius:2px; background:var(--accent); }
  .sec-title .sub{ color:var(--ink-soft); font-size:19.8px; margin-top:6px; max-width:56ch;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px 26px;
  }
  .card + .card{ margin-top:14px; }

  .qlist{ list-style:none; margin:0; padding:0; }
  .qlist li{
    padding:16px 0; border-top:1px solid var(--border);
    font-size:22.4px;
  }
  .qlist li:first-child{ border-top:none; }

  .vocab-grid{ display:flex; flex-direction:column; }
  .vocab-row{
    display:grid; grid-template-columns:160px 1fr 150px;
    gap:16px; padding:14px 0; border-top:1px solid var(--border);
    align-items:baseline;
  }
  .vocab-row:first-child{ border-top:none; }
  .vocab-word{ font-weight:600; }
  .vocab-word small{ display:block; font-weight:400; color:var(--ink-soft); font-size:16.6px; margin-top:2px;}
  .vocab-def{ color:var(--ink-soft); font-size:19.2px; }
  .vocab-ru{ color:var(--accent); font-size:19.2px; text-align:right;}

  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
  .match-col{ display:flex; flex-direction:column; gap:10px; }
  .match-item{
    text-align:left; padding:12px 14px; border:1px solid var(--border);
    background:var(--white); border-radius:var(--radius); cursor:pointer;
    font-size:19.2px; font-family:inherit; color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .match-item:hover{ border-color:var(--calm); }
  .match-item.selected{ border-color:var(--choc-deep); background:var(--choc-deep); color:var(--cream-text); }
  .match-item.correct{ border-color:var(--good); background:var(--good-soft); cursor:default; }
  .match-item.wrong{ border-color:var(--bad); background:var(--bad-soft); animation:shake .3s; }
  @keyframes shake{ 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
  .match-status{ font-size:17.1px; color:var(--ink-soft); margin-top:14px; min-height:18px;}

  .reading{ font-size:23.1px; }
  .reading p{ margin:0 0 16px; }
  .reading b{ color:var(--accent); font-weight:600; }

  .mcq{ margin-bottom:22px; }
  .mcq:last-child{ margin-bottom:0; }
  .mcq p.stem{ font-weight:600; margin:0 0 10px; }
  .mcq .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt-btn{
    text-align:left; padding:10px 14px; border:1px solid var(--border);
    background:var(--white); border-radius:var(--radius); cursor:pointer;
    font-family:inherit; font-size:19.2px; color:var(--ink);
  }
  .opt-btn:hover{ border-color:var(--calm); }
  .opt-btn.correct{ border-color:var(--good); background:var(--good-soft); }
  .opt-btn.wrong{ border-color:var(--bad); background:var(--bad-soft); }
  .opt-btn:disabled{ cursor:default; }

  .bank{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; padding-bottom:20px;
    border-bottom:1px dashed var(--border);
  }
  .bank-word{
    padding:6px 12px; border:1px solid var(--border); border-radius:99px;
    font-size:17.8px; color:var(--ink-soft); background:var(--white);
  }
  .bank-word.used{ opacity:.35; text-decoration:line-through; }
  .gap-item{ margin-bottom:14px; font-size:20.5px; }
  .gap-item input{
    font-family:inherit; font-size:19.2px; border:none; border-bottom:2px solid var(--border);
    background:transparent; padding:2px 4px; width:160px; color:var(--ink); text-align:center;
  }
  .gap-item input:focus{ outline:none; border-color:var(--calm); }
  .gap-item input.correct{ border-color:var(--good); color:var(--good); font-weight:600; }
  .gap-item input.wrong{ border-color:var(--bad); color:var(--bad); }
  .check-row{ display:flex; align-items:center; gap:14px; margin-top:18px; }
  .btn{
    font-family:inherit; font-weight:600; font-size:18.5px; letter-spacing:.2px;
    background:var(--choc-deep); color:var(--cream-text); border:none; padding:11px 24px;
    border-radius:99px; cursor:pointer; box-shadow:0 3px 0 var(--accent); transition:all .15s;
  }
  .btn:hover{ background:var(--calm); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--accent); }
  .fb{ font-size:18.5px; color:var(--ink-soft); }

  .g-note{ font-size:19.8px; color:var(--ink-soft); margin-bottom:20px; }
  .g-note strong{ color:var(--ink); }
  table.verbs{ border-collapse:collapse; width:100%; margin:14px 0 22px; font-size:18.5px; }
  table.verbs th, table.verbs td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  table.verbs th{ color:var(--ink-soft); font-weight:600; font-size:16.6px; text-transform:none; }

  footer{ text-align:center; color:var(--ink-soft); font-size:17.1px; padding:40px 24px 10px; }

  @media (max-width: 860px){
    .layout{ grid-template-columns:1fr; gap:0; padding:0 18px 100px;}
    .side-nav{ display:none; }
    .vocab-row{ grid-template-columns:1fr; gap:4px; }
    .vocab-ru{ text-align:left; }
    .match-wrap{ grid-template-columns:1fr; gap:10px;}
  }
:root{--bg:#F5ECE1;--bg-panel:#FCF8F2;--bg-sunken:#E8D6C2;--border:#DCC8B5}
.topbar-inner,.unit-tabs{max-width:820px}
.unit-tabs{justify-content:center}
.layout{grid-template-columns:minmax(0,760px);gap:0;justify-content:center;padding:0 20px 100px}
.side-nav{display:block!important;padding:20px 0 0}
.side-nav ol{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.side-nav a{padding:6px 14px;margin:0;border:1px solid var(--border);border-radius:99px;font-size:17.8px}
.side-nav a.active{background:var(--choc-deep);color:var(--cream-text);border-color:var(--choc-deep)}
.side-nav a.active .num{color:#E3A868}
.side-nav a.done::after{margin-left:8px}
main{padding-top:8px}
</style>
<style>
/* ===== UNIFIED LAYER (shared by all three books) ===== */
:root{--u-font:"Times New Roman",Times,"Liberation Serif",serif;--u-bg:#F5ECE1;--u-panel:#FCF8F2;--u-field:#FFFAF4;--u-line:#DCC8B5;--u-ink:#2B1810;--u-soft:#6B4A37;--u-choc:#3B1F14;--u-cocoa:#7B4A2E;--u-caramel:#A65A1E;--u-cream:#F6E9DA;--u-good:#5F7A45;--u-good-soft:#E6EBD6;--u-bad:#A63D2F;--u-bad-soft:#F3DAD2;--u-r:10px}
html{scroll-behavior:smooth}
body{font-family:var(--u-font);font-size:21.2px;line-height:1.6;color:var(--u-ink);background:var(--u-bg)}
button,input,select,textarea{font-family:var(--u-font)}

/* unit heading */
.unit-head h1,.unit-head h2{font-family:var(--u-font);font-size:42.3px;font-weight:500;font-style:normal;line-height:1.15;margin:4px 0 10px;color:var(--u-choc)}
.unit-head h1::after,.unit-head h2::after{content:"";display:block;width:56px;height:3px;margin-top:12px;border-radius:2px;background:var(--u-caramel)}
.unit-head p{font-size:20.5px;color:var(--u-soft);max-width:60ch;margin:0 0 18px}
.unit-head .kicker,.unit-head .unum{font-size:17.8px;font-style:italic;color:var(--u-caramel);margin:0}

/* section heading: caramel bar */
section h3,.block h2,.sec-title h2{font-family:var(--u-font);font-size:29.1px;font-weight:500;line-height:1.25;color:var(--u-choc);margin:0 0 14px;padding-left:14px;border-left:4px solid var(--u-caramel)}
.sec-title h2::after{display:none}
.sec-num{display:none}
.sec-head{display:block;margin:0 0 18px}
.sec-head .sec-title h2{margin-bottom:6px}
section > p.lede{margin:-8px 0 16px}
section > p.lede,.block-sub,.sec-title .sub{font-size:19.2px;color:var(--u-soft);max-width:none;padding-left:0}
.block-sub{margin:-8px 0 16px}
.sec-title .sub{margin:0}
section{padding:0;margin:0 0 52px;border:0;scroll-margin-top:90px}
.block{margin-bottom:52px}

/* cards */
.card,.explainer,.passage,.route-card,.grammar-box .panel{background:var(--u-panel);border:1px solid var(--u-line);border-radius:var(--u-r)}
.card{padding:22px 26px}
.passage{padding:22px 26px;max-width:none}
.explainer{border-left:3px solid var(--u-cocoa);padding:16px 20px;font-size:20.5px}
.reading,.passage{font-family:var(--u-font);font-size:22.4px;line-height:1.75}
.reading p,.passage p{margin:0 0 16px}

/* buttons */
button.check,.btn{font-family:var(--u-font);font-size:19.8px;font-weight:600;letter-spacing:0;background:var(--u-choc);color:var(--u-cream);border:0;padding:10px 24px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--u-caramel);transition:all .15s}
button.check:hover,.btn:hover{background:var(--u-cocoa)}
button.check:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--u-caramel)}
.score,.fb,.score-badge,.match-status,.word-count,.save-note{font-size:18.5px;color:var(--u-soft)}

/* text fields */
textarea{width:100%;font-family:var(--u-font);font-size:20.5px;line-height:1.5;color:var(--u-ink);background:var(--u-field);border:1px solid var(--u-line);border-radius:6px;padding:10px 12px;resize:vertical}
.exercise-row select,.exercise-row input[type=text]{font-family:var(--u-font);font-size:20.5px;padding:6px 10px;border:1px solid var(--u-line);border-radius:6px;background:var(--u-field);color:var(--u-ink)}
.exercise-row{font-size:21.2px}
.comp-q p.q,.mcq p.stem,.q-text,.prompt-title{font-size:21.2px;font-weight:600;color:var(--u-ink)}
.gap-item{font-size:21.2px}

/* options / mcq */
.opt-btn,.opt,.pill{font-family:var(--u-font);font-size:20.5px;padding:10px 14px;border:1px solid var(--u-line);border-radius:8px;background:var(--u-field);color:var(--u-ink);cursor:pointer}
.pill{border-radius:999px;padding:7px 16px}
.opt-btn:hover,.opt:hover,.pill:hover{border-color:var(--u-cocoa)}
.opt-btn.correct,.opt.correct{border-color:var(--u-good);background:var(--u-good-soft);color:var(--u-ink)}
.opt-btn.wrong,.opt.wrong{border-color:var(--u-bad);background:var(--u-bad-soft);color:var(--u-ink)}
.pill.correct{border-color:var(--u-good);background:var(--u-good-soft);color:var(--u-good);font-weight:600}
.pill.incorrect{border-color:var(--u-bad);background:var(--u-bad-soft);color:var(--u-bad)}

/* matching */
.match-col{gap:8px}
.match-item{font-family:var(--u-font);font-size:20.5px;padding:10px 14px;border:1px solid var(--u-line);border-radius:8px;background:var(--u-field);color:var(--u-ink);cursor:pointer;text-align:left}
.match-item:hover{border-color:var(--u-cocoa)}
.match-item.selected{border-color:var(--u-choc);background:var(--u-choc);color:var(--u-cream)}
.match-item.matched,.match-item.correct,.match-item.solved{border-color:var(--u-good);background:var(--u-good-soft);color:var(--u-ink);cursor:default;opacity:1}
.match-item.wrong{border-color:var(--u-bad);background:var(--u-bad-soft);color:var(--u-ink)}

/* word bank chips */
.word-chip,.bank-word,.chip{font-family:var(--u-font);font-size:19.8px;font-weight:400;padding:6px 14px;border:1px solid var(--u-line);border-radius:999px;background:var(--u-field);color:var(--u-ink)}
.word-chip:hover,.chip:hover{border-color:var(--u-cocoa);background:#EBD3B9}
.word-chip.selected{border-color:var(--u-choc);background:var(--u-choc);color:var(--u-cream)}
.word-chip.used,.chip.used,.bank-word.used{opacity:.3}
.word-bank,.bank{display:flex;flex-wrap:wrap;gap:8px}

/* blanks */
.blank{font-family:var(--u-font);font-size:21.2px;font-weight:600;color:var(--u-choc);min-width:120px;text-align:center}
.blank.filled{border-radius:3px}

/* vocab */
.vocab-term{font-size:20.5px;border-radius:var(--u-r)}
.vocab-term .def{font-size:19.2px}
.flash-face{border-radius:var(--u-r)}
.flash-term{font-size:23.8px}

/* grammar */
.grammar-box li{font-size:19.2px}
.grammar-box .formula,.ex-title{font-size:18.5px}
.g-note{font-size:20.5px}
table.verbs{font-size:19.8px}

/* level-2 pill navigation (jump-to sections / tabs) */
.unit-toc button,.unit-tab,.side-nav a,.tab-btn{font-family:var(--u-font);font-size:19.2px;font-weight:500}

.topbar{position:sticky;top:0;z-index:30;background:var(--u-choc);border-bottom:1px solid var(--u-choc)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{font-family:var(--u-font);font-size:26.4px;font-weight:500;font-style:normal;letter-spacing:.2px;color:var(--u-cream);margin:0}
.brand span{color:#E3A868}
.progress-wrap{display:flex;align-items:center;gap:10px;min-width:160px}
.progress-track{flex:1;height:6px;min-width:80px;background:#5A3A2A;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:#E3A868;transition:width .5s ease}
.progress-label{font-size:17.1px;color:#D6BBA3;white-space:nowrap}
.unit-tabs{max-width:1124px;width:calc(100% - 56px);margin:20px auto 0;padding:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--u-panel);border:1px solid var(--u-line);border-radius:12px}
.unit-tab{font-family:var(--u-font);font-size:19.2px;font-weight:500;color:var(--u-soft);background:transparent;border:1px solid var(--u-line);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.unit-tab:hover{background:#EBD3B9;color:var(--u-ink);border-color:var(--u-cocoa)}
.unit-tab.active{background:var(--u-choc);color:var(--u-cream);border-color:var(--u-choc)}
.unit-tab .u-num{opacity:.6;margin-right:5px}
.layout{display:block;max-width:1180px;margin:0 auto;padding:0 28px 100px}
.side-nav{display:block!important;padding:18px 0 0}
.side-nav ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;border:0;background:transparent}
.side-nav a{display:inline-flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--u-soft);background:var(--u-panel);border:1px solid var(--u-line);border-radius:99px;padding:6px 14px;margin:0;font-size:19.2px;transition:all .15s}
.side-nav a .num{font-size:17.1px;color:var(--u-soft)}
.side-nav a:hover{background:#EBD3B9;border-color:var(--u-cocoa)}
.side-nav a.active{background:var(--u-choc);color:var(--u-cream);border-color:var(--u-choc)}
.side-nav a.active .num{color:#E3A868}
.side-nav a.done::after{content:"\2713";margin:0 0 0 2px;color:var(--u-good);font-size:15.9px}
.side-nav a.active.done::after{color:#BFD7A0}
main{padding-top:28px;min-width:0}
main section{padding:0 0 52px;margin:0 0 52px;border:0;border-bottom:1px solid var(--u-line)}
main section:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
footer{text-align:center;color:var(--u-soft);font-size:18.5px;padding:40px 24px 10px}
.match-wrap{max-width:none;gap:0 32px}
.card{padding:24px 30px}

.qlist li{font-size:23.8px}
.vocab-row{font-size:21.2px}
.vocab-def,.vocab-ru{font-size:19.8px}
.sec-head .sub{margin-top:0}


.unit-art{margin:0 0 16px;border-radius:12px;overflow:hidden;border:1px solid #D3B9A3;background:#F3E6D8;}
.unit-art-svg{display:block;width:100%;height:auto;}

const STORE = 'wayfinder-b2';
const KEYS = ['mcq','fill','correct','match','cloze','reading'];
const SECTIONS = [
  {id:'s1', label:'Warm-up',    keys:[]},
  {id:'s2', label:'Grammar',    keys:['mcq','fill','correct']},
  {id:'s3', label:'Vocabulary', keys:['match','cloze']},
  {id:'s4', label:'Reading',    keys:['reading']},
  {id:'s5', label:'Writing',    keys:[]}
];
function load(k){ try{ return JSON.parse(localStorage.getItem(STORE+':'+k)) || {}; }catch(e){ return {}; } }
function store(k,v){ try{ localStorage.setItem(STORE+':'+k, JSON.stringify(v)); }catch(e){} }
let saved = load('progress');
let drafts = load('writing');
let activeIdx = 0;

const pad2 = n => String(n).padStart(2,'0');
const unitState = i => (saved[UNITS[i].id] = saved[UNITS[i].id] || {});
function unitPct(i){ const s = saved[UNITS[i].id] || {}; return Math.round(KEYS.filter(k=>s[k]).length / KEYS.length * 100); }
function coursePct(){ return Math.round(UNITS.reduce((a,_,i)=>a+unitPct(i),0) / UNITS.length); }
function markDone(key){ unitState(activeIdx)[key] = true; store('progress', saved); updateProgress(); }
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

/* =========================================================
   PROGRESS UI
   ========================================================= */
function renderTabs(){
  const bar = document.getElementById('unitTabs');
  bar.innerHTML = UNITS.map((u,i)=>{
    const pct = unitPct(i);
    const mark = pct===100 ? '<span class="u-pct">✓</span>' : (pct ? `<span class="u-pct">${pct}%</span>` : '');
    return `<button type="button" class="unit-tab ${i===activeIdx?'active':''} ${pct===100?'unit-complete':''}" data-idx="${i}"><span class="u-num">${pad2(i+1)}</span>${u.title}${mark}</button>`;
  }).join('');
  bar.querySelectorAll('.unit-tab').forEach(b=> b.addEventListener('click', ()=> loadUnit(+b.dataset.idx)));
  const act = bar.querySelector('.unit-tab.active');
  if(act && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = act.offsetLeft - bar.clientWidth/2 + act.offsetWidth/2;
}
function updateProgress(){
  const pct = unitPct(activeIdx);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `<b>Юнит ${activeIdx+1}: ${pct}%</b><span class="course-pct"> · весь курс ${coursePct()}%</span>`;
  const s = saved[UNITS[activeIdx].id] || {};
  SECTIONS.forEach(sec=>{
    const done = sec.keys.length && sec.keys.every(k=>s[k]);
    const a = document.querySelector(`.side-nav a[href="#${sec.id}"]`);
    if(a) a.classList.toggle('done', !!done);
    const el = document.getElementById(sec.id);
    if(el) el.classList.toggle('sec-done', !!done);
  });
  renderTabs();
}

/* =========================================================
   EXERCISE BUILDERS
   ========================================================= */
function buildMcq(box, items, key){
  box.innerHTML = '';
  let answered = 0, correct = 0;
  items.forEach((item, idx)=>{
    const div = document.createElement('div');
    div.className = 'mcq';
    div.innerHTML = `<p class="stem">${idx+1}. ${item.q || ''}</p><div class="opts">${item.options.map((o,i)=>`<button type="button" class="opt-btn" data-i="${i}">${o}</button>`).join('')}</div>`;
    box.appendChild(div);
    const buttons = div.querySelectorAll('.opt-btn');
    buttons.forEach(btn=> btn.addEventListener('click', ()=>{
      const i = +btn.dataset.i;
      buttons.forEach(b=> b.disabled = true);
      if(i === item.a){ btn.classList.add('correct'); correct++; }
      else { btn.classList.add('wrong'); buttons[item.a].classList.add('correct'); }
      answered++;
      if(answered === items.length){
        if(correct === items.length){
          result.innerHTML = `<span class="fb fb-good">Все ответы верные: ${correct} из ${items.length} ✓</span>`;
          markDone(key);
        } else {
          result.innerHTML = `<button class="btn" type="button">Пройти ещё раз</button><span class="fb">Верно: ${correct} из ${items.length}. Раздел засчитается, когда все ответы будут верными.</span>`;
          result.querySelector('button').addEventListener('click', ()=> buildMcq(box, items, key));
        }
      }
    }));
  });
  const result = document.createElement('div');
  result.className = 'check-row mcq-result';
  if((saved[UNITS[activeIdx].id]||{})[key]) result.innerHTML = '<span class="fb fb-good">Раздел уже пройден ✓ Можно повторить.</span>';
  box.appendChild(result);
}

function buildFill(u){
  const list = document.getElementById('fillList');
  const bank = document.getElementById('fillBank');
  const fb = document.getElementById('fillFb');
  const done = !!(saved[u.id]||{}).fill;
  let selected = null, filled = 0;
  list.innerHTML = u.grammar.fill.map((f,fi)=>{
    const [before, after] = f.text.split('___');
    return `<p class="gap-line">${fi+1}. ${before}<button type="button" class="blank" data-fi="${fi}" aria-label="Пропуск ${fi+1}">&nbsp;</button>${after}</p>`;
  }).join('');
  bank.innerHTML = shuffle(u.grammar.fill.map(f=>f.answer)).map(w=>`<button type="button" class="chip" data-w="${w.replace(/"/g,'&quot;')}">${w}</button>`).join('');
  const fillBlank = (blank, word, chip)=>{
    blank.textContent = word; blank.classList.add('filled'); blank.disabled = true;
    if(chip){ chip.classList.add('used'); chip.classList.remove('selected'); chip.disabled = true; }
    filled++;
  };
  if(done){
    list.querySelectorAll('.blank').forEach(b=>{
      const w = u.grammar.fill[+b.dataset.fi].answer;
      fillBlank(b, w, [...bank.querySelectorAll('.chip')].find(c=>c.dataset.w===w && !c.disabled));
    });
    fb.innerHTML = '<span class="fb-good">Раздел уже пройден ✓</span>';
    return;
  }
  bank.querySelectorAll('.chip').forEach(c=> c.addEventListener('click', ()=>{
    bank.querySelectorAll('.chip').forEach(x=> x!==c && x.classList.remove('selected'));
    c.classList.toggle('selected');
    selected = c.classList.contains('selected') ? c : null;
    fb.textContent = selected ? 'Теперь нажмите на пропуск.' : '';
  }));
  list.querySelectorAll('.blank').forEach(b=> b.addEventListener('click', ()=>{
    if(!selected){ fb.textContent = 'Сначала выберите слово из списка.'; return; }
    const ans = u.grammar.fill[+b.dataset.fi].answer;
    if(selected.dataset.w === ans){
      fillBlank(b, ans, selected); selected = null; fb.textContent = '';
      if(filled === u.grammar.fill.length){ fb.innerHTML = '<span class="fb-good">Все пропуски заполнены верно ✓</span>'; markDone('fill'); }
    } else {
      b.classList.add('wrong'); setTimeout(()=> b.classList.remove('wrong'), 400);
      fb.textContent = 'Не подходит — попробуйте другой пропуск.';
    }
  }));
}

function buildMatch(u){
  const words = u.vocab.matchPairs.map(i=>u.vocab.words[i]);
  const tCol = document.getElementById('matchTerms');
  const dCol = document.getElementById('matchDefs');
  const status = document.getElementById('matchStatus');
  tCol.innerHTML = words.map((w,i)=>`<button type="button" class="match-item" data-i="${i}">${w.term}</button>`).join('');
  dCol.innerHTML = shuffle(words.map((w,i)=>({w,i}))).map(o=>`<button type="button" class="match-item" data-i="${o.i}">${o.w.def}</button>`).join('');
  if((saved[u.id]||{}).match){
    document.querySelectorAll('#matchTerms .match-item, #matchDefs .match-item').forEach(el=>{ el.classList.add('correct'); el.disabled = true; });
    status.innerHTML = '<span class="fb-good">Раздел уже пройден ✓</span>';
    return;
  }
  let sel = null, solved = 0;
  tCol.querySelectorAll('.match-item').forEach(t=> t.addEventListener('click', ()=>{
    tCol.querySelectorAll('.match-item').forEach(x=> x.classList.remove('selected'));
    t.classList.add('selected'); sel = t;
  }));
  dCol.querySelectorAll('.match-item').forEach(d=> d.addEventListener('click', ()=>{
    if(!sel){ status.textContent = 'Сначала выберите слово слева.'; return; }
    if(sel.dataset.i === d.dataset.i){
      [sel,d].forEach(el=>{ el.classList.remove('selected'); el.classList.add('correct'); el.disabled = true; });
      sel = null; solved++;
      status.textContent = `Найдено пар: ${solved} из ${words.length}`;
      if(solved === words.length){ status.innerHTML = '<span class="fb-good">Все пары найдены ✓</span>'; markDone('match'); }
    } else {
      d.classList.add('wrong'); setTimeout(()=> d.classList.remove('wrong'), 400);
    }
  }));
}

function buildFlip(){
  const grid = document.getElementById('vocabGrid');
  grid.querySelectorAll('.flip-card').forEach(c=> c.addEventListener('click', ()=>{
    const on = c.classList.toggle('flipped');
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
  }));
  const all = document.getElementById('flipAllBtn');
  all.addEventListener('click', ()=>{
    const cards = grid.querySelectorAll('.flip-card');
    const show = [...cards].some(c=> !c.classList.contains('flipped'));
    cards.forEach(c=>{ c.classList.toggle('flipped', show); c.setAttribute('aria-pressed', show ? 'true' : 'false'); });
    all.textContent = show ? 'Скрыть переводы' : 'Показать все переводы';
  });
}

function buildWriting(u){
  document.querySelectorAll('textarea[data-wp]').forEach(ta=>{
    const k = u.id + ':' + ta.dataset.wp;
    const counter = document.querySelector(`[data-wc="${ta.dataset.wp}"]`);
    const count = ()=>{ const t = ta.value.trim(); counter.textContent = (t ? t.split(/\s+/).length : 0) + ' слов · сохраняется автоматически'; };
    ta.value = drafts[k] || ''; count();
    ta.addEventListener('input', ()=>{ drafts[k] = ta.value; store('writing', drafts); count(); });
  });
}

/* =========================================================
   UNIT PAGE
   ========================================================= */
function head(label, sub){
  return `<div class="sec-head"><div class="sec-title"><h2>${label}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`;
}
function loadUnit(idx){
  activeIdx = idx;
  try{ localStorage.setItem(STORE+':last', String(idx)); }catch(e){}
  const u = UNITS[idx];
  document.getElementById('sideNav').innerHTML = SECTIONS.map((s,i)=>`<li><a href="#${s.id}"><span class="num">${pad2(i+1)}</span>${s.label}</a></li>`).join('');
  document.getElementById('mainContent').innerHTML = `
  <div class="unit-head"><p class="unum">Unit ${pad2(idx+1)} · ${u.theme}</p><h1>${u.title}</h1><p>${u.grammar.point}</p></div>

  <section id="s1">
    ${head('Warm-up','Два вопроса, чтобы настроиться на тему. Обсудите с преподавателем или ответьте для себя.')}
    <div class="warm-row${B2_ART[u.id]?' has-art':''}">${B2_ART[u.id]?`<figure class="unit-art">${B2_ART[u.id]}<figcaption>Look at the picture. What can you see? How is it connected to the topic?</figcaption></figure>`:''}<div class="card"><ul class="qlist">${u.preview.map(q=>`<li>${q}</li>`).join('')}</ul></div></div>
  </section>

  <section id="s2">
    ${head('Grammar', 'Правило и три упражнения на него.')}
    <div class="explainer">${u.grammar.explain}</div>
    <h4 class="sub-h">Quick check</h4>
    <p class="hint">Выберите правильную форму глагола.</p>
    <div class="card" id="gMcq"></div>
    <h4 class="sub-h">Fill the gaps</h4>
    <p class="hint">Нажмите на слово, затем на пропуск, куда оно подходит.</p>
    <div class="card">
      <div class="bank" id="fillBank"></div>
      <div id="fillList"></div>
      <div class="check-row"><span class="fb" id="fillFb"></span></div>
    </div>
    <h4 class="sub-h">Spot the correct sentence</h4>
    <p class="hint">Только один вариант грамматически верный.</p>
    <div class="card" id="gCorrect"></div>
  </section>

  <section id="s3">
    ${head('Vocabulary', `${u.vocab.words.length} слов по теме. Нажмите на карточку, чтобы увидеть перевод.`)}
    <div class="flip-tools"><button type="button" class="flip-all" id="flipAllBtn">Показать все переводы</button></div>
    <div class="flip-grid" id="vocabGrid">${u.vocab.words.map(w=>`
      <button type="button" class="flip-card" aria-pressed="false"><span class="flip-inner">
        <span class="flip-face flip-front"><span class="fc-w">${w.term}</span></span>
        <span class="flip-face flip-back"><span class="fc-ru">${w.ru}</span><span class="fc-def">${w.def}</span><span class="fc-ex">${w.ex}</span></span>
      </span></button>`).join('')}</div>
    <h4 class="sub-h">Match the pairs</h4>
    <p class="hint">Нажмите на слово слева, затем на его значение справа.</p>
    <div class="card"><div class="match-wrap"><div class="match-col" id="matchTerms"></div><div class="match-col" id="matchDefs"></div></div><div class="match-status" id="matchStatus"></div></div>
    <h4 class="sub-h">Choose the right word</h4>
    <p class="hint">Выберите слово, которое подходит по смыслу.</p>
    <div class="card" id="vCloze"></div>
  </section>

  <section id="s4">
    ${head('Reading', 'Прочитайте текст и ответьте на вопросы.')}
    <div class="card reading"><h4 class="read-title">${u.reading.title}</h4><p>${u.reading.text}</p></div>
    <h4 class="sub-h">Comprehension</h4>
    <div class="card" id="rMcq"></div>
  </section>

  <section id="s5">
    ${head('Writing', 'Ориентир — 100–150 слов. Текст сохраняется на этом устройстве.')}
    ${u.writing.prompts.map((p,pi)=>`<div class="write-item"><p class="prompt-title">${pi+1}. ${p}</p><textarea data-wp="${pi}" rows="6" placeholder="Write your answer here..."></textarea><div class="word-count" data-wc="${pi}"></div></div>`).join('')}
  </section>`;

  buildMcq(document.getElementById('gMcq'), u.grammar.mcq, 'mcq');
  buildFill(u);
  buildMcq(document.getElementById('gCorrect'), u.grammar.correct, 'correct');
  buildFlip();
  buildMatch(u);
  buildMcq(document.getElementById('vCloze'), u.vocab.cloze, 'cloze');
  buildMcq(document.getElementById('rMcq'), u.reading.q, 'reading');
  buildWriting(u);
  updateProgress();
  window.scrollTo(0,0);
}

/* =========================================================
   NAVIGATION HELPERS
   ========================================================= */
document.addEventListener('click', e=>{
  const a = e.target.closest && e.target.closest('.side-nav a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  const t = document.getElementById(a.getAttribute('href').slice(1));
  if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
});
window.addEventListener('scroll', ()=>{
  let cur = null;
  const off = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')) || 70) + 40;
  document.querySelectorAll('main section').forEach(s=>{ if(s.getBoundingClientRect().top <= off) cur = s.id; });
  if(window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = 's5';
  document.querySelectorAll('.side-nav a').forEach(a=> a.classList.toggle('active', a.getAttribute('href') === '#'+cur));
}, {passive:true});
function setTopbarHeight(){
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
}
window.addEventListener('resize', setTopbarHeight);
document.getElementById('resetProgressBtn').addEventListener('click', ()=>{
  if(!confirm('Сбросить прогресс по всем юнитам? Тексты в Writing останутся.')) return;
  saved = {}; store('progress', saved); loadUnit(activeIdx);
});

let start = 0;
try{ const last = parseInt(localStorage.getItem(STORE+':last'), 10); if(last >= 0 && last < UNITS.length) start = last; }catch(e){}
loadUnit(start);
setTopbarHeight();

</script>
</body>
</html>
